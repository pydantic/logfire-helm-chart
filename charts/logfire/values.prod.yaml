# Minimal production overlay.
#
# Copy this file and replace the placeholder hostnames, credentials, and
# provider-specific settings before installing.

imagePullSecrets:
  - logfire-image-key

sizingPreset: standard
adminEmail: sre@example.com

# Optional: set a StorageClass for chart-managed PVCs used by the selected
# sizing preset. Per-workload storageClassName values still take precedence.
# defaultStorageClassName: fast-storage

ingress:
  # Gateway API is enabled below; leave the default Ingress disabled.
  enabled: false

gateway:
  enabled: true
  gatewayClassName: nginx
  tls: true
  hostnames:
    - logfire.example.com

# Helm writes these DSNs to a managed Secret. Argo CD users should set
# postgresSecret.enabled=true and reference an externally managed Secret instead.
postgresDsn: postgresql://logfire_crud:PASSWORD@postgres.example.com:5432/crud
postgresFFDsn: postgresql://logfire_ff:PASSWORD@postgres.example.com:5432/ff

postgresSecret:
  enabled: false
  # name: logfire-postgres-dsns

# Helm can generate app/admin secrets for simple installs. Argo CD users should
# set enabled=true and manage those Secrets outside this chart.
existingSecret:
  enabled: false
  # name: logfire-tokens

adminSecret:
  enabled: false
  # name: logfire-admin

logfire-dex:
  # Password login is disabled, so add at least one connector before inviting
  # users. Examples for GitHub, Azure AD, and Okta:
  # https://pydantic.dev/docs/logfire/deploy/self-hosted-deployment/examples/#sso-provider-examples
  # env:
  #   - name: OIDC_CLIENT_ID
  #     valueFrom:
  #       secretKeyRef:
  #         name: logfire-oidc
  #         key: client-id
  #   - name: OIDC_CLIENT_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: logfire-oidc
  #         key: client-secret
  config:
    enablePasswordDB: false
    # connectors:
    #   - type: oidc
    #     id: sso
    #     name: SSO
    #     config:
    #       issuer: https://idp.example.com
    #       clientID: $OIDC_CLIENT_ID
    #       clientSecret: $OIDC_CLIENT_SECRET
    storage:
      type: postgres
      config:
        host: postgres.example.com
        port: 5432
        user: logfire_dex
        database: dex
        password: PASSWORD
        ssl:
          mode: require

objectStore:
  uri: s3://logfire-prod
  env:
    AWS_DEFAULT_REGION: us-east-1

logfire-redis:
  # Use managed Redis in production; the bundled Redis is single-node.
  enabled: false

# Helm writes this DSN into a managed Secret. Argo CD users should set
# redisSecret.enabled=true and reference an externally managed Secret with the
# sharedDsn, tailDsn, tokenDsn and usageDsn keys instead.
redisDsn: redis://redis.example.com:6379
