{{- include "logfire.validate.pythonObjectStore" . -}}
{{- $persistence := .Values.pythonObjectStore.persistence -}}
{{- if not $persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "logfire.pythonObjectStoreClaimName" . }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: logfire-python-object-store
  annotations:
    {{- merge (dict "helm.sh/resource-policy" "keep") ($persistence.annotations | default dict) | toYaml | nindent 4 }}
spec:
  accessModes:
    {{- toYaml $persistence.accessModes | nindent 4 }}
  {{- include "logfire.storageClassName" (dict "root" . "values" $persistence) | nindent 2 }}
  resources:
    requests:
      storage: {{ $persistence.size | quote }}
{{- end }}
