{{- $tls := include "logfire.effective_tls" . | eq "true" -}}
{{- $hostnames := include "logfire.all_hostnames_string" . | splitList " " -}}
{{- $wsProtocol := $tls | default false | ternary "wss" "ws" -}}
{{- $gatewayCimdEnabled := and $tls (index .Values "logfire-ai-gateway" "enabled") -}}
{{- $gatewayClientId := printf "%s/clients/logfire-gateway.json" (include "logfire.url" .) -}}
{{- $gatewayClientMetadata := dict
  "client_id" $gatewayClientId
  "client_name" "Logfire Gateway CLI"
  "redirect_uris" (list "http://127.0.0.1/callback" "http://localhost/callback")
  "grant_types" (list "authorization_code" "refresh_token" "urn:ietf:params:oauth:grant-type:device_code")
  "response_types" (list "code")
  "token_endpoint_auth_method" "none"
  "scope" "project:gateway_proxy"
  "client_uri" "https://pydantic.dev/docs/ai/overview/gateway/"
  "logo_uri" "https://logfire.pydantic.dev/clients/logfire-gateway.svg"
-}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: logfire-frontend-service-config
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: logfire-frontend-service-config
data:
  config.1.js: |
    window.appConfig = {
      apiHost: '{{ include "logfire.primary_hostname" . }}',
      region: '{{ .Values.logfireRegion | default "local" }}',
      regions: [{"name": "local", "frontend_host": "{{ include "logfire.url" . }}", "api_host": "{{ include "logfire.url" . }}", "auth_host": "{{ include "logfire.url" . }}"}],
      dexPublicUrl: '{{ include "logfire.url" . }}',
      dexDynamicRedirect: {{ .Values.dexDynamicRedirect | default false }},
      appVersion: '{{ .Chart.AppVersion }}',
      selfHosted: true,
      {{ with .Values.variablesApiKey }}
      variablesApiKey: {{ . | toJson }}
      {{- end }}
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logfire-frontend-nginx-config
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: logfire-frontend-nginx-config
data:
  {{- $inClusterTlsEnabled := (include "logfire.inClusterTls.enabled" . | eq "true") }}
  nginx.conf: |
    worker_processes auto;
    error_log stderr notice;


    # from nginx unprivileged: https://github.com/nginxinc/docker-nginx-unprivileged/blob/3dd602719a37ff9b6095c44d4fd7f35b3c07b012/Dockerfile-debian.template#L129-L132
    pid /tmp/nginx.pid;
    daemon off;

    events {
        multi_accept        on;
        worker_connections  1024;
        use                 epoll;
    }

    http {
        # from nginx unprivileged: https://github.com/nginxinc/docker-nginx-unprivileged/blob/3dd602719a37ff9b6095c44d4fd7f35b3c07b012/Dockerfile-debian.template#L129-L132
        proxy_temp_path /tmp/proxy_temp;
        client_body_temp_path /tmp/client_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        aio                   threads;
        aio_write             on;
        tcp_nopush            on;
        tcp_nodelay           on;
        client_max_body_size  0;

        include /etc/nginx/mime.types;

        server_names_hash_bucket_size 128;


        {{- if $inClusterTlsEnabled }}
        server {
            listen 8080 reuseport backlog=4096;
            server_name _;
            access_log /dev/stdout;

            location = /health {
                add_header Content-Type text/plain;
                return 200 "ok\n";
            }

            location / {
                return 404;
            }
        }

        server {
            server_name {{ include "logfire.all_hostnames_string" . }};
            listen {{ .Values.inClusterTls.httpsPort }} ssl reuseport backlog=4096;
            http2 on;
            access_log /dev/stdout;

            ssl_certificate /etc/nginx/tls/tls.crt;
            ssl_certificate_key /etc/nginx/tls/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;

            root /usr/share/nginx/html; # Root directory for the static files

            gzip on;
            gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

            location = /health {
                add_header Content-Type text/plain;
                return 200 "ok\n";
            }

            {{- if $gatewayCimdEnabled }}
            # OAuth Client ID Metadata Document used by the Gateway CLI.
            location = /clients/logfire-gateway.json {
                default_type application/json;
                add_header Cache-Control "public, max-age=300";
                add_header X-Content-Type-Options "nosniff" always;
                return 200 '{{ $gatewayClientMetadata | toJson }}';
            }
            {{- end }}

            # Enhanced JSON view render worker. This worker executes saved/transpiled
            # view code, so it gets a tighter policy than the main app chunks.
            location ~ "^/assets/safeRender-.+\.js$" {
                expires 30d;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cache-Control "public, max-age=2592000";
                add_header Content-Security-Policy "default-src 'none'; script-src blob:; connect-src 'none'; worker-src 'none'; child-src 'none'; img-src 'none'; media-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'none'; frame-ancestors 'none';" always;
            }

            # Custom panels static assets - must come before general static assets
            # to ensure this more specific rule takes precedence
            location ~ "^/custom-panels/.+\.(js|css|png|jpg|jpeg|gif|ico|svg)$" {
                add_header X-Content-Type-Options "nosniff" always;
                add_header Access-Control-Allow-Origin "null" always;
            }
            
            # Location block for static assets (JS, CSS, images)
            # These can be cached for longer as they have hashed names
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 30d;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cache-Control "public, max-age=2592000";
            }

            location = /frontend-assets.txt {
                default_type text/plain;
                add_header Cache-Control "no-store";
                add_header X-Content-Type-Options "nosniff" always;
                try_files /frontend-assets.txt =404;
            }

            location /image-iframe.html {
                add_header "Cache-Control" "no-store";
                try_files /image-iframe.html =404;

                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload;" always;

                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src *; worker-src 'self' blob:; trusted-types default logfirePolicy allow-duplicates tokenizeToString standaloneColorizer editorViewLayer domLineBreaksComputer diffReview  diffEditorWidget  editorGhostText stickyScrollViewLayer defaultWorkerFactory LanguageTool_Executor_Policy; font-src 'self'; object-src 'self' blob:; frame-src 'self'; img-src *; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'self';" always;
            }

            location /audio-iframe.html {
                add_header "Cache-Control" "no-store";
                try_files /audio-iframe.html =404;

                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload;" always;

                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src *; worker-src 'self' blob:; trusted-types default logfirePolicy allow-duplicates tokenizeToString standaloneColorizer editorViewLayer domLineBreaksComputer diffReview  diffEditorWidget  editorGhostText stickyScrollViewLayer defaultWorkerFactory LanguageTool_Executor_Policy; font-src 'self'; object-src 'self' blob:; frame-src 'self'; media-src *; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'self';" always;
            }

            # custom panels iframe
            location /custom-components-iframe.html {
                add_header "Cache-Control" "no-store";
                try_files /custom-components-iframe.html =404;

                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload;" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cross-Origin-Opener-Policy "same-origin" always;
                add_header Referrer-Policy "no-referrer" always;
                # Custom panels may fetch user-selected APIs, so `connect-src *` is intentional.
                # The response sandbox keeps direct navigations in an opaque origin.
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src *; worker-src 'self' blob:; trusted-types default logfirePolicy allow-duplicates tokenizeToString standaloneColorizer editorViewLayer domLineBreaksComputer diffReview  diffEditorWidget  editorGhostText stickyScrollViewLayer defaultWorkerFactory LanguageTool_Executor_Policy; font-src 'self'; object-src 'self' blob:; frame-src 'self'; img-src *; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'self'; sandbox allow-scripts;" always;
            }

            # Serve the generated config file from the ephemeral directory:
            location = /config.1.js {
                alias /opt/nginx/config.1.js;
                default_type application/javascript;
                add_header Cache-Control "no-store";
                add_header X-Content-Type-Options "nosniff" always;
            }

            location /genai-prices/data.json {
              rewrite /genai-prices/data.json /pydantic/genai-prices/main/prices/new_data/v2/data.json  break;
              proxy_pass https://raw.githubusercontent.com;
              proxy_redirect off;

              add_header X-Content-Type-Options "nosniff" always;
            }

            # OAuth consent/device screens render third-party OAuth client logos.
            location ~ ^/auth/(oauth-consent|oauth-device)$ {
                try_files $uri @auth_index;
            }

            location ~ "^/public-trace/[^\/]+$" {
                try_files $uri @public_trace_index;
            }

            location = / {
                add_header "Cache-Control" "no-store";
                try_files /index.html =404;

                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload;" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Security-Policy "default-src 'self';script-src 'self' 'unsafe-inline' 'unsafe-eval';style-src 'self' 'unsafe-inline';connect-src 'self' {{ include "logfire.all_urls" . }}{{ range $hostnames }} {{ $wsProtocol }}://{{ . }}{{ end }} https://esm.sh;worker-src 'self' blob:;trusted-types default logfirePolicy allow-duplicates tokenizeToString standaloneColorizer editorViewLayer domLineBreaksComputer diffReview  diffEditorWidget  editorGhostText stickyScrollViewLayer defaultWorkerFactory LanguageTool_Executor_Policy;font-src 'self';object-src 'none';frame-src 'self';img-src 'self' https://cdn.jsdelivr.net/ https://github.com https://avatars.githubusercontent.com https://*.slack-edge.com blob: data:;base-uri 'self';form-action 'self';manifest-src 'self';frame-ancestors 'self';" always;
            }

            # Main location block for the app
            location / {
                index index.html index.htm;
                try_files $uri $uri/ @index;
            }

            # Fallback location for OAuth auth screens that need broader remote image support.
            location @auth_index {
                add_header "Cache-Control" "no-store";
                try_files /index.html =404;

                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload;" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Security-Policy "default-src 'self';script-src 'self' 'unsafe-inline' 'unsafe-eval';style-src 'self' 'unsafe-inline';connect-src 'self' {{ include "logfire.all_urls" . }}{{ range $hostnames }} {{ $wsProtocol }}://{{ . }}{{ end }} https://esm.sh;worker-src 'self' blob:;trusted-types default logfirePolicy allow-duplicates tokenizeToString standaloneColorizer editorViewLayer domLineBreaksComputer diffReview  diffEditorWidget  editorGhostText stickyScrollViewLayer defaultWorkerFactory LanguageTool_Executor_Policy;font-src 'self';object-src 'none';frame-src 'self';img-src 'self' https: blob: data:;base-uri 'self';form-action 'self';manifest-src 'self';frame-ancestors 'self';" always;
            }

            # Fallback location for public trace pages: allows iframes from any origin.
            location @public_trace_index {
                add_header "Cache-Control" "no-store";
                try_files /index.html =404;

                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload;" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Security-Policy "default-src 'self';script-src 'self' 'unsafe-inline' 'unsafe-eval';style-src 'self' 'unsafe-inline';connect-src 'self' {{ include "logfire.all_urls" . }}{{ range $hostnames }} {{ $wsProtocol }}://{{ . }}{{ end }} https://esm.sh;worker-src 'self' blob:;trusted-types default logfirePolicy allow-duplicates tokenizeToString standaloneColorizer editorViewLayer domLineBreaksComputer diffReview  diffEditorWidget  editorGhostText stickyScrollViewLayer defaultWorkerFactory LanguageTool_Executor_Policy;font-src 'self';object-src 'none';frame-src 'self';img-src 'self' https://cdn.jsdelivr.net/ https://github.com https://avatars.githubusercontent.com https://*.slack-edge.com blob: data:;base-uri 'self';form-action 'self';manifest-src 'self';frame-ancestors *;" always;
            }

            # Fallback location for SPA routing
            location @index {
                add_header "Cache-Control" "no-store";
                try_files /index.html =404;

                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload;" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Content-Security-Policy "default-src 'self';script-src 'self' 'unsafe-inline' 'unsafe-eval';style-src 'self' 'unsafe-inline';connect-src 'self' {{ include "logfire.all_urls" . }}{{ range $hostnames }} {{ $wsProtocol }}://{{ . }}{{ end }} https://esm.sh;worker-src 'self' blob:;trusted-types default logfirePolicy allow-duplicates tokenizeToString standaloneColorizer editorViewLayer domLineBreaksComputer diffReview  diffEditorWidget  editorGhostText stickyScrollViewLayer defaultWorkerFactory LanguageTool_Executor_Policy;font-src 'self';object-src 'none';frame-src 'self';img-src 'self' https://cdn.jsdelivr.net/ https://github.com https://avatars.githubusercontent.com https://*.slack-edge.com blob: data:;base-uri 'self';form-action 'self';manifest-src 'self';frame-ancestors 'self';" always;
            }

            error_page 404 = @notfound;
            location @notfound {
                add_header Cache-Control "no-cache, no-store" always;
                add_header X-Content-Type-Options "nosniff" always;
                return 404;
            }

            # Security Headers
            add_header X-Content-Type-Options "nosniff" always;

        }
        {{- else }}
        server {
            server_name {{ include "logfire.all_hostnames_string" . }};
            listen 8080 reuseport backlog=4096;
            http2 on;
            access_log /dev/stdout;

            root /usr/share/nginx/html; # Root directory for the static files

            gzip on;
