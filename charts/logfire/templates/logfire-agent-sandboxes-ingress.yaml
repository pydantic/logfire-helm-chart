{{- $a := .Values.agentSandboxes | default dict -}}
{{- $class := .Values.ingress.ingressClassName | default "" -}}
{{- if and $a.enabled .Values.ingress.enabled (or (eq $class "") (contains "nginx" $class)) -}}
{{- $tls := include "logfire.inClusterTls.enabled" . | eq "true" -}}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) -}}
{{- $_ := set $annotations "nginx.ingress.kubernetes.io/backend-protocol" (ternary "GRPCS" "GRPC" $tls) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logfire-monty-ingress
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hostnames }}
    - host: {{ . }}
      http:
        paths:
          - path: /monty.v1.MontySession/Session
            pathType: Exact
            backend:
              service:
                name: logfire-service
                port:
                  number: 8082
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - secretName: {{ .Values.ingress.secretName }}
      hosts:
        {{- toYaml .Values.ingress.hostnames | nindent 8 }}
  {{- end }}
{{- end }}
