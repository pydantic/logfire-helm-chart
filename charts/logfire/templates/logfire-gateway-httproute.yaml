{{- if .Values.gateway.enabled -}}
{{- $result := include "logfire.effective_hostnames" . | fromJson -}}
{{- $hosts := $result.hosts -}}
{{- $hasHosts := gt (len $hosts) 0 -}}
{{- $gatewayName := .Values.gateway.name | default "logfire-gateway" -}}
{{- $redirect := false -}}
{{- range .Values.gateway.filters | default list -}}
{{- if eq .type "RequestRedirect" -}}
{{- $redirect = true -}}
{{- end -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logfire-httproute
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      {{- if and (not .Values.gateway.create) .Values.gateway.namespace }}
      namespace: {{ .Values.gateway.namespace }}
      {{- end }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- $backendPort := 8080 -}}
  {{- if (include "logfire.inClusterTls.enabled" . | eq "true") -}}
  {{- $backendPort = .Values.inClusterTls.httpsPort -}}
  {{- end -}}
  {{- if $hasHosts }}
  hostnames:
    {{- toYaml $hosts | nindent 4 }}
  {{- end }}
  rules:
    {{- if not $redirect }}
    {{- $grpcMatches := include "logfire.grpc.gatewayMatches" . | fromJsonArray }}
    {{- if $grpcMatches }}
    {{- /*
    Keep edge restrictions. Omit rewrites that can change the gRPC
    method path. Put gRPC first to win ties with an exact web match.
    */}}
    {{- $grpcFilters := list }}
    {{- range .Values.gateway.filters | default list }}
    {{- if ne .type "URLRewrite" }}
    {{- $grpcFilters = append $grpcFilters . }}
    {{- end }}
    {{- end }}
    - matches:
        {{- toYaml $grpcMatches | nindent 8 }}
      {{- with $grpcFilters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: logfire-service
          port: {{ include "logfire.grpc.port" . }}
      timeouts:
        request: 0s
        backendRequest: 0s
    {{- end }}
    {{- end }}
    - matches:
        {{- if .Values.gateway.matches }}
        {{- toYaml .Values.gateway.matches | nindent 8 }}
        {{- else }}
        - path:
            type: PathPrefix
            value: /
        {{- end }}
      {{- with .Values.gateway.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not $redirect }}
      backendRefs:
        - name: logfire-service
          port: {{ $backendPort }}
      {{- with .Values.gateway.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
{{- end }}
