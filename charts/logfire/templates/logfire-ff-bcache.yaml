{{- $serviceName := "logfire-ff-bcache" }}
{{- $containerSecurityContext := include "logfire.containerSecurityContext" (dict "ctx" . "serviceName" $serviceName) | fromJson }}
{{- $podSecurityContext := include "logfire.fusionfirePodSecurityContext" (dict "ctx" . "serviceName" $serviceName) | fromJson -}}
{{- $effectiveServiceValues := include "logfire.effectiveServiceValues" (dict "Values" .Values "serviceName" $serviceName) | fromJson -}}
{{- $tls := include "logfire.inClusterTls.enabled" . | eq "true" -}}
{{- $portName := ternary "https" "http" $tls -}}
{{- $scheme := ternary "HTTPS" "HTTP" $tls -}}
{{- $disk := get $effectiveServiceValues "disk" | default dict -}}
{{- $diskStorage := get $disk "storage" | default "32Gi" -}}
{{- $diskMi := int (include "logfire.storageQuantityToMi" $diskStorage) -}}
{{- $grace := 35 -}}
{{- $selector := dict "matchLabels" (dict "app.kubernetes.io/component" $serviceName) -}}
{{- $defaultTopologySpreadConstraints := list
  (dict "maxSkew" 1 "topologyKey" "topology.kubernetes.io/zone" "whenUnsatisfiable" "ScheduleAnyway" "labelSelector" $selector)
  (dict "maxSkew" 1 "topologyKey" "kubernetes.io/hostname" "whenUnsatisfiable" "ScheduleAnyway" "labelSelector" $selector)
-}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}-internal
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  annotations:
    {{- include "logfire.serviceAnnotations" (dict "Values" .Values "serviceName" $serviceName) | nindent 4 }}
spec:
  selector:
    {{- include "logfire.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  ports:
  - name: {{ $portName }}
    port: 9443
    targetPort: {{ $portName }}
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    {{- include "logfire.workloadLabels" (dict "Values" .Values "serviceName" $serviceName) | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  annotations:
    {{- include "logfire.workloadAnnotations" (dict "Values" .Values "serviceName" $serviceName) | nindent 4 }}
spec:
  serviceName: {{ $serviceName }}-internal
  {{- include "logfire.replicas" (dict "Values" .Values "serviceName" $serviceName) | nindent 2 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    # A scaled-in pod can stay away for hours. Its disk would come back with
    # blocks of objects that were deleted meanwhile, so the claim goes with it.
    whenScaled: Delete
  selector:
    matchLabels:
      {{- include "logfire.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $serviceName }}
  template:
    metadata:
      labels:
        {{- include "logfire.selectorLabels" . | nindent 8 }}
        {{- include "logfire.podLabels" (dict "Values" .Values "serviceName" $serviceName) | nindent 8 }}
        app.kubernetes.io/component: {{ $serviceName }}
      annotations:
        {{- include "logfire.podAnnotations" (dict "Values" .Values "serviceName" $serviceName) | nindent 8 }}
        {{- include "logfire.inClusterTls.server.checksumAnnotation" (dict "ctx" . "serviceName" $serviceName) | nindent 8 }}
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $grace }}
      serviceAccountName: {{ include "logfire.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . | quote }}
      {{- end }}
      {{- end }}
      {{- include "logfire.initContainers" (dict "ctx" . "serviceName" $serviceName) | nindent 6}}
      {{- include "logfire.securityContext" $podSecurityContext | nindent 6 }}
      {{- include "logfire.podScheduling" (dict "Values" .Values "serviceName" $serviceName "defaultTopologySpreadConstraints" $defaultTopologySpreadConstraints) | nindent 6}}
      containers:
        - name: {{ $serviceName }}
          image: '{{ .Values.image.repository | default "" }}{{ .Values.image.bcacheImage }}:{{ include "logfire.serviceTag" (dict "Values" .Values "serviceName" $serviceName "Chart" .Chart) }}'
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          {{- include "logfire.securityContext" $containerSecurityContext | nindent 10 }}
          {{- include "logfire.resources" (dict "Values" .Values "serviceName" $serviceName) | nindent 10 }}
          env:
            {{- include "logfire.otlpExporterEnv" (dict "root" . "serviceName" $serviceName "codeWorkDir" "/app") | nindent 12 }}
            {{- include "logfire.objectStoreEnv" . | nindent 12 }}
            {{- include "logfire.ffResourceEnv" (dict "Values" .Values "serviceName" $serviceName) | nindent 12 }}
            - name: FF_FORCE_CONSOLE_LOGGING
              value: {{ .Values.fusionfireForceConsoleLogging | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.05"
            - name: FF_BCACHE_LISTEN_ADDR
              value: "0.0.0.0:9443"
            - name: FF_BCACHE_DISK_DIR
              value: /bcache-data
            # bcache byte sizes take `MB` for MiB. Leave a fifth of the volume free.
            - name: FF_BCACHE_DISK_CAPACITY
              value: {{ printf "%dMB" (max 1 (div (mul $diskMi 4) 5)) | quote }}
            - name: FF_BCACHE_READINESS_DELAY
              value: "10s"
            - name: FF_BCACHE_SHUTDOWN_TIMEOUT
              value: "25s"
            - name: FF_BCACHE_TIER_DRAIN_TIMEOUT
              value: "5s"
            {{- if $tls }}
            - name: FF_TLS_MODE
              value: require
            - name: FF_TLS_CERT_PATH
              value: /etc/tls/tls.crt
            - name: FF_TLS_KEY_PATH
              value: /etc/tls/tls.key
            {{- end }}
            {{- with (index .Values $serviceName | default dict).env }}
              {{- . | toYaml | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "logfire.tmpVolumeMounts" . | nindent 12 }}
            - name: bcache-data
              mountPath: /bcache-data
            {{- include "logfire.objectStoreVolumeMounts" . | nindent 12 }}
            {{- include "logfire.inClusterTls.server.volumeMount" (dict "ctx" . "mountPath" "/etc/tls") | nindent 12 }}
          ports:
            - name: {{ $portName }}
              containerPort: 9443
          # `/health` drops the pod from the EndpointSlices well inside the readiness delay.
          readinessProbe:
            httpGet:
              path: /health
              port: 9443
              scheme: {{ $scheme }}
            periodSeconds: 2
            failureThreshold: 1
          # `/health` answers 503 for the whole shutdown, so liveness must outlast the grace period.
          livenessProbe:
            httpGet:
              path: /health
              port: 9443
              scheme: {{ $scheme }}
            periodSeconds: 10
            failureThreshold: {{ add (div (add $grace 9) 10) 1 }}
          # Allows up to 300 seconds of disk tier recovery before the socket binds.
          startupProbe:
            httpGet:
              path: /health
              port: 9443
              scheme: {{ $scheme }}
            periodSeconds: 10
            failureThreshold: 30
      volumes:
      {{- include "logfire.tmpVolume" . | nindent 6 }}
      {{- include "logfire.inClusterTls.server.volume" (dict "ctx" . "serviceName" $serviceName) | nindent 6 }}
      {{- include "logfire.objectStoreVolumes" . | nindent 6 }}
  volumeClaimTemplates:
    - metadata:
        name: bcache-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- include "logfire.storageClassName" (dict "root" . "values" $disk) | nindent 8 }}
        resources:
          requests:
            storage: {{ $diskStorage }}
{{- template "logfire.autoscaler" (dict "Values" .Values "serviceName" $serviceName) }}
{{- template "logfire.pdb" (dict "root" $ "serviceName" $serviceName) }}
