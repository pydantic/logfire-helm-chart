{{- $dexConfig := dig "config" dict (index .Values "logfire-dex" | default dict) | deepCopy }}
{{- $logfireFrontend := include "logfire.url" . }}
{{- $web := dict "http" "0.0.0.0:5556" }}
{{- $grpc := dict "addr" "0.0.0.0:5557" }}
{{- if include "logfire.inClusterTls.enabled" . | eq "true" }}
  {{- $_ := set $web "https" (printf "0.0.0.0:%v" .Values.inClusterTls.httpsPort) }}
  {{- range list $web $grpc }}
    {{- $_ := set . "tlsCert" "/etc/dex/tls/tls.crt" }}
    {{- $_ := set . "tlsKey" "/etc/dex/tls/tls.key" }}
  {{- end }}
{{- end }}
{{- $redirects := list }}
{{- range $url := include "logfire.all_urls" . | splitList " " }}
  {{- range list "code-callback" "link-provider-code-callback" "authorize-device-token-sso-callback" }}
    {{- $redirects = append $redirects (printf "%s/auth/%s" $url .) }}
  {{- end }}
{{- end }}
{{- $client := dict
    "id" "logfire-backend"
    "name" "Logfire Backend"
    "secretEnv" "LOGFIRE_CLIENT_SECRET"
    "redirectURIs" $redirects
    "public" false
    "scopes" (list "openid" "email" "profile") }}
{{- /* Dex reads both as lists. Older values may key them by name, so take the values. */}}
{{- $staticClients := list $client }}
{{- range $dexConfig.staticClients }}
  {{- $staticClients = append $staticClients . }}
{{- end }}
{{- $connectors := list }}
{{- range $dexConfig.connectors }}
  {{- if and .config (not (hasKey .config "redirectURI")) }}
    {{- $_ := set .config "redirectURI" (printf "%s/auth-api/callback" $logfireFrontend) }}
  {{- end }}
  {{- $connectors = append $connectors . }}
{{- end }}
{{- $_ := set $dexConfig "issuer" (printf "%s/auth-api" $logfireFrontend) }}
{{- $_ := set $dexConfig "staticClients" $staticClients }}
{{- $_ := set $dexConfig "frontend" (dict "extra" (dict "logfire_frontend_host" $logfireFrontend)) }}
{{- $_ := set $dexConfig "oauth2" (dict "skipApprovalScreen" true "passwordConnector" "local") }}
{{- $_ := set $dexConfig "web" $web }}
{{- $_ := set $dexConfig "grpc" $grpc }}
{{- /* Dex refuses to start without a connector, and its password database counts as one. So the
database stays on while password sign-in is on, for installs that have no other connector. */}}
{{- $_ := set $dexConfig "enablePasswordDB" (include "logfire.passwordLoginEnabled" . | eq "true") }}
{{- $_ := set $dexConfig "connectors" $connectors -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logfire.dexSecretName" . }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
type: Opaque
data:
  config.yaml: {{ toYaml $dexConfig | b64enc | quote }}
