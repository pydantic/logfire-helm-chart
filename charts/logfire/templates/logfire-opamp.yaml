{{- if (include "logfire.fleet.enabled" . | eq "true") }}
{{- /*
The Fleet OpAMP server. Collectors, the Logfire SDKs and the Kubernetes Operator hold a WebSocket
to `/v1/opamp`, which `logfire-service` routes here. Each connect's credential is resolved by
`logfire-backend-auth`; each agent's state goes through `logfire-fleet-control`.

The public listener serves only `/v1/opamp`. Probes and the HAProxy health check use the plain
admin listener. With in-cluster TLS the public listener serves the chart's certificate on
`inClusterTls.httpsPort`, as the other workloads' HTTPS ports do.
*/ -}}
{{- $serviceName := "logfire-opamp" }}
{{- $containerSecurityContext := include "logfire.containerSecurityContext" (dict "ctx" . "serviceName" $serviceName) | fromJson }}
{{- $tls := include "logfire.inClusterTls.enabled" . | eq "true" }}
{{- $publicPort := include "logfire.fleet.opampPort" . | int }}
{{- $adminPort := 4321 }}
{{- $authPort := include "logfire.port" (dict "port" 8000 "root" .) }}
{{- $controlPort := include "logfire.port" (dict "port" (include "logfire.fleet.controlPort" . | int) "root" .) }}
{{- $publicUrl := include "logfire.fleet.opampUrl" . }}
{{- /* Seconds. A stop sleeps in preStop while the pod leaves the endpoints, closes its sockets one
       at a time over the drain (plus up to 5 s for the last answer), then has the shutdown twice:
       for the stop and for its background tasks. The grace period covers all of it. */ -}}
{{- $preStopSeconds := 5 }}
{{- $drainSeconds := 30 }}
{{- $shutdownSeconds := 20 }}
{{- $gracePeriod := add $preStopSeconds $drainSeconds 5 (mul 2 $shutdownSeconds) 10 }}
{{- include "logfire.validateConfig" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  annotations:
    {{- include "logfire.serviceAnnotations" (dict "Values" .Values "serviceName" $serviceName) | nindent 4 }}
spec:
  selector:
    {{- include "logfire.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  ports:
  - port: {{ $publicPort }}
    targetPort: {{ $publicPort }}
    name: {{ ternary "https" "http" $tls | quote }}
    {{- if $tls }}
    appProtocol: HTTPS
    {{- end }}
  - port: {{ $adminPort }}
    targetPort: {{ $adminPort }}
    name: "admin"
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    {{- include "logfire.workloadLabels" (dict "Values" .Values "serviceName" $serviceName) | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  annotations:
    {{- include "logfire.workloadAnnotations" (dict "Values" .Values "serviceName" $serviceName "secretSources" (list "existing")) | nindent 4 }}
spec:
  {{- include "logfire.replicas" (dict "Values" .Values "serviceName" $serviceName) | nindent 2 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  # Every pod stopped sends its agents back to the others, so a rollout takes one pod at a time
  # and waits out its drain before it stops the next.
  minReadySeconds: {{ add $preStopSeconds $drainSeconds 5 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "logfire.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $serviceName }}
  template:
    metadata:
      annotations:
        {{- if or (not .Values.existingSecret.enabled) (empty .Values.existingSecret.annotations) }}
        {{- include "logfire.logfireSecretChecksumAnnotations" (dict "ctx" . "secrets" (list "logfire-fleet-transport-token")) | nindent 8 }}
        {{- end }}
        {{- include "logfire.podAnnotations" (dict "Values" .Values "serviceName" $serviceName) | nindent 8 }}
      labels:
        {{- include "logfire.selectorLabels" . | nindent 8 }}
        {{- include "logfire.podLabels" (dict "Values" .Values "serviceName" $serviceName) | nindent 8 }}
        app.kubernetes.io/component: {{ $serviceName }}
    spec:
      {{- include "logfire.standardPodSpecFields" (dict "ctx" . "serviceName" $serviceName) | nindent 6 }}
      containers:
        - name: {{ $serviceName }}
          image: '{{ .Values.image.repository | default "" }}{{ .Values.image.opampImage | default "logfire-opamp" }}:{{ include "logfire.serviceTag" (dict "Values" .Values "serviceName" $serviceName "Chart" .Chart) }}'
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          {{- include "logfire.securityContext" $containerSecurityContext | nindent 10 }}
          {{- include "logfire.resources" (dict "Values" .Values "serviceName" $serviceName) | nindent 10 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - "sleep"
                  - {{ $preStopSeconds | quote }}
          ports:
            - containerPort: {{ $publicPort }}
              protocol: TCP
              name: {{ ternary "https" "http" $tls | quote }}
            - containerPort: {{ $adminPort }}
              protocol: TCP
              name: "admin"
          startupProbe:
            httpGet:
              path: /health/ready
              port: {{ $adminPort }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ $adminPort }}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ $adminPort }}
            periodSeconds: 5
            timeoutSeconds: 3
          env:
            - name: OPAMP_LISTEN
              value: "0.0.0.0:{{ $publicPort }}"
            - name: OPAMP_ADMIN_LISTEN
              value: "0.0.0.0:{{ $adminPort }}"
            - name: OPAMP_PUBLIC_URL
              value: {{ $publicUrl | quote }}
            - name: OPAMP_AUTH_URL
              value: "{{ include "logfire.scheme" . }}://logfire-backend-auth:{{ $authPort }}"
            - name: OPAMP_CONTROL_URL
              value: "{{ include "logfire.scheme" . }}://logfire-fleet-control:{{ $controlPort }}"
            - name: FLEET_TRANSPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "logfire.externalSecretName" (dict "external" .Values.existingSecret "secretName" "logfire-fleet-transport-token") }}
                  key: logfire-fleet-transport-token
            {{- if $tls }}
            - name: OPAMP_AUTH_CA_PATH
              value: /etc/logfire/incluster-ca/ca.crt
            - name: OPAMP_TLS_CERT_PATH
              value: /etc/tls/tls.crt
            - name: OPAMP_TLS_KEY_PATH
              value: /etc/tls/tls.key
            {{- end }}
            {{- if or (not $tls) (hasPrefix "ws://" $publicUrl) }}
            # Plain HTTP to logfire-backend-auth and logfire-fleet-control (in-cluster TLS is off),
            # or a ws:// public URL (the public hostname has no TLS).
            - name: OPAMP_ALLOW_INSECURE_AUTH
              value: "true"
            {{- end }}
            # Connections a pod takes at once before their first message, per credential, per
            # project and in all: every replica of an SDK app shares one key, so a restart of a
            # large deployment reconnects many agents on one credential.
            - name: OPAMP_MAX_HANDSHAKES
              value: "512"
            - name: OPAMP_MAX_PENDING_PER_CREDENTIAL
              value: "256"
            - name: OPAMP_MAX_PENDING_PER_PROJECT
              value: "256"
            - name: OPAMP_DRAIN_SECONDS
              value: {{ $drainSeconds | quote }}
            - name: OPAMP_SHUTDOWN_SECONDS
              value: {{ $shutdownSeconds | quote }}
            # The server closes each socket at a random age before this (45 to 55 minutes), so
            # agents spread across pods again after a scale-out, and a proxy in front that limits
            # a WebSocket's age to an hour never cuts them all at once.
            - name: OPAMP_LB_TIMEOUT_SECONDS
              value: "3600"
            # Its own spans and warnings go to the bundled collector, which ignores the token.
            - name: LOGFIRE_TOKEN
              value: "unused"
            - name: LOGFIRE_BASE_URL
              value: http://logfire-otel-collector:4318
            - name: LOGFIRE_SERVICE_NAME
              value: {{ $serviceName }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ include "logfire.otelResourceAttributes" (dict "root" . "serviceName" $serviceName "codeWorkDir" "/app") | quote }}
            - name: RUST_LOG
              value: "warn,logfire_opamp=info,opamp_server=info"
            {{- with include "logfire.serviceEnv" (dict "Values" .Values "serviceName" $serviceName) }}
              {{- . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "logfire.tmpVolumeMounts" . | nindent 12 }}
            {{- include "logfire.inClusterTls.caBundle.volumeMount" (dict "ctx" . "mountPath" "/etc/logfire/incluster-ca") | nindent 12 }}
            {{- include "logfire.inClusterTls.server.volumeMount" (dict "ctx" . "mountPath" "/etc/tls") | nindent 12 }}
      volumes:
        {{- include "logfire.tmpVolume" . | nindent 8 }}
        {{- include "logfire.inClusterTls.caBundle.volume" (dict "ctx" .) | nindent 8 }}
        {{- include "logfire.inClusterTls.server.volume" (dict "ctx" . "serviceName" $serviceName) | nindent 8 }}
      terminationGracePeriodSeconds: {{ $gracePeriod }}
{{- template "logfire.autoscaler" (dict "Values" .Values "serviceName" $serviceName) }}
{{- template "logfire.pdb" (dict "root" $ "serviceName" $serviceName) }}
{{- end }}
