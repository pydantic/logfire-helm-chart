{{- $serviceName := "logfire-otel-collector" }}
{{- $collectorValues := include "logfire.effectiveServiceValues" (dict "Values" .Values "serviceName" $serviceName) | fromJson }}
{{- $memoryLimitMi := include "logfire.otelCollectorMemoryLimitMi" . | trim }}
{{- $queueSizeBytes := $collectorValues.sendingQueueBytes | default .Values.otel_collector.sendingQueueBytes | default 67108864 }}
{{- $queueStorage := .Values.otel_collector.queueStorage }}
{{- include "logfire.validate.otelQueueStorage" . }}
{{- include "logfire.validate.otelSelfMetricsPort" . }}
{{- include "logfire.validate.otelExtraComponents" . }}
{{- $prometheusEnabled := include "isPrometheusExporterEnabled" . | trim | eq "true" }}
{{- $promValues := .Values.otel_collector.prometheus | default dict }}
{{- $selfMetrics := .Values.otel_collector.selfMetrics | default dict }}
{{- $selfMetricsEnabled := dig "enabled" true $selfMetrics }}
{{- /* receiver_failed_* stays zero with receiverhelper.newReceiverMetrics disabled. Reassess when the image or gate changes. */ -}}
{{- $selfMetricNames := "otelcol_(exporter_(queue_(size|capacity)|(enqueue_failed|send_failed|sent)_(spans|log_records|metric_points))|receiver_(accepted|refused)_(spans|log_records|metric_points))" }}
{{- $delta_to_cumulative := true }}
{{- if hasKey $promValues "delta_to_cumulative" }}
{{- $delta_to_cumulative = $promValues.delta_to_cumulative }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
            keepalive:
              enforcement_policy:
                min_time: 60s
                permit_without_stream: false
          http:
            endpoint: "0.0.0.0:4318"
      {{- if $selfMetricsEnabled }}
      prometheus/self:
        config:
          scrape_configs:
            - job_name: otelcol
              scrape_interval: 60s
              static_configs:
                - targets: ["127.0.0.1:{{ .Values.otel_collector.selfMetricsPort | default 8888 }}"]
              metric_relabel_configs:
                - source_labels: [__name__]
                  action: keep
                  regex: {{ $selfMetricNames | squote }}
                - source_labels: [receiver]
                  action: drop
                  regex: prometheus/self
      {{- end }}

    exporters:
      {{- if .Values.otel_collector.debug.enabled }}
      debug:
      {{- end }}
      {{- $exporter := .Values.otel_collector.exporter | default dict }}
      otlp_http:
        endpoint: {{ $exporter.endpoint | default "http://logfire-ff-ingest:8012" }}
        tls:
          {{- ($exporter.tls | default (dict "insecure" true)) | toYaml | nindent 10 }}
        {{- if $exporter.headers }}
        headers:
          {{- $exporter.headers | toYaml | nindent 10 }}
        {{- else }}
        headers:
          Authorization: "Bearer ${LOGFIRE_META_WRITE_TOKEN}"
        {{- end }}
        # Each signal has its own byte-bounded queue. Disk mode survives container crashes,
        # but the per-pod emptyDir is lost on pod replacement. Receiver rejection lets senders
        # retry queue/storage overflow; successful enqueue does not guarantee delivery.
        sending_queue:
          {{- $queueDefaults := dict "enabled" true "sizer" "bytes" "queue_size" ($queueSizeBytes | int64) }}
          {{- if $queueStorage.enabled }}
          {{- $_ := set $queueDefaults "storage" "file_storage/queue" }}
          {{- end }}
          {{- mergeOverwrite $queueDefaults (deepCopy ($exporter.sending_queue | default dict)) | toYaml | nindent 10 }}
      {{- if include "isPrometheusExporterEnabled" . | trim | eq "true" }}
      {{- with .Values.otel_collector.prometheus }}
      {{- $translationStrategy := .translation_strategy | default (ternary "UnderscoreEscapingWithSuffixes" "UnderscoreEscapingWithoutSuffixes" .add_metric_suffixes) }}
      prometheus:
        endpoint: {{ printf "%s:%s" .endpoint (.port | toString) }}
        send_timestamps: {{ .send_timestamp }}
        metric_expiration: {{ .metric_expiration }}
        enable_open_metrics: {{ .enable_open_metrics }}
        translation_strategy: {{ $translationStrategy }}
        {{- with .resource_to_telemetry_conversion }}
        resource_to_telemetry_conversion:
        {{- . | toYaml | nindent 12 }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- with .Values.otel_collector.extraExporters }}
      {{- toYaml . | nindent 6 }}
      {{- end }}


    processors:
      {{- if $selfMetricsEnabled }}
      filter/self:
        error_mode: ignore
        metrics:
          metric:
            - 'not IsMatch(name, "^{{ $selfMetricNames }}$")'
          datapoint:
            - 'attributes["receiver"] == "prometheus/self"'
      resourcedetection/self:
        detectors: [env]
        override: false
      resource/self:
        attributes:
          - {key: service.name, value: logfire-otel-collector, action: upsert}
          - {key: otel.collector.role, value: gateway, action: upsert}
          - {key: service.namespace, value: {{ .Release.Namespace | quote }}, action: upsert}
          - {key: service.instance.id, value: "${env:OTELCOL_POD_UID}", action: upsert}
          - {key: k8s.pod.uid, value: "${env:OTELCOL_POD_UID}", action: upsert}
          - {key: k8s.pod.name, value: "${env:OTELCOL_POD_NAME}", action: upsert}
          - {key: k8s.namespace.name, value: "${env:OTELCOL_POD_NAMESPACE}", action: upsert}
      {{- end }}
      memory_limiter:
        check_interval: 1s
        {{- if $memoryLimitMi }}
        # Track the memory limit this deployment renders for the collector.
        limit_percentage: 75
        spike_limit_percentage: 15
        {{- else }}
        # No container memory limit is rendered for this deployment, so percentage limits would
        # be computed from the node's memory. Keep the fixed fallback.
        limit_mib: 512
        spike_limit_mib: 128
        {{- end }}
      {{- if and $prometheusEnabled $delta_to_cumulative }}
      # Delta-to-cumulative for the Prometheus exporter only. The processor is alpha. The
      # otlp_http metrics pipeline stays delta, so this conversion is scoped to the Prometheus
      # pipeline behind `delta_to_cumulative`. `max_streams` caps the retained stream map; the
      # in-pipeline `memory_limiter` bounds ingress but cannot evict this processor's state, so an
      # unbounded cap lets high-cardinality attributes grow until the collector refuses telemetry.
      # Streams past the cap are dropped, so raise it for high-cardinality scrapes.
      delta_to_cumulative:
        max_stale: {{ $promValues.max_stale | default "5m" }}
        max_streams: {{ $promValues.max_streams | default 10000 }}
      {{- end }}
      k8s_attributes:
        filter:
          namespace: {{ .Release.Namespace }}
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.replicaset.name
            - k8s.replicaset.uid
            - k8s.daemonset.name
            - k8s.daemonset.uid
            - k8s.job.name
            - k8s.job.uid
            - k8s.cronjob.name
            - k8s.statefulset.name
            - k8s.statefulset.uid
            - container.image.name
            - container.image.tag
            - container.id
            - k8s.container.name
            - container.image.name
            - container.image.tag
            - container.id
          labels:
            - tag_name: kube_app_name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: kube_app_instance
              key: app.kubernetes.io/instance
              from: pod
            - tag_name: kube_app_version
              key: app.kubernetes.io/version
              from: pod
            - tag_name: kube_app_component
              key: app.kubernetes.io/component
              from: pod
            - tag_name: kube_app_part_of
              key: app.kubernetes.io/part-of
              from: pod
            - tag_name: kube_app_managed_by
              key: app.kubernetes.io/managed-by
              from: pod
      {{- with .Values.otel_collector.extraProcessors }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    extensions:
      {{- if $queueStorage.enabled }}
      file_storage/queue:
        directory: /var/lib/otelcol/queue
        create_directory: true
        fsync: {{ $queueStorage.fsync }}
        max_size: {{ $queueStorage.maxSizeBytes | int64 }}
        compaction:
          directory: /var/lib/otelcol/queue/compaction
          on_rebound: true
          # Reclaim disk and mmap allocations after an outage drains.
          rebound_needed_threshold_mib: {{ min 100 (div ($queueStorage.maxSizeBytes | int64) 1048576) }}
          rebound_trigger_threshold_mib: {{ min 10 (div ($queueStorage.maxSizeBytes | int64) 1048576) }}
          cleanup_on_start: true
      {{- end }}
      health_check:
        endpoint: "0.0.0.0:13133"

    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: {{ .Values.otel_collector.selfMetricsPort | default 8888 }}
                    without_type_suffix: true
      extensions: [health_check{{ if $queueStorage.enabled }}, file_storage/queue{{ end }}]
      pipelines:
        {{- if $selfMetricsEnabled }}
        metrics/self:
          receivers: [prometheus/self]
          processors: [memory_limiter, filter/self, resourcedetection/self, resource/self]
          exporters: [otlp_http]
        {{- end }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes]
          exporters: [{{ if .Values.otel_collector.debug.enabled }}debug, {{ end }}otlp_http]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes]
          exporters: [{{ if .Values.otel_collector.debug.enabled }}debug, {{ end }}otlp_http]
        {{- if $prometheusEnabled }}
        # The Prometheus exporter gets its own metrics pipeline so the otlp_http pipeline keeps
        # its delta semantics to the backend. Behind `delta_to_cumulative` (when enabled) this
        # pipeline converts delta to cumulative, which is what Prometheus scrapes; otherwise it
        # passes metrics through unchanged. Each pipeline has its own processor instances,
        # including Kubernetes enrichment. Debug summaries are emitted only on the OTLP branch.
        metrics/prometheus:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes{{ if $delta_to_cumulative }}, delta_to_cumulative{{ end }}]
          exporters: [prometheus]
        {{- end }}
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes]
          exporters: [otlp_http]
        {{- with .Values.otel_collector.extraPipelines }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
