{{- $serviceName := "logfire-otel-collector" }}
{{- $collectorValues := include "logfire.effectiveServiceValues" (dict "Values" .Values "serviceName" $serviceName) | fromJson }}
{{- $queueStorage := .Values.otel_collector.queueStorage }}
{{- $memoryLimitMi := include "logfire.otelCollectorMemoryLimitMi" . | trim }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $serviceName }}
rules:
  - apiGroups:
      - ''
    resources:
      - 'pods'
    verbs:
      - 'get'
      - 'watch'
      - 'list'
  - apiGroups:
      - 'apps'
    resources:
      - 'replicasets'
      - 'deployments'
      - 'statefulsets'
      - 'daemonsets'
    verbs:
      - 'get'
      - 'list'
      - 'watch'
  - apiGroups:
      - 'extensions'
    resources:
      - 'replicasets'
    verbs:
      - 'get'
      - 'list'
      - 'watch'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $serviceName }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $serviceName }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    {{- include "logfire.workloadLabels" (dict "Values" .Values "serviceName" $serviceName) | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  annotations:
    {{- include "logfire.serviceAnnotations" (dict "Values" .Values "serviceName" $serviceName) | nindent 4 }}
spec:
  selector:
    {{- include "logfire.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  ports:
    - protocol: TCP
      port: 4317
      targetPort: 4317
      name: otlp-grpc
    - protocol: TCP
      port: 4318
      targetPort: 4318
      name: otlp-http
    {{- if include "isPrometheusExporterEnabled" . | trim | eq "true" }}
    - protocol: TCP
      port: {{ .Values.otel_collector.prometheus.port }}
      targetPort: {{ .Values.otel_collector.prometheus.port }}
      name: prometheus-http
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  annotations:
    {{- include "logfire.workloadAnnotations" (dict "Values" .Values "serviceName" $serviceName "secretSources" (list "existing")) | nindent 4 }}
spec:
  {{- include "logfire.replicas" (dict "Values" .Values "serviceName" $serviceName) | nindent 2 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with $collectorValues.strategy }}
  strategy:
    type: {{ .type }}
    {{- if eq .type "RollingUpdate" }}
    rollingUpdate:
      {{- .rollingUpdate | toYaml | nindent 6 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "logfire.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $serviceName }}
  template:
    metadata:
      labels:
        {{- include "logfire.selectorLabels" . | nindent 8 }}
        {{- include "logfire.podLabels" (dict "Values" .Values "serviceName" $serviceName) | nindent 8 }}
        app.kubernetes.io/component: {{ $serviceName }}
      annotations:
        checksum/config: {{ include "logfire.configChecksum" (include (print $.Template.BasePath "/logfire-otel-collector-cfg.yaml") .) }}
        {{- if or (not .Values.existingSecret.enabled) (empty .Values.existingSecret.annotations) }}
        {{- include "logfire.logfireSecretChecksumAnnotations" (dict "ctx" . "secrets" (list "logfire-meta-write-token")) | nindent 8 }}
        {{- end }}
        {{- include "logfire.podAnnotations" (dict "Values" .Values "serviceName" $serviceName) | nindent 8 }}
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      serviceAccountName: {{ $serviceName }}
      terminationGracePeriodSeconds: {{ $collectorValues.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . | quote }}
      {{- end }}
      {{- end }}
      {{- include "logfire.initContainers" (dict "ctx" . "serviceName" $serviceName) | nindent 6}}
      {{- $podContext := dict }}
      {{- if $queueStorage.enabled }}
      {{- $podContext = dict "fsGroup" 10001 "fsGroupChangePolicy" "OnRootMismatch" }}
      {{- end }}
      {{- mergeOverwrite $podContext (deepCopy (.Values.podSecurityContext | default dict)) (deepCopy ($collectorValues.podSecurityContext | default dict)) | toYaml | nindent 2 | printf "securityContext:%s" | nindent 6 }}
      {{- $nodeSpread := dict "maxSkew" 1 "topologyKey" "kubernetes.io/hostname" "whenUnsatisfiable" "ScheduleAnyway" "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/component" $serviceName)) }}
      {{- include "logfire.podScheduling" (dict "Values" .Values "serviceName" $serviceName "defaultTopologySpreadConstraints" (list $nodeSpread)) | nindent 6}}
      {{- $otelCollector := default (dict) .Values.otel_collector }}
      {{- $otelImage := get $otelCollector "image" | default dict }}
      {{- $collectorResourceAttributes := (get .Values "otelResourceAttributes") | default dict }}
      {{- $extraEnv := (index .Values $serviceName | default dict).env | default list }}
      {{- $envState := dict "hasOtelResourceAttributes" false "hasGoMemLimit" false }}
      {{- range $extraEnv }}
        {{- if eq .name "GOMEMLIMIT" }}
          {{- $_ := set $envState "hasGoMemLimit" true }}
        {{- end }}
        {{- if eq .name "OTEL_RESOURCE_ATTRIBUTES" }}
          {{- $_ := set $envState "hasOtelResourceAttributes" true }}
        {{- end }}
      {{- end }}
      containers:
        - name: otel-collector
          image: {{ include "logfire.imageRef" (dict "image" $otelImage "defaultRepository" "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib" "defaultTag" "0.160.0") }}
          imagePullPolicy: {{ default .Values.image.pullPolicy (get $otelImage "pullPolicy") | quote }}
          command:
          - /otelcol-contrib
          - --config=/etc/otel-collector/otel-collector-config.yaml
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: {{ .Values.otel_collector.selfMetricsPort | default 8888 }}
              name: self-metrics
            - containerPort: 13133
              name: health
            {{- if include "isPrometheusExporterEnabled" . | trim | eq "true" }}
            - containerPort: {{ .Values.otel_collector.prometheus.port }}
            {{- end }}
          {{- $containerContext := mergeOverwrite (dict "readOnlyRootFilesystem" true) (deepCopy (.Values.securityContext | default dict)) (deepCopy ($collectorValues.securityContext | default dict)) }}
          {{- include "logfire.securityContext" $containerContext | nindent 10 }}
          {{- range $probe := list "startupProbe" "readinessProbe" "livenessProbe" }}
          {{- with get $collectorValues $probe }}
          {{ $probe }}:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otel-collector
            {{- if $queueStorage.enabled }}
            - name: sending-queue
              mountPath: /var/lib/otelcol/queue
            {{- end }}
          {{- include "logfire.otelCollectorResources" . | nindent 10 }}
          env:
            {{- if not (get $envState "hasGoMemLimit") }}
            # 80% of the memory limiter's 75% hard limit; leaves room for non-Go memory.
            # Without a pod limit, match the fixed 512MiB limiter rather than node memory.
            - name: GOMEMLIMIT
              value: {{ ternary (printf "%dMiB" (int (floor (mulf (float64 $memoryLimitMi) 0.6)))) "409MiB" (ne $memoryLimitMi "") | quote }}
            {{- end }}
            - name: LOGFIRE_META_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "logfire.externalSecretName" (dict "external" .Values.existingSecret "secretName" "logfire-meta-write-token") }}
                  key: logfire-meta-write-token
            {{- if and (not (get $envState "hasOtelResourceAttributes")) $collectorResourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ include "logfire.renderOtelResourceAttributes" $collectorResourceAttributes | quote }}
            {{- end }}
            {{- with $extraEnv }}
              {{- . | toYaml | nindent 12 }}
            {{- end}}
      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
        {{- if $queueStorage.enabled }}
        - name: sending-queue
          emptyDir:
            sizeLimit: {{ $queueStorage.sizeLimit }}
        {{- end }}
{{- template "logfire.autoscaler" (dict "Values" .Values "serviceName" $serviceName) }}
{{- template "logfire.pdb" (dict "root" $ "serviceName" $serviceName) }}
