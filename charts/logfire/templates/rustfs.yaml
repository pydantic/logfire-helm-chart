{{- /*
The bucket comes from `objectStore.uri` when it is an `s3://` URI, so RustFS creates the bucket
the workloads read.
*/}}
{{- if .Values.dev.deployRustfs }}
{{- $serviceName := "logfire-rustfs" }}
{{- $rustfs := .Values.rustfs }}
{{- $accessKey := $rustfs.auth.accessKey }}
{{- $secretKey := $rustfs.auth.secretKey }}
{{- $persistence := $rustfs.persistence }}
{{- $persistenceEnabled := $persistence.enabled }}
{{- $existingClaim := $persistence.existingClaim }}
{{- $bucket := include "logfire.inClusterObjectStoreBucket" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
type: Opaque
stringData:
  accessKey: {{ $accessKey | quote }}
  secretKey: {{ $secretKey | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  selector:
    {{- include "logfire.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  ports:
    - protocol: TCP
      name: s3
      port: 9000
      targetPort: s3
{{- if and $persistenceEnabled (not $existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  accessModes:
    {{- toYaml (default (list "ReadWriteOnce") $persistence.accessModes) | nindent 4 }}
  {{- include "logfire.storageClassName" (dict "root" . "values" $persistence) | nindent 2 }}
  resources:
    requests:
      storage: {{ $persistence.size | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "logfire.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $serviceName }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "logfire.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $serviceName }}
      annotations:
        checksum/rustfs-credentials: {{ printf "%s:%s" $accessKey $secretKey | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- include "logfire.podScheduling" (dict "Values" .Values "serviceName" "rustfs") | nindent 6 }}
      {{- /* The RustFS image runs as uid and gid 10001, so it needs `fsGroup: 10001` to write a fresh volume. The chart-wide and `rustfs` pod security contexts override this default. */}}
      {{- $podSecurityContext := dict "fsGroup" 10001 "fsGroupChangePolicy" "OnRootMismatch" }}
      {{- $podSecurityContext = mergeOverwrite $podSecurityContext (include "logfire.podSecurityContext" . | fromJson) }}
      {{- $podSecurityContext = mergeOverwrite $podSecurityContext (deepCopy $rustfs.podSecurityContext) }}
      {{- include "logfire.securityContext" $podSecurityContext | nindent 6 }}
      {{- $rustfsImage := $rustfs.image }}
      containers:
        - name: rustfs
          image: {{ include "logfire.imageRef" (dict "image" $rustfsImage) }}
          imagePullPolicy: {{ default .Values.image.pullPolicy $rustfsImage.pullPolicy | quote }}
          {{- $rustfsSecurityContext := include "logfire.thirdPartyContainerSecurityContext" (dict "ctx" . "identity" "rustfs" "readOnlyRootFilesystem" true) | fromJson }}
          {{- include "logfire.securityContext" $rustfsSecurityContext | nindent 10 }}
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $serviceName }}
                  key: accessKey
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $serviceName }}
                  key: secretKey
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    # The server starts in parallel with this hook. Retry until it accepts the bucket.
                    # RustFS answers 200 to a PUT for a bucket that already exists.
                    for _ in $(seq 1 60); do
                      if curl -fsS -o /dev/null --aws-sigv4 "aws:amz:us-east-1:s3" \
                          --user "${RUSTFS_ACCESS_KEY}:${RUSTFS_SECRET_KEY}" \
                          -X PUT "http://127.0.0.1:9000/{{ $bucket }}"; then
                        exit 0
                      fi
                      sleep 2
                    done
                    exit 1
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml $rustfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: data
          {{- if $persistenceEnabled }}
          persistentVolumeClaim:
            claimName: {{ default $serviceName $existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          emptyDir: {}
{{- end }}
