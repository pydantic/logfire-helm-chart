{{- if .Values.agentSandboxes.enabled }}
{{- $name := include "logfire.agentSandboxes.secret" . }}
{{- $namespace := include "logfire.agentSandboxes.namespace" . }}
{{- $workerSecret := printf "%s-telemetry" $name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $telemetry := get $data "telemetry" | default (randAlphaNum 48 | b64enc) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    pod-security.kubernetes.io/enforce: restricted
    {{- include "logfire.labels" . | nindent 4 }}
{{- if not .Values.agentSandboxes.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
type: Opaque
data:
  telemetry: {{ $telemetry | quote }}
  {{- range $key := list "management" "controller" "state" "relay" "snapshot" "snapshot-admin" "volume" "volume-admin" }}
  {{ $key }}: {{ get $data $key | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $workerSecret }}
  namespace: {{ $namespace }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $telemetry | quote }}
{{- end }}
{{- end }}
