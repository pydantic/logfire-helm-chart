{{- if (include "logfire.fleet.enabled" . | eq "true") }}
{{- /*
Fleet control: the private transport service that `logfire-opamp` calls for every agent connect,
report and claim. It has no public route; only `logfire-opamp` reaches it, with the shared
transport token. It reads and writes the crud database, whose Fleet tables
`logfire-backend-migrations` creates.
*/ -}}
{{- $serviceName := "logfire-fleet-control" }}
{{- $containerSecurityContext := include "logfire.containerSecurityContext" (dict "ctx" . "serviceName" $serviceName) | fromJson }}
{{- $servicePort := include "logfire.fleet.controlPort" . | int }}
{{- include "logfire.validateConfig" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  annotations:
    {{- include "logfire.serviceAnnotations" (dict "Values" .Values "serviceName" $serviceName) | nindent 4 }}
spec:
  selector:
    {{- include "logfire.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  ports:
  - port: {{ $servicePort }}
    targetPort: {{ $servicePort }}
    name: "http"
  {{- include "logfire.inClusterTls.https.servicePort" (dict "ctx" . "targetPort" "https") | nindent 2 }}
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    {{- include "logfire.workloadLabels" (dict "Values" .Values "serviceName" $serviceName) | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  annotations:
    {{- include "logfire.workloadAnnotations" (dict "Values" .Values "serviceName" $serviceName "secretSources" (list "postgres" "existing")) | nindent 4 }}
spec:
  {{- include "logfire.replicas" (dict "Values" .Values "serviceName" $serviceName) | nindent 2 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "logfire.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $serviceName }}
  template:
    metadata:
      annotations:
        {{- if or (not .Values.postgresSecret.enabled) (empty .Values.postgresSecret.annotations) }}
        {{- include "logfire.postgresSecretChecksumAnnotation" (dict "ctx" .) | nindent 8 }}
        {{- end }}
        {{- if or (not .Values.existingSecret.enabled) (empty .Values.existingSecret.annotations) }}
        {{- include "logfire.logfireSecretChecksumAnnotations" (dict "ctx" . "secrets" (list "logfire-encryption-key" "logfire-fleet-transport-token")) | nindent 8 }}
        {{- end }}
        {{- include "logfire.podAnnotations" (dict "Values" .Values "serviceName" $serviceName) | nindent 8 }}
      labels:
        {{- include "logfire.selectorLabels" . | nindent 8 }}
        {{- include "logfire.podLabels" (dict "Values" .Values "serviceName" $serviceName) | nindent 8 }}
        app.kubernetes.io/component: {{ $serviceName }}
    spec:
      {{- include "logfire.standardPodSpecFields" (dict "ctx" . "serviceName" $serviceName) | nindent 6 }}
      containers:
        - name: {{ $serviceName }}
          image: '{{ .Values.image.repository | default "" }}{{ .Values.image.fleetControlImage | default "logfire-fleet-control-prod" }}:{{ include "logfire.serviceTag" (dict "Values" .Values "serviceName" $serviceName "Chart" .Chart) }}'
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command: ["python", "-m", "logfire_fleet_control"]
          {{- include "logfire.securityContext" $containerSecurityContext | nindent 10 }}
          {{- include "logfire.resources" (dict "Values" .Values "serviceName" $serviceName) | nindent 10 }}
          # A stopping pod keeps serving until it is out of the Service's endpoints, so the
          # `logfire-opamp` batches in flight to it don't fail the agents they carry.
          lifecycle:
            preStop:
              exec:
                command:
                  - "sleep"
                  - "5"
          ports:
            - containerPort: {{ $servicePort }}
              protocol: TCP
              name: "http"
            {{- include "logfire.inClusterTls.https.containerPort" (dict "ctx" .) | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ $servicePort }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ $servicePort }}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $servicePort }}
            periodSeconds: 5
            timeoutSeconds: 3
          env:
            {{- include "logfire.pythonServiceEnv" (dict "ctx" . "serviceName" $serviceName) | nindent 12 }}
            - name: APP_PORT
              value: {{ $servicePort | quote }}
            - name: FRONTEND_HOST
              value: {{ include "logfire.url" . | quote }}
            - name: KNOWN_LOGFIRE_REGIONS
              value: '[{"name": "local", "frontend_host": "{{ include "logfire.url" . }}", "api_host": "{{ include "logfire.url" . }}", "auth_host": "{{ include "logfire.url" . }}"}]'
            - name: PGAPPNAME
              value: {{ $serviceName }}
            - name: CRUD_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "logfire.postgresSecretName" . }}
                  key: postgresDsn
            {{- with (include "logfire.crudPgTopologyEnv" $ | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            # Reports, desired reads, deliveries and claims share this pool. The OpAMP servers'
            # leases have their own two connections, so a busy pool doesn't fence them.
            - name: CRUD_PG_POOL_MAX_CONNECTIONS
              value: "4"
            - name: CRUD_PG_POOL_MIN_CONNECTIONS
              value: "1"
            - name: LIVENESS_POOL_MAX_CONNECTIONS
              value: "2"
            # Encrypts the write tokens Kubernetes Operator bridges send their own metrics with.
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "logfire.externalSecretName" (dict "external" .Values.existingSecret "secretName" "logfire-encryption-key") }}
                  key: logfire-encryption-key
            - name: FLEET_TRANSPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "logfire.externalSecretName" (dict "external" .Values.existingSecret "secretName" "logfire-fleet-transport-token") }}
                  key: logfire-fleet-transport-token
            {{- if (include "logfire.inClusterTls.enabled" . | eq "true") }}
            - name: HTTPS_PORT
              value: "{{ .Values.inClusterTls.httpsPort }}"
            - name: TLS_CERT_PATH
              value: "/etc/tls/tls.crt"
            - name: TLS_KEY_PATH
              value: "/etc/tls/tls.key"
            {{- end }}
            {{- include "logfire.trustedCa.env" (dict "ctx" . "serviceName" $serviceName) | nindent 12 }}
            {{- with include "logfire.serviceEnv" (dict "Values" .Values "serviceName" $serviceName) }}
              {{- . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "logfire.tmpVolumeMounts" . | nindent 12 }}
            {{- include "logfire.inClusterTls.caBundle.volumeMount" (dict "ctx" . "mountPath" "/etc/logfire/incluster-ca") | nindent 12 }}
            {{- include "logfire.trustedCa.volumeMount" (dict "ctx" . "serviceName" $serviceName) | nindent 12 }}
            {{- include "logfire.inClusterTls.server.volumeMount" (dict "ctx" . "mountPath" "/etc/tls") | nindent 12 }}
      volumes:
        {{- include "logfire.tmpVolume" . | nindent 8 }}
        {{- include "logfire.inClusterTls.caBundle.volume" (dict "ctx" .) | nindent 8 }}
        {{- include "logfire.trustedCa.volumes" (dict "ctx" . "serviceName" $serviceName) | nindent 8 }}
        {{- include "logfire.inClusterTls.server.volume" (dict "ctx" . "serviceName" $serviceName) | nindent 8 }}
      terminationGracePeriodSeconds: 30
{{- template "logfire.autoscaler" (dict "Values" .Values "serviceName" $serviceName) }}
{{- template "logfire.pdb" (dict "root" $ "serviceName" $serviceName) }}
{{- end }}
