{{- if .Values.ingress.enabled -}}
{{- $hosts := .Values.ingress.hostnames -}}
{{- if not $hosts -}}
  {{- if .Values.ingress.hostname -}}
    {{- $hosts = list .Values.ingress.hostname -}}
  {{- end -}}
{{- end -}}
{{- $backendPort := 8080 -}}
{{- if (include "logfire.inClusterTls.enabled" . | eq "true") -}}
  {{- $backendPort = .Values.inClusterTls.httpsPort -}}
{{- end -}}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) -}}
{{- $ingressClassName := .Values.ingress.ingressClassName | default "" -}}
{{- if and (include "logfire.inClusterTls.enabled" . | eq "true") (or (eq $ingressClassName "") (contains "nginx" $ingressClassName)) (not (hasKey $annotations "nginx.ingress.kubernetes.io/backend-protocol")) -}}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
  name: logfire-ingress
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: logfire-service
                port:
                  number: {{ $backendPort }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - secretName: {{ .Values.ingress.secretName }}
      hosts:
        {{- toYaml $hosts | nindent 8 }}
  {{- end }}
{{- if (include "logfire.grpcIngest.enabled" . | eq "true") }}
{{- /*
OTLP/gRPC needs HTTP/2 towards the backend, and ingress-nginx selects the backend
protocol per Ingress resource, so the gRPC routes get an Ingress of their own.
The main `ingress.annotations` are deliberately not inherited: backend-protocol
style annotations differ per protocol, and controller add-ons (e.g. cert-manager
ingress-shim) should act on the main Ingress only.
*/}}
{{- $grpcAnnotations := deepCopy (dig "ingressAnnotations" (dict) (.Values.grpcIngest | default dict)) -}}
{{- if and (or (eq $ingressClassName "") (contains "nginx" $ingressClassName)) (not (hasKey $grpcAnnotations "nginx.ingress.kubernetes.io/backend-protocol")) -}}
  {{- $_ := set $grpcAnnotations "nginx.ingress.kubernetes.io/backend-protocol" (ternary "GRPCS" "GRPC" (include "logfire.inClusterTls.enabled" . | eq "true")) -}}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- if $grpcAnnotations }}
  annotations:
    {{- toYaml $grpcAnnotations | nindent 4 }}
  {{- end }}
  name: logfire-ingress-grpc
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          {{- range include "logfire.grpcIngest.collectorServices" $ | fromJsonArray }}
          - path: /{{ . }}
            pathType: Prefix
            backend:
              service:
                name: logfire-service
                port:
                  number: {{ include "logfire.grpcIngest.haproxyPort" $ }}
          {{- end }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - secretName: {{ .Values.ingress.secretName }}
      hosts:
        {{- toYaml $hosts | nindent 8 }}
  {{- end }}
{{- end }}
{{- end }}
