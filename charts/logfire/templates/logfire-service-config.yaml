{{- $ingestValues := include "logfire.effectiveServiceValues" (dict "Values" .Values "serviceName" "logfire-ff-ingest") | fromJson -}}
{{- $ingestAutoscaling := get $ingestValues "autoscaling" | default dict -}}
{{- $ingestMaxCount := coalesce (get $ingestAutoscaling "maxReplicas") (get $ingestValues "replicas") 1 -}}
{{- $queryApiValues := include "logfire.effectiveServiceValues" (dict "Values" .Values "serviceName" "logfire-ff-query-api") | fromJson -}}
{{- $queryApiAutoscaling := get $queryApiValues "autoscaling" | default dict -}}
{{- $queryApiMaxCount := coalesce (get $queryApiAutoscaling "maxReplicas") (get $queryApiValues "replicas") 1 -}}
{{- $aiGatewayValues := index .Values "logfire-ai-gateway" | default dict -}}
{{- $aiGatewayProxyTimeout := get $aiGatewayValues "proxyTimeout" | default "600s" -}}
{{- $remoteMcpValues := index .Values "logfire-remote-mcp" | default dict -}}
{{- $remoteMcpEnabled := dig "enabled" true $remoteMcpValues -}}
{{- $hostValidation := .Values.hostValidation | default dict -}}
{{- $hvMode := $hostValidation.mode | default "off" -}}
{{- $overwriteForwardedHost := (.Values.haproxy | default dict).overwriteForwardedHost -}}
{{- $hvHosts := list -}}
{{- range concat (include "logfire.effective_hostnames" . | fromJson).hosts ($hostValidation.additionalHosts | default list) -}}
  {{- $hvHosts = append $hvHosts (lower (toString .)) -}}
{{- end -}}
{{- $hvHostList := join " " $hvHosts -}}
{{- $hvHostRegexp := list -}}
{{- range $hvHosts -}}
  {{- $hvHostRegexp = append $hvHostRegexp (regexQuoteMeta .) -}}
{{- end -}}
{{- $hvHostAlternatives := join "|" $hvHostRegexp -}}
{{- $hvClusterDomain := .Values.clusterDomain | default "cluster.local" -}}
{{- $hvFwdLines := 8 -}}
apiVersion: v1
kind: Secret
metadata:
  name: logfire-haproxy-config
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: logfire-haproxy-config
stringData:
  haproxy.cfg: |+
    global
      daemon
      maxconn 10000
      log stdout sample 1:1000 local0 info

    defaults
      mode http
      option forwardfor
      timeout connect 5000ms
      timeout client 3600s #30000ms
      timeout server 3600s #30000ms

    listen stats
      bind :8181
      mode http
      stats enable
      stats uri /stats
      stats show-modules

    resolvers kubernetes
      parse-resolv-conf
      accepted_payload_size 8192
      resolve_retries 10
      timeout retry 2s
      hold valid 1s

    frontend http-in
      bind :8080 alpn h2,http/1.1
      {{- if (include "logfire.inClusterTls.enabled" . | eq "true") }}
      bind :{{ .Values.inClusterTls.httpsPort }} ssl crt /usr/local/etc/haproxy/tls/tls.crt alpn h2,http/1.1
      {{- end }}
      log stdout local0 info
      log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs \"%HM %[var(txn.log_path)] %HV\"{{ if ne $hvMode "off" }} %[var(txn.hv_check)]{{ end }}"
      option http-keep-alive
      no option httpclose
      timeout http-keep-alive {{ .Values.keepAliveTimeout }}
      timeout client {{ ternary $aiGatewayProxyTimeout "120s" (get $aiGatewayValues "enabled") }}
      # URLs can contain credentials, so the log has no query string and no long path segment. A
      # capability token is at least 36 characters, except for the 10-character short link code.
      # `%HPO` applies the HAProxy log escaping. A comma in the pattern splits the converter arguments.
      http-request set-var-fmt(txn.log_path) "%HPO"
      http-request set-var(txn.log_path) var(txn.log_path),regsub('/[^/]{20}[^/]*','/[redacted]','g')
      http-request set-var-fmt(txn.log_path) "/l/[redacted]" if { path,url_dec -m beg /l/ }
      http-request set-var-fmt(txn.log_path) "/ui-api/short-link/[redacted]" if { path,url_dec -m beg /ui-api/short-link/ }
      {{- if ne $hvMode "off" }}

      # Host validation, mode {{ $hvMode }}. Decide whether the request names a host of this install, before
      # HAProxy fills in a missing X-Forwarded-Host. A request is misdirected when its Host is neither
      # listed nor internal, or when it carries an X-Forwarded-Host with a value that is not listed.
      # Internal is the service name that other pods use, with or without a trailing dot, an IP address
      # that a health check of a load balancer uses, or no Host at all. Every entry of X-Forwarded-Host
      # must be listed, because the entries come from several hops and a client can write any of them.
      # Matching is exact and ignores case. A name with a port must be listed with its port.
      http-request set-var(txn.hv_check) str(host_check=ok)
      http-request set-var(txn.hv_host) req.hdr(Host),lower
      acl hv_host_listed var(txn.hv_host) -m str {{ $hvHostList }}
      acl hv_host_internal var(txn.hv_host) -m reg ^logfire-service(\.{{ regexQuoteMeta .Release.Namespace }}(\.svc(\.{{ regexQuoteMeta $hvClusterDomain }})?)?)?\.?(:[0-9]+)?$
      acl hv_host_internal var(txn.hv_host) -m reg ^([0-9]{1,3}\.){3}[0-9]{1,3}(:[0-9]+)?$
      acl hv_host_internal var(txn.hv_host) -m reg ^\[[0-9a-f:.]+\](:[0-9]+)?$
      acl hv_host_internal var(txn.hv_host) -m reg ^$
      acl hv_host_internal req.hdr_cnt(Host) eq 0
      http-request set-var(txn.hv_bad) bool(true) if !hv_host_listed !hv_host_internal
      {{- if not $overwriteForwardedHost }}
      # Several X-Forwarded-Host lines are one comma-separated list (RFC 9110, 5.3). A fetch returns one
      # line, so the first {{ $hvFwdLines }} are joined, and a request with more lines is refused. The
      # number of entries in a line has no limit of its own, because the whole joined value is matched.
      http-request set-var(txn.hv_fwd) req.fhdr(X-Forwarded-Host,1)
      {{- range $line := untilStep 2 (add1 $hvFwdLines | int) 1 }}
      http-request set-var-fmt(txn.hv_fwd) "%[var(txn.hv_fwd)],%[req.fhdr(X-Forwarded-Host,{{ $line }})]" if { req.fhdr(X-Forwarded-Host,{{ $line }}) -m found }
      {{- end }}
      http-request set-var(txn.hv_fwd) var(txn.hv_fwd),lower,regsub('[[:space:]]+','','g')
      acl hv_fwd_present req.hdr_cnt(X-Forwarded-Host) gt 0
      acl hv_fwd_many req.fhdr_cnt(X-Forwarded-Host) gt {{ $hvFwdLines }}
      acl hv_fwd_listed var(txn.hv_fwd) -m reg ^({{ $hvHostAlternatives }})(,({{ $hvHostAlternatives }}))*$
      http-request set-var(txn.hv_bad) bool(true) if hv_fwd_present !hv_fwd_listed
      http-request set-var(txn.hv_bad) bool(true) if hv_fwd_many
      {{- end }}
      {{- end }}
      http-request set-header Host %[req.hdr(Host)]
      {{- if (.Values.haproxy | default dict).overwriteForwardedHost }}
      http-request set-header X-Forwarded-Host %[req.hdr(Host)]
      {{- else }}
      http-request set-header X-Forwarded-Host %[req.hdr(Host)] unless { req.hdr(X-Forwarded-Host) -m found }
      {{- end }}
      http-request set-header X-Real-IP %[src]
      {{- /* HAProxy sends each upstream `<service>.<namespace>.svc.<clusterDomain>` as Host. A service that
      builds an absolute redirect from its Host puts that name, and the port it listens on, in Location. */}}
      {{- $serviceHostPattern := printf "[a-z0-9-]+\\.%s\\.svc(\\.%s)?(:[0-9]+)?" (regexQuoteMeta .Release.Namespace) (regexQuoteMeta (.Values.clusterDomain | default "cluster.local")) }}

      # An upstream redirect that names an in-cluster service sends the browser to a host it cannot
      # resolve. Keep only its path and query, so the client stays on the host it asked. The scheme is
      # matched in any case. The first rule keeps a path, the second a query that follows the host
      # directly, and the third sets `/` for a Location that has neither, which still matches after
      # the first two left it alone. A redirect to any other host passes unchanged. The ACL reads the
      # whole line with `fhdr`, because `hdr` splits it at commas, and a comma in the query of another
      # host's URL would then make a later part match.
      acl location_in_cluster res.fhdr(Location) -i -m reg ^https?://{{ $serviceHostPattern }}(/|\?|$)
      http-response replace-header Location ^[hH][tT][tT][pP][sS]?://[^/?]*(/.*)$ \1 if location_in_cluster
      http-response replace-header Location ^[hH][tT][tT][pP][sS]?://[^/?]*(\?.*)$ /\1 if location_in_cluster
      http-response set-header Location / if location_in_cluster

      # Handle WebSocket upgrade headers
      acl is_websocket hdr(Upgrade) -i WebSocket
      http-request set-header Connection Upgrade if is_websocket
      
      acl is_options method OPTIONS
      acl cors_path_ingest path_reg -i ^/(v1/(traces|metrics|logs)|v1development/profiles)$
      acl cors_path_api path_reg -i ^/(ui-api|v1|api)/

      # Capture request origin Header and check it against the list of public URLs. An origin is a
      # scheme, a host and an optional port, so `str` compares all of it. With `corsOriginMatch: prefix`,
      # `beg` also grants `https://<host>.evil.example` and `https://<host>:8443`.
      http-request set-var(txn.origin) req.hdr(Origin)
      acl is_allowed_origin req.hdr(Origin) -i -m {{ ternary "beg" "str" (eq ((.Values.haproxy | default dict).corsOriginMatch | default "exact") "prefix") }} {{ include "logfire.all_urls" . }}
      http-request set-var(txn.is_origin_allowed) bool(true) if is_allowed_origin

      {{- $corsExact := ne ((.Values.haproxy | default dict).corsOriginMatch | default "exact") "prefix" }}
      
      http-response set-header Access-Control-Allow-Origin "%[var(txn.origin)]" if { var(txn.is_origin_allowed) -m bool }
      # Whether a response carries the header above depends on the request's Origin, so a shared
      # cache must key on it. The backend already says so when it answers a CORS request.
      http-response add-header Vary Origin unless { res.hdr(Vary) -i -m str Origin }
      
      acl path_ingest path_reg -i ^/(v1/(traces|metrics|logs|firehose/logs)|v1development/profiles)$
      acl path_query_v2 path /v2/query
      acl path_dex path_beg /auth-api
      acl path_backend path_reg -i ^/(ui-api|v1|api)/
      acl path_backend path_beg /.well-known/oauth-authorization-server /.well-known/openid-configuration
      acl path_backend path -i /.well-known/oauth-protected-resource /.well-known/oauth-protected-resource/ /.well-known/oauth-protected-resource/v1
      acl path_backend path_beg /integrations/
      # The backend serves the passkey endpoints document and the Logfire CLI's OAuth client
      # metadata (its client_id is this URL). Without a route the frontend answers both with its
      # HTML shell and status 200.
      acl path_backend path /.well-known/passkey-endpoints /.well-known/oauth-client/logfire-cli
      {{- if (get $aiGatewayValues "enabled") }}
      acl path_ai_gateway path /proxy
      acl path_ai_gateway path_beg /proxy/
      acl path_ai_gateway path /.well-known/oauth-protected-resource/proxy
      acl path_ai_gateway path_beg /.well-known/oauth-protected-resource/proxy/
      {{- end }}
      {{- if $remoteMcpEnabled }}
      acl path_remote_mcp path /mcp
      acl path_remote_mcp path_beg /mcp/
      acl path_remote_mcp path /.well-known/oauth-protected-resource/mcp
      acl path_remote_mcp path_beg /.well-known/oauth-protected-resource/mcp/
      {{- end }}
      {{- if ne $hvMode "off" }}

      # Host validation applies to the UI: the static frontend, `/ui-api` and `/auth-api`. A path that
      # another backend owns is not the UI and answers on any host, as it did before: OTLP, the
      # public API, `/mcp`, `/proxy`, `/integrations/` and the `/.well-known/` documents that a backend
      # serves. Every other path reaches the frontend, so it is checked, including any other path under
      # `/.well-known/`. Only `/health`, the frontend's health check, is exempt on its own.
      # HAProxy routes by the raw path, and other layers decode the path and resolve dot-segments. So a
      # `/ui-api/` path in another case or in percent-encoded form, and any path that has a `.` or `..`
      # segment, is checked as the UI, and cannot use a backend prefix to skip the check. A path with an
      # encoded NUL (`%00`) is checked too, because HAProxy's regex match stops at the decoded NUL and
      # never sees a dot-segment after it.
      acl hv_ui_api path,url_dec -i -m beg /ui-api/
      acl hv_dot_segment path,url_dec -m reg (^|/)\.\.?(/|$)
      acl hv_dot_segment path -m sub %00
      acl hv_not_ui path /health
      http-request set-var(txn.hv_subject) bool(true) if path_dex
      http-request set-var(txn.hv_subject) bool(true) if hv_ui_api
      http-request set-var(txn.hv_subject) bool(true) if hv_dot_segment
      http-request set-var(txn.hv_subject) bool(true) if !path_ingest !path_query_v2 !path_dex !path_backend{{ if (get $aiGatewayValues "enabled") }} !path_ai_gateway{{ end }}{{ if $remoteMcpEnabled }} !path_remote_mcp{{ end }} !hv_not_ui
      acl hv_subject var(txn.hv_subject) -m bool
      acl hv_bad var(txn.hv_bad) -m bool
      http-request set-var-fmt(txn.hv_check) "host_check={{ ternary "rejected" "would_reject" (eq $hvMode "enforce") }} host=\"%[var(txn.hv_host),json]\" forwarded_host=\"%[var(txn.hv_fwd),json]\"" if hv_bad hv_subject
      {{- if eq $hvMode "enforce" }}
      http-request return status 421 content-type text/plain hdr Cache-Control no-store string "Misdirected Request: this host does not serve the Logfire UI.\n" if hv_bad hv_subject
      {{- end }}
      {{- end }}

      # Respond to preflight requests directly from HAProxy, after host validation, so that a
      # preflight for the UI on an unlisted host gets the same answer, and the same log line, as the request. A preflight for a request with credentials
      # and an Authorization header needs `Access-Control-Allow-Credentials`, as the backend's own
      # answers to the request itself have. A browser reads `*` in `Access-Control-Allow-Methods` as
      # a literal method name when the request carries credentials, so the methods are listed. Only an
      # exact origin match gets this: `corsOriginMatch: prefix` is the old match, and it must not gain
      # a credentialed grant for a look-alike origin. It keeps `*`.
      # The headers are the ones that clients send cross-origin to these paths, and `*` does not work
      # for them either when the request has credentials: `Authorization` and `Content-Type` (the UI and
      # SDKs), `X-Logfire-Context` (the query API), `If-None-Match` (the OFREP web provider), `Content-Encoding`
      # (the replay upload) and `X-PostHog-Session-Id` (the UI, when it has an analytics session).
      http-request return status 204 hdr "Access-Control-Allow-Origin" "%[req.hdr(Origin)]"{{ if $corsExact }} hdr "Access-Control-Allow-Credentials" "true"{{ end }} hdr "Vary" "Origin" hdr "Access-Control-Allow-Methods" "{{ ternary "GET,HEAD,POST,PUT,PATCH,DELETE" "*" $corsExact }}" hdr "Access-Control-Allow-Headers" "Authorization,Content-type,X-Logfire-Context,If-None-Match,Content-Encoding,X-PostHog-Session-Id" hdr "Access-Control-Max-Age" "1728000" if is_allowed_origin is_options cors_path_ingest or is_allowed_origin is_options cors_path_api

      use_backend logfire-ingest if path_ingest
      use_backend logfire-ff-query-api if path_query_v2
      use_backend logfire-dex if path_dex
      {{- if (get $aiGatewayValues "enabled") }}
      use_backend logfire-ai-gateway if path_ai_gateway
      {{- end }}
      {{- if $remoteMcpEnabled }}
      use_backend logfire-remote-mcp if path_remote_mcp
      {{- end }}
      use_backend logfire-backend if path_backend

      default_backend logfire-frontend

    backend logfire-ingest
      # Create hash from authorization header, path, and query params
      http-request set-var-fmt(txn.auth_hash) "%[req.hdr(authorization)]"
      http-request set-var-fmt(txn.path_hash) "%[path]"
      http-request set-var-fmt(txn.query_hash) "%[query]"
      http-request set-var-fmt(txn.hash) "%[var(txn.auth_hash)] %[var(txn.path_hash)] %[var(txn.query_hash)]"

      # Use consistent hashing with the combined hash
      balance hash var(txn.hash)
      hash-type consistent
      # Use a hash balance factor to control the distribution of requests and avoid overloading a single pod if a hot hash keeps hitting the same pod
      hash-balance-factor 150
      option httpchk
      http-check send meth GET uri /health ver HTTP/1.1 hdr Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-ff-ingest") }}
      http-check expect status 200
      timeout connect 3s
      timeout server 50s
      # Retry a total of 4 times, move to a different server every 2 retries
      retries 4
      option redispatch 2
      
      http-request set-header Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-ff-ingest") }}
      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-ff-ingest" "serviceName" "logfire-ff-ingest" "cleartextPort" 8012 "replicas" $ingestMaxCount "options" "check resolvers kubernetes inter 250ms hash-key addr") | nindent 6 }}

    backend logfire-ff-query-api
      balance roundrobin
      option httpchk
      http-check send meth GET uri /health ver HTTP/1.1 hdr Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-ff-query-api") }}
      http-check expect status 200
      timeout connect 3s
      timeout server 120s

      http-request set-header Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-ff-query-api") }}
      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-ff-query-api" "serviceName" "logfire-ff-query-api" "cleartextPort" 8011 "replicas" $queryApiMaxCount "options" "check resolvers kubernetes inter 250ms") | nindent 6 }}

    backend logfire-dex
      balance roundrobin
      # Health checks
      option httpchk
      http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-dex") }}
      option http-server-close
      timeout connect 3s
      timeout server 50s
      http-check expect status 200

      http-request set-header Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-dex") }}
      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-dex" "serviceName" "logfire-dex" "cleartextPort" 5556 "options" "check port 5558 resolvers kubernetes" "checkSsl" false) | nindent 6 }}

    {{- if (get $aiGatewayValues "enabled") }}
    backend logfire-ai-gateway
      balance roundrobin
      # Health checks
      option httpchk
      http-check send meth GET uri /health ver HTTP/1.1 hdr Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-ai-gateway") }}
      option http-server-close
      timeout connect 3s
      timeout server {{ $aiGatewayProxyTimeout }}
      http-check expect status 200

      http-request set-header Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-ai-gateway") }}
      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-ai-gateway" "serviceName" "logfire-ai-gateway" "cleartextPort" 8788 "options" "check resolvers kubernetes") | nindent 6 }}
    {{- end }}

    {{- if $remoteMcpEnabled }}
    backend logfire-remote-mcp
      balance roundrobin
      # Health checks
      option httpchk
      http-check send meth GET uri /health ver HTTP/1.1 hdr Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-remote-mcp") }}
      option http-server-close
      timeout connect 3s
      timeout server 120s
      http-check expect status 200

      http-request set-header Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-remote-mcp") }}
      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-remote-mcp" "serviceName" "logfire-remote-mcp" "cleartextPort" 8005 "options" "check resolvers kubernetes") | nindent 6 }}
    {{- end }}

    backend logfire-backend
      balance roundrobin
      # Health checks
      option httpchk
      http-check send meth GET uri /health ver HTTP/1.1 hdr Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-backend") }}
      option http-server-close
      timeout connect 3s
      timeout server 120s
      http-check expect status 200

      http-request set-header Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-backend") }}
      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-backend" "serviceName" "logfire-backend" "cleartextPort" 8000 "options" "check resolvers kubernetes") | nindent 6 }}

    backend logfire-frontend
      balance roundrobin
      # Health checks
      option httpchk
      http-check send meth GET uri /health ver HTTP/1.1 hdr Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-frontend-service") }}
      option http-server-close
      timeout connect 3s
      timeout server 50s
      http-check expect status 200
      http-request set-header Host {{ include "logfire.serviceHost" (dict "ctx" . "serviceName" "logfire-frontend-service") }}
      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-frontend" "serviceName" "logfire-frontend-service" "cleartextPort" 8080 "options" "check resolvers kubernetes") | nindent 6 }}
