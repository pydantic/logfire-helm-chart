{{- $ingestValues := include "logfire.effectiveServiceValues" (dict "Values" .Values "serviceName" "logfire-ff-ingest") | fromJson -}}
{{- $ingestAutoscaling := get $ingestValues "autoscaling" | default dict -}}
{{- $ingestMaxCount := coalesce (get $ingestAutoscaling "maxReplicas") (get $ingestValues "replicas") 1 -}}
{{- $queryApiValues := include "logfire.effectiveServiceValues" (dict "Values" .Values "serviceName" "logfire-ff-query-api") | fromJson -}}
{{- $queryApiAutoscaling := get $queryApiValues "autoscaling" | default dict -}}
{{- $queryApiMaxCount := coalesce (get $queryApiAutoscaling "maxReplicas") (get $queryApiValues "replicas") 1 -}}
{{- $aiGatewayValues := index .Values "logfire-ai-gateway" | default dict -}}
{{- $aiGatewayProxyTimeout := get $aiGatewayValues "proxyTimeout" | default "600s" -}}
{{- $remoteMcpValues := index .Values "logfire-remote-mcp" | default dict -}}
{{- $remoteMcpEnabled := dig "enabled" true $remoteMcpValues -}}
apiVersion: v1
kind: Secret
metadata:
  name: logfire-haproxy-config
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    app.kubernetes.io/component: logfire-haproxy-config
stringData:
  haproxy.cfg: |+
    global
      daemon
      maxconn 10000
      log stdout sample 1:1000 local0 info

    defaults
      mode http
      option forwardfor
      timeout connect 5000ms
      timeout client 3600s #30000ms
      timeout server 3600s #30000ms

    listen stats
      bind :8181
      mode http
      stats enable
      stats uri /stats
      stats show-modules

    resolvers kubernetes
      parse-resolv-conf
      accepted_payload_size 8192
      resolve_retries 10
      timeout retry 2s
      hold valid 1s

    frontend http-in
      bind :8080 alpn h2,http/1.1
      {{- if (include "logfire.inClusterTls.enabled" . | eq "true") }}
      bind :{{ .Values.inClusterTls.httpsPort }} ssl crt /usr/local/etc/haproxy/tls/tls.crt alpn h2,http/1.1
      {{- end }}
      log stdout local0 info
      option httplog
      option http-keep-alive
      no option httpclose
      timeout http-keep-alive 60s
      timeout client {{ ternary $aiGatewayProxyTimeout "120s" (get $aiGatewayValues "enabled") }}
      http-request set-header Host %[req.hdr(Host)]
      http-request set-header X-Real-IP %[src]

      # Handle WebSocket upgrade headers
      acl is_websocket hdr(Upgrade) -i WebSocket
      http-request set-header Connection Upgrade if is_websocket
      
      acl is_options method OPTIONS
      acl cors_path_ingest path_reg -i ^/v1/(traces|metrics|logs)$
      acl cors_path_api path_reg -i ^/(ui-api|v1|api)/

      # Capture request origin Header and check against list of valid urls
      http-request set-var(txn.origin) req.hdr(Origin)
      acl is_allowed_origin req.hdr(Origin) -i -m beg {{ include "logfire.all_urls" . }}
      http-request set-var(txn.is_origin_allowed) bool(true) if is_allowed_origin

      # Respond to preflight requests directly from HAProxy
      http-request return status 204 hdr "Access-Control-Allow-Origin" "%[req.hdr(Origin)]" hdr "Access-Control-Allow-Methods" "*" hdr "Access-Control-Allow-Headers" "Authorization,Content-type,X-Logfire-Context" hdr "Access-Control-Max-Age" "1728000" if is_allowed_origin is_options cors_path_ingest or is_allowed_origin is_options cors_path_api
      
      http-response set-header Access-Control-Allow-Origin "%[var(txn.origin)]" if { var(txn.is_origin_allowed) -m bool }
      
      acl path_ingest path_reg -i ^/v1/(traces|metrics|logs)$
      acl path_query_v2 path /v2/query
      acl path_dex path_beg /auth-api
      acl path_backend path_reg -i ^/(ui-api|v1|api)/
      acl path_backend path_beg /.well-known/oauth-authorization-server /.well-known/openid-configuration
      acl path_backend path -i /.well-known/oauth-protected-resource /.well-known/oauth-protected-resource/ /.well-known/oauth-protected-resource/v1
      acl path_backend path_beg /integrations/
      {{- if (get $aiGatewayValues "enabled") }}
      acl path_ai_gateway path /proxy
      acl path_ai_gateway path_beg /proxy/
      acl path_ai_gateway path /.well-known/oauth-protected-resource/proxy
      acl path_ai_gateway path_beg /.well-known/oauth-protected-resource/proxy/
      {{- end }}
      {{- if $remoteMcpEnabled }}
      acl path_remote_mcp path /mcp
      acl path_remote_mcp path_beg /mcp/
      acl path_remote_mcp path /.well-known/oauth-protected-resource/mcp
      acl path_remote_mcp path_beg /.well-known/oauth-protected-resource/mcp/
      {{- end }}


      use_backend logfire-ingest if path_ingest
      use_backend logfire-ff-query-api if path_query_v2
      use_backend logfire-dex if path_dex
      {{- if (get $aiGatewayValues "enabled") }}
      use_backend logfire-ai-gateway if path_ai_gateway
      {{- end }}
      {{- if $remoteMcpEnabled }}
      use_backend logfire-remote-mcp if path_remote_mcp
      {{- end }}
      use_backend logfire-backend if path_backend

      default_backend logfire-frontend

    backend logfire-ingest
      # Create hash from authorization header, path, and query params
      http-request set-var-fmt(txn.auth_hash) "%[req.hdr(authorization)]"
      http-request set-var-fmt(txn.path_hash) "%[path]"
      http-request set-var-fmt(txn.query_hash) "%[query]"
      http-request set-var-fmt(txn.hash) "%[var(txn.auth_hash)] %[var(txn.path_hash)] %[var(txn.query_hash)]"

      # Use consistent hashing with the combined hash
      balance hash var(txn.hash)
      hash-type consistent
      # Use a hash balance factor to control the distribution of requests and avoid overloading a single pod if a hot hash keeps hitting the same pod
      hash-balance-factor 150
      # Enable both TCP and HTTP checks
      option httpchk GET /health
      http-check expect status 200
      option tcp-check
      timeout connect 3s
      timeout server 50s
      # Retry a total of 4 times, move to a different server every 2 retries
      retries 4
      option redispatch 2
      
      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-ff-ingest" "serviceName" "logfire-ff-ingest" "cleartextPort" 8012 "replicas" $ingestMaxCount "options" "check resolvers kubernetes inter 250ms hash-key addr") | nindent 6 }}

    backend logfire-ff-query-api
      balance roundrobin
      option httpchk GET /health
      http-check expect status 200
      timeout connect 3s
      timeout server 120s

      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-ff-query-api" "serviceName" "logfire-ff-query-api" "cleartextPort" 8011 "replicas" $queryApiMaxCount "options" "check resolvers kubernetes inter 250ms") | nindent 6 }}

    backend logfire-dex
      balance roundrobin
      # Health checks
      option httpchk GET /healthz
      option http-server-close
      timeout connect 3s
      timeout server 50s
      http-check expect status 200

      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-dex" "serviceName" "logfire-dex" "cleartextPort" 5556 "options" "check port 5558 resolvers kubernetes" "checkSsl" false) | nindent 6 }}

    {{- if (get $aiGatewayValues "enabled") }}
    backend logfire-ai-gateway
      balance roundrobin
      # Health checks
      option httpchk
      http-check send meth GET uri /health hdr Host logfire-ai-gateway
      option http-server-close
      timeout connect 3s
      timeout server {{ $aiGatewayProxyTimeout }}
      http-check expect status 200

      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-ai-gateway" "serviceName" "logfire-ai-gateway" "cleartextPort" 8788 "options" "check resolvers kubernetes") | nindent 6 }}
    {{- end }}

    {{- if $remoteMcpEnabled }}
    backend logfire-remote-mcp
      balance roundrobin
      # Health checks
      option httpchk
      http-check send meth GET uri /health hdr Host {{ include "logfire.primary_hostname" . }}
      option http-server-close
      timeout connect 3s
      timeout server 120s
      http-check expect status 200

      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-remote-mcp" "serviceName" "logfire-remote-mcp" "cleartextPort" 8005 "options" "check resolvers kubernetes") | nindent 6 }}
    {{- end }}

    backend logfire-backend
      balance roundrobin
      # Health checks
      option httpchk GET /health
      option http-server-close
      timeout connect 3s
      timeout server 120s
      http-check expect status 200

      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-backend" "serviceName" "logfire-backend" "cleartextPort" 8000 "options" "check resolvers kubernetes") | nindent 6 }}

    backend logfire-frontend
      balance roundrobin
      # Health checks
      option httpchk GET /health
      option http-server-close
      timeout connect 3s
      timeout server 50s
      http-check expect status 200
      {{- include "logfire.inClusterTls.haproxyUpstream" (dict "ctx" . "name" "logfire-frontend" "serviceName" "logfire-frontend-service" "cleartextPort" 8080 "options" "check resolvers kubernetes") | nindent 6 }}
