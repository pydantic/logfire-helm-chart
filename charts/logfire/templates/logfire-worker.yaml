{{- $serviceName := "logfire-worker" }}
{{- $containerSecurityContext := include "logfire.containerSecurityContext" (dict "ctx" . "serviceName" $serviceName) | fromJson }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "logfire.labels" . | nindent 4 }}
    {{- include "logfire.workloadLabels" (dict "Values" .Values "serviceName" $serviceName) | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
  annotations:
    {{- include "logfire.workloadAnnotations" (dict "Values" .Values "serviceName" $serviceName "secretSources" (list "postgres" "existing" "redis")) | nindent 4 }}
spec:
  {{- include "logfire.replicas" (dict "Values" .Values "serviceName" $serviceName) | nindent 2 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "logfire.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $serviceName }}
  template:
    metadata:
      annotations:
        {{- if or (not .Values.postgresSecret.enabled) (empty .Values.postgresSecret.annotations) }}
        {{- include "logfire.postgresSecretChecksumAnnotation" (dict "ctx" .) | nindent 8 }}
        {{- end }}
        {{- with (include "logfire.redisSecretChecksumAnnotation" (dict "ctx" .) | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if or (not .Values.existingSecret.enabled) (empty .Values.existingSecret.annotations) }}
        {{- include "logfire.logfireSecretChecksumAnnotations" (dict "ctx" . "secrets" (list "logfire-encryption-key" "logfire-unsubscribe-secret" "logfire-jwt-secret")) | nindent 8 }}
        {{- with (include "logfire.slackAppChecksumAnnotation" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with (include "logfire.webPushChecksumAnnotation" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- include "logfire.podAnnotations" (dict "Values" .Values "serviceName" $serviceName) | nindent 8 }}
      labels:
        {{- include "logfire.selectorLabels" . | nindent 8 }}
        {{- include "logfire.podLabels" (dict "Values" .Values "serviceName" $serviceName) | nindent 8 }}
        app.kubernetes.io/component: {{ $serviceName }}
    spec:
      {{- include "logfire.standardPodSpecFields" (dict "ctx" . "serviceName" $serviceName) | nindent 6 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: {{ $serviceName }}
          image: '{{ .Values.image.repository | default "" }}{{ .Values.image.workerImage }}:{{ include "logfire.serviceTag" (dict "Values" .Values "serviceName" $serviceName "Chart" .Chart) }}'
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          {{- include "logfire.resources" (dict "Values" .Values "serviceName" $serviceName) | nindent 10 }}
          {{- include "logfire.securityContext" $containerSecurityContext | nindent 10 }}
          command: [ "python", "-m", "logfire_worker" ]
          ports:
            - containerPort: 8003
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8003
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
          startupProbe:
            httpGet:
              path: /health/live
              port: 8003
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 11
          env:
            - name: MATERIALIZE_DASHBOARDS
              value: "false"
            {{- include "logfire.pythonServiceEnv" (dict "ctx" . "serviceName" $serviceName "codeWorkDir" "/app") | nindent 12 }}
            - name: CRUD_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "logfire.postgresSecretName" . }}
                  key: postgresDsn
            {{- with (include "logfire.crudPgTopologyEnv" $ | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: SHARED_REDIS_DSN
              {{- include "logfire.redisDsnValueFrom" (dict "root" . "key" "sharedDsn") | nindent 14 }}
            - name: TOKEN_REDIS_DSN
              {{- include "logfire.redisDsnValueFrom" (dict "root" . "key" "tokenDsn") | nindent 14 }}
            - name: TOKEN_REDIS_PREFIX
              value: {{ include "logfire.redisPrefixFor" (dict "root" . "valuesKey" "tokenRedis") | quote }}
            - name: REDIS_DSN
              {{- include "logfire.redisDsnValueFrom" (dict "root" . "key" "sharedDsn") | nindent 14 }}
            - name: BACKEND_REDIS_DSN
              {{- include "logfire.redisDsnValueFrom" (dict "root" . "key" "sharedDsn") | nindent 14 }}
            {{- include "logfire.otelSamplerEnv" . | nindent 12 }}
            - name: FUSIONFIRE_QUERY_HOST
              value: "{{ include "logfire.scheme" . }}://logfire-ff-query-api"
            - name: FUSIONFIRE_QUERY_PORT
              value: "{{ include "logfire.port" (dict "port" 8011 "root" .) }}"
            - name: FUSIONFIRE_INGEST_HOST
              value: "{{ include "logfire.scheme" . }}://logfire-ff-ingest-processor"
            - name: FUSIONFIRE_INGEST_PORT
              value: "{{ include "logfire.port" (dict "port" 8012 "root" .) }}"
            - name: FUSIONFIRE_CRUD_HOST
              value: "{{ include "logfire.scheme" . }}://logfire-ff-crud-api"
            - name: FUSIONFIRE_CRUD_PORT
              value: "{{ include "logfire.port" (dict "port" 8011 "root" .) }}"
            - name: EMAILS_ENABLED
              value: {{ include "logfire.emailsEnabled" . | quote }}
            - name: FRONTEND_HOST
              value: {{ include "logfire.url" . | quote }}
            {{- with (include "logfire.aiModelEnv" (dict "root" $ "roles" (list "reasoning")) | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with (include "logfire.aiProviderEnv" $ | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: UNSUBSCRIBE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "logfire.externalSecretName" (dict "external" .Values.existingSecret "secretName" "logfire-unsubscribe-secret") }}
                  key: logfire-unsubscribe-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "logfire.externalSecretName" (dict "external" .Values.existingSecret "secretName" "logfire-jwt-secret") }}
                  key: logfire-jwt-secret
            {{- with (include "logfire.encryptionKeyEnv" (dict "ctx" . "serviceName" $serviceName) | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with (include "logfire.slackAppEnv" (dict "ctx" . "serviceName" $serviceName) | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with (include "logfire.webPushEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: KNOWN_LOGFIRE_REGIONS
              value: '[{"name": "local", "frontend_host": "{{ include "logfire.url" . }}", "api_host": "{{ include "logfire.url" . }}", "auth_host": "{{ include "logfire.url" . }}"}]'
            {{ if .Values.dev.deployMaildev }}
            - name: SMTP_SERVER
              value: logfire-maildev
            - name: SMTP_PORT
              value: "1025"
            - name: SMTP_USERNAME
              value: maildev
            - name: SMTP_PASSWORD
              value: maildev
            - name: SMTP_USE_TLS
              value: "false"
            {{ else }}
            - name: SMTP_SERVER
              value: {{ .Values.smtp.host }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_USERNAME
{{ include "logfire.envValue" (dict "value" .Values.smtp.username) | indent 14 }}
            - name: SMTP_PASSWORD
{{ include "logfire.envValue" (dict "value" .Values.smtp.password) | indent 14 }}
            - name: SMTP_USE_TLS
              value: {{ .Values.smtp.use_tls | quote }}
            {{ end }}
            {{- include "logfire.emailSenderEnv" . | nindent 12 }}
            {{- include "logfire.smtp.tlsEnv" . | nindent 12 }}
            {{- include "logfire.pythonObjectStoreEnv" . | nindent 12 }}
            {{- include "logfire.trustedCa.env" (dict "ctx" . "serviceName" $serviceName) | nindent 12 }}
            {{- with include "logfire.serviceEnv" (dict "Values" .Values "serviceName" $serviceName) }}
              {{- . | nindent 12 }}
            {{- end}}
          volumeMounts:
            {{- include "logfire.tmpVolumeMounts" . | nindent 12 }}
            {{- include "logfire.logfireDataVolumeMounts" . | nindent 12 }}
            {{- include "logfire.objectStoreVolumeMounts" . | nindent 12 }}
            {{- include "logfire.inClusterTls.caBundle.volumeMount" (dict "ctx" . "mountPath" "/etc/logfire/incluster-ca") | nindent 12 }}
            {{- include "logfire.trustedCa.volumeMount" (dict "ctx" . "serviceName" $serviceName) | nindent 12 }}
      volumes:
        {{- include "logfire.tmpVolume" . | nindent 8 }}
        {{- include "logfire.logfireDataVolume" . | nindent 8 }}
        {{- include "logfire.objectStoreVolumes" . | nindent 8 }}
        {{- include "logfire.inClusterTls.caBundle.volume" (dict "ctx" .) | nindent 8 }}
        {{- include "logfire.trustedCa.volumes" (dict "ctx" . "serviceName" $serviceName) | nindent 8 }}
{{- template "logfire.autoscaler" (dict "Values" .Values "serviceName" $serviceName) }}
{{- template "logfire.pdb" (dict "root" $ "serviceName" $serviceName) }}
