suite: byte-cache client-side routing
release:
  name: lf
  namespace: cache-ns
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
tests:
  - it: configures zoneless query API routing by default before user env overrides
    set:
      logfire-ff-query-api:
        env:
          - name: FF_BYTE_CACHE_K8S_PORT_NAME
            value: custom
    templates:
      - templates/logfire-ff-query-api.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_BYTE_CACHE_K8S_SERVICE
            value: logfire-ff-cache-byte-internal
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_BYTE_CACHE_K8S_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_BYTE_CACHE_K8S_PORT_NAME
            value: http
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_NODE_NAME
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].env[-1]
          value:
            name: FF_BYTE_CACHE_K8S_PORT_NAME
            value: custom
        documentSelector:
          path: kind
          value: Deployment

  - it: configures zone-aware HTTPS routing on query workers
    set:
      serviceAccount:
        name: routing-test-sa
      logfire-ff-query-worker:
        enabled: true
      logfire-ff-cache-byte:
        clientSideRouting:
          zoneAware: true
      inClusterTls:
        enabled: true
        caBundle:
          existingConfigMap:
            name: logfire-incluster-ca
    templates:
      - templates/logfire-ff-query-worker.yaml
      - templates/logfire-ff-cache-routing-rbac.yaml
      - templates/logfire-ff-cache-byte.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_BYTE_CACHE_K8S_PORT_NAME
            value: https
        template: templates/logfire-ff-query-worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        template: templates/logfire-ff-query-worker.yaml
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get]
        template: templates/logfire-ff-cache-routing-rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: subjects[0].name
          value: routing-test-sa
        template: templates/logfire-ff-cache-routing-rbac.yaml
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
        template: templates/logfire-ff-cache-byte.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.topologySpreadConstraints[1].topologyKey
          value: kubernetes.io/hostname
        template: templates/logfire-ff-cache-byte.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: omits query routing environment when disabled
    set:
      logfire-ff-cache-byte:
        clientSideRouting:
          enabled: false
          zoneAware: true
    templates:
      - templates/logfire-ff-query-api.yaml
      - templates/logfire-ff-cache-routing-rbac.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_BYTE_CACHE_K8S_SERVICE
            value: logfire-ff-cache-byte-internal
        template: templates/logfire-ff-query-api.yaml
        documentSelector:
          path: kind
          value: Deployment
      - hasDocuments:
          count: 0
        template: templates/logfire-ff-cache-routing-rbac.yaml

  - it: grants only EndpointSlice discovery by default
    templates:
      - templates/logfire-ff-cache-routing-rbac.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: lf-logfire-cache-ns-ff-cache-routing-f5f9750e
        documentSelector:
          path: kind
          value: Role
      - contains:
          path: rules
          content:
            apiGroups:
              - discovery.k8s.io
            resources:
              - endpointslices
            verbs:
              - get
              - list
              - watch
        documentSelector:
          path: kind
          value: Role
      - equal:
          path: subjects[0]
          value:
            kind: ServiceAccount
            name: default
            namespace: cache-ns
        documentSelector:
          path: kind
          value: RoleBinding

  - it: preserves user cache constraints without duplicating the zone spread
    set:
      logfire-ff-cache-byte:
        clientSideRouting:
          zoneAware: true
        topologySpreadConstraints:
          - maxSkew: 2
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: logfire-ff-cache-byte
          - maxSkew: 1
            topologyKey: example.com/rack
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: logfire-ff-cache-byte
    templates:
      - templates/logfire-ff-cache-byte.yaml
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 2
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: logfire-ff-cache-byte
            - maxSkew: 1
              topologyKey: example.com/rack
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: logfire-ff-cache-byte
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: logfire-ff-cache-byte
        documentSelector:
          path: kind
          value: Deployment

  - it: derives disk-cache capacity from the scratch volume claim size
    templates:
      - templates/logfire-ff-cache-byte.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_CACHE_DISK_CAPACITY
            value: "26214MB"
        documentSelector:
          path: kind
          value: Deployment

  - it: lets explicit cacheDiskCapacity override the derived value
    set:
      logfire-ff-cache-byte:
        cacheDiskCapacity: "24GB"
    templates:
      - templates/logfire-ff-cache-byte.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_CACHE_DISK_CAPACITY
            value: "24GB"
        documentSelector:
          path: kind
          value: Deployment

  - it: omits disk-cache capacity for emptyDir scratch storage
    set:
      logfire-ff-cache-byte:
        scratchVolume: null
    templates:
      - templates/logfire-ff-cache-byte.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_CACHE_DISK_CAPACITY
          any: true
        documentSelector:
          path: kind
          value: Deployment

  - it: rejects scratch volume quantities below 1Mi
    set:
      logfire-ff-cache-byte:
        scratchVolume:
          storage: 512Ki
    templates:
      - templates/logfire-ff-cache-byte.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'scratchVolume.storage "512Ki" is below the 1Mi minimum'
