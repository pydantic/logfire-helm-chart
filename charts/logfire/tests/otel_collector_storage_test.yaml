suite: collector disk queues
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
templates:
  - templates/logfire-otel-collector.yaml
  - templates/logfire-otel-collector-cfg.yaml
tests:
  - it: enables bounded disk queues and compaction by default
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'storage: file_storage/queue'
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'extensions: \[health_check, file_storage/queue\]'
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'max_size: 536870912'
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'fsync: false'
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'on_rebound: true'
  - it: uses node-local disk with writable non-root ownership and storage accounting
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      sizingPreset: standard
      otel_collector.queueStorage.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sending-queue
            emptyDir:
              sizeLimit: 4Gi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sending-queue
            mountPath: /var/lib/otelcol/queue
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10001
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].resources.requests["ephemeral-storage"]
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: 5Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
  - it: supports in-memory queues without storage extensions
    set:
      otel_collector.queueStorage.enabled: false
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'file_storage|compaction'
  - it: omits disk allocation and ownership when disabled
    set:
      otel_collector.queueStorage.enabled: false
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - notExists:
          path: spec.template.spec.securityContext.fsGroup
      - notExists:
          path: spec.template.spec.containers[0].resources
  - it: preserves explicit disk budgets and security overrides
    set:
      otel_collector.queueStorage.enabled: true
      logfire-otel-collector.resources:
        requests:
          ephemeral-storage: 1Gi
        limits:
          ephemeral-storage: 6Gi
      podSecurityContext.fsGroup: 2000
      logfire-otel-collector.podSecurityContext.fsGroup: 3000
      logfire-otel-collector.securityContext.runAsUser: 3000
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].resources.requests["ephemeral-storage"]
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: 6Gi
  - it: rejects a volume smaller than the database and compaction budget
    set:
      otel_collector.queueStorage.enabled: true
      otel_collector.queueStorage.sizeLimit: 1Gi
    template: templates/logfire-otel-collector.yaml
    asserts:
      - failedTemplate:
          errorMessage: otel_collector.queueStorage.sizeLimit must allow at least 6x maxSizeBytes for three databases and their compaction copies.
  - it: rejects a container disk limit smaller than the queue volume
    set:
      otel_collector.queueStorage.enabled: true
      logfire-otel-collector.resources.limits.ephemeral-storage: 1Gi
    template: templates/logfire-otel-collector.yaml
    asserts:
      - failedTemplate:
          errorMessage: The collector ephemeral-storage limit must be at least otel_collector.queueStorage.sizeLimit; allow extra space for container logs.
  - it: rejects an enlarged byte queue without database headroom
    set:
      otel_collector.queueStorage.enabled: true
      otel_collector.exporter.sending_queue.queue_size: 268435456
    template: templates/logfire-otel-collector.yaml
    asserts:
      - failedTemplate:
          errorMessage: otel_collector.queueStorage.maxSizeBytes must allow at least 4x the effective byte queue_size for database overhead; increase the disk budgets when increasing the queue.
  - it: accepts an enlarged queue when all disk budgets are raised
    set:
      otel_collector.queueStorage.enabled: true
      otel_collector.queueStorage.maxSizeBytes: 1073741824
      otel_collector.queueStorage.sizeLimit: 8Gi
      otel_collector.queueStorage.ephemeralStorageLimit: 9Gi
      otel_collector.exporter.sending_queue.queue_size: 268435456
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'queue_size: 268435456'
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'max_size: 1073741824'
  - it: uses the effective preset queue for database validation
    set:
      sizingPreset: standard
      otel_collector.queueStorage.enabled: true
      otel_collector.queueStorage.maxSizeBytes: 268435456
    template: templates/logfire-otel-collector.yaml
    asserts:
      - failedTemplate:
          errorMessage: otel_collector.queueStorage.maxSizeBytes must allow at least 4x the effective byte queue_size for database overhead; increase the disk budgets when increasing the queue.
  - it: does not compare item counts with byte database limits
    set:
      otel_collector.queueStorage.enabled: true
      otel_collector.exporter.sending_queue.sizer: items
      otel_collector.exporter.sending_queue.queue_size: 268435456
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'sizer: items'
  - it: supports explicit fsync for stable-storage writes
    set:
      otel_collector.queueStorage.fsync: true
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'fsync: true'
