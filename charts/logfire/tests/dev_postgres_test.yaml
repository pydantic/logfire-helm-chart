suite: development Postgres
# The dev Postgres is a chart-owned replacement for the removed Bitnami subchart. Integration
# installs cover the happy path; this suite keeps the upgrade contract (`postgresql.*` values on
# an install that has no `devPostgres` block), the name coupling with the database wait init
# container, and the security-context merge precedence, which all fail silently when they break.
release:
  name: lf
  namespace: default
templates:
  - templates/dev-postgres.yaml
  - templates/logfire-backend.yaml
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
tests:
  - it: shares one name between the Postgres resources and the database wait init container
    set:
      devPostgres:
        fullnameOverride: custom-postgres
    asserts:
      - equal:
          path: metadata.name
          value: custom-postgres
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Service
      - equal:
          path: metadata.name
          value: custom-postgres
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "check-db-ready")].command[2]
          pattern: "custom-postgres"
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: reads the legacy postgresql values when devPostgres is absent
    set:
      devPostgres: null
      postgresql:
        fullnameOverride: legacy-postgres
        auth:
          postgresPassword: legacy-password
        primary:
          initdb:
            scripts:
              create_databases.sql: |
                CREATE DATABASE legacy;
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
          persistence:
            enabled: true
            size: 5Gi
            storageClassName: legacy-storage
            mountPath: /legacy/data
    asserts:
      - equal:
          path: metadata.name
          value: legacy-postgres
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Service
      - equal:
          path: stringData.postgres-password
          value: legacy-password
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Secret
      - matchRegex:
          path: data["create_databases.sql"]
          pattern: "CREATE DATABASE legacy;"
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: ConfigMap
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.storageClassName
          value: legacy-storage
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 200m
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "data")].mountPath
          value: /legacy/data
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: keeps the postgres image identity and the pod defaults
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: merges the chart-wide and per-service security contexts under the defaults
    set:
      podSecurityContext:
        fsGroup: 3000
      securityContext:
        runAsUser: 2500
      devPostgres:
        podSecurityContext:
          fsGroupChangePolicy: Always
        securityContext:
          runAsUser: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 3000
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: Always
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 2000
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 999
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: mounts the init scripts and the data volume at their configured paths
    set:
      devPostgres:
        persistence:
          mountPath: /custom/data
    asserts:
      - matchRegex:
          path: data["create_databases.sql"]
          pattern: "CREATE DATABASE ff;"
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: ConfigMap
      - equal:
          path: spec.template.spec.volumes[?(@.name == "initdb")].configMap.name
          value: logfire-postgres-initdb
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "initdb")].mountPath
          value: /docker-entrypoint-initdb.d
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name == "data")].mountPath
          value: /custom/data
        template: templates/dev-postgres.yaml
        documentSelector:
          path: kind
          value: Deployment
