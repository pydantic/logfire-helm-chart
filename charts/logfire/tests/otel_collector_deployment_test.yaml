suite: collector memory and availability
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
templates:
  - templates/logfire-otel-collector.yaml
  - templates/logfire-otel-collector-cfg.yaml
tests:
  - it: gives standard extra headroom without changing its scheduling request
    set:
      sizingPreset: standard
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 1228MiB
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 24
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: health
  - it: derives GC from a legacy flat override
    set:
      sizingPreset: standard
      logfire-otel-collector.resources.memory: 1536Mi
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1536Mi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 921MiB
  - it: derives GC from decimal quantities and not the request
    set:
      sizingPreset: standard
      logfire-otel-collector.resources:
        requests:
          memory: 512Mi
          cpu: 500m
        limits:
          memory: 2G
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 1144MiB
  - it: preserves a user GC setting without adding another copy
    set:
      logfire-otel-collector.env:
        - name: GOMEMLIMIT
          value: 500MiB
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 500MiB
  - it: uses fixed GC without a rendered limit and permits disabling probes
    set:
      sizingPreset: ''
      logfire-otel-collector.startupProbe: null
      logfire-otel-collector.readinessProbe: null
      logfire-otel-collector.livenessProbe: null
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.memory
      - notExists:
          path: spec.template.spec.containers[0].resources.requests.memory
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 409MiB
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
  - it: large inherits the higher limit
    set:
      sizingPreset: large
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
  - it: honors a Recreate rollout without retaining RollingUpdate settings
    set:
      logfire-otel-collector.strategy.type: Recreate
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.strategy.rollingUpdate
