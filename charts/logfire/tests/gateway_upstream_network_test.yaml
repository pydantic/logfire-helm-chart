suite: AI gateway cluster network protection
templates:
  - templates/logfire-ai-gateway.yaml
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  logfire-ai-gateway.enabled: true
tests:
  - it: preserves private provider access when no cluster ranges are configured
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_BLOCKED_UPSTREAM_CIDRS
            value: ""
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ON_PREM
            value: "true"
  - it: passes all operator supplied IPv4 and IPv6 cluster ranges to the gateway
    set:
      logfire-ai-gateway.blockedUpstreamCidrs:
        - "10.96.0.0/12"
        - "10.244.0.0/16"
        - "fd00:10:244::/56"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_BLOCKED_UPSTREAM_CIDRS
            value: "10.96.0.0/12,10.244.0.0/16,fd00:10:244::/56"
