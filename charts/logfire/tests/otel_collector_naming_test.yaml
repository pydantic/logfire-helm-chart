suite: otel collector metric naming
release:
  name: lf
  namespace: default
set:
  objectStore:
    uri: s3://test-bucket
templates:
  - templates/logfire-otel-collector-cfg.yaml
tests:
  # A Prometheus metric keeps its OTel name (no _seconds/_total suffix) unless the operator asks
  # for suffixes. `translation_strategy` is derived from `add_metric_suffixes` so the two cannot
  # disagree, and the exporter no longer emits the deprecated `add_metric_suffixes`.
  - it: escapes names without suffixes when add_metric_suffixes is false
    set:
      otel_collector:
        prometheus:
          enabled: true
          add_metric_suffixes: false
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'translation_strategy: UnderscoreEscapingWithoutSuffixes'

  - it: keeps suffixes when add_metric_suffixes is true
    set:
      otel_collector:
        prometheus:
          enabled: true
          add_metric_suffixes: true
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'translation_strategy: UnderscoreEscapingWithSuffixes'

  - it: an explicit translation_strategy wins over the derived value
    set:
      otel_collector:
        prometheus:
          enabled: true
          add_metric_suffixes: false
          translation_strategy: NoTranslation
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'translation_strategy: NoTranslation'
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'translation_strategy: UnderscoreEscapingWithoutSuffixes'

  - it: an explicit translation_strategy still wins when add_metric_suffixes is true
    set:
      otel_collector:
        prometheus:
          enabled: true
          add_metric_suffixes: true
          translation_strategy: NoTranslation
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'translation_strategy: NoTranslation'
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'add_metric_suffixes'
