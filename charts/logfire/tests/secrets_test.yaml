suite: existingSecret wiring
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
tests:
  - it: chart generates jwt secret when existingSecret is disabled
    set:
      existingSecret:
        enabled: false
    templates:
      - templates/secrets.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-jwt-secret
          any: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-meta-write-token
          any: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-encryption-key
          any: true

  - it: chart skips generated secrets when existingSecret is enabled
    set:
      existingSecret:
        enabled: true
        name: my-shared-secret
    templates:
      - templates/secrets.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-jwt-secret
        not: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-meta-write-token
        not: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-encryption-key
        not: true

  - it: backend env points at existingSecret.name when enabled
    set:
      existingSecret:
        enabled: true
        name: my-shared-secret
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            valueFrom:
              secretKeyRef:
                name: my-shared-secret
                key: logfire-jwt-secret
          any: true
        documentSelector:
          path: kind
          value: Deployment

  - it: backend env points at per-key chart-managed secret when existingSecret is disabled
    set:
      existingSecret:
        enabled: false
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            valueFrom:
              secretKeyRef:
                name: logfire-jwt-secret
                key: logfire-jwt-secret
          any: true
        documentSelector:
          path: kind
          value: Deployment

  - it: chart-managed Redis Secret carries every key the workloads read
    templates:
      - templates/secrets.yaml
      - templates/logfire-backend.yaml
      - templates/logfire-ff-ingest.yaml
    asserts:
      - isNotNull:
          path: data.sharedDsn
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-redis-dsns
      - isNotNull:
          path: data.tailDsn
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-redis-dsns
      - isNotNull:
          path: data.tokenDsn
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-redis-dsns
      - isNotNull:
          path: data.usageDsn
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-redis-dsns
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED_REDIS_DSN
            valueFrom:
              secretKeyRef:
                name: lf-logfire-redis-dsns
                key: sharedDsn
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_REDIS_TAIL_DSN
            valueFrom:
              secretKeyRef:
                name: lf-logfire-redis-dsns
                key: tailDsn
        template: templates/logfire-ff-ingest.yaml
        documentSelector:
          path: kind
          value: StatefulSet
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/logfire-redis-dsns"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: an external Redis Secret replaces the chart-managed one
    set:
      redisSecret:
        enabled: true
        name: my-redis-dsns
    templates:
      - templates/secrets.yaml
      - templates/logfire-backend.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: lf-logfire-redis-dsns
        not: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED_REDIS_DSN
            valueFrom:
              secretKeyRef:
                name: my-redis-dsns
                key: sharedDsn
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: renders when the released values predate redisSecret
    set:
      redisSecret: null
    templates:
      - templates/secrets.yaml
      - templates/logfire-worker.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: lf-logfire-redis-dsns
          any: true
        template: templates/secrets.yaml
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/logfire-redis-dsns"]
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: external Secret reload annotations replace Helm checksums on consumers
    set:
      postgresSecret:
        enabled: true
        name: postgres-secrets
        annotations:
          reloader.stakater.com/auto: "true"
      existingSecret:
        enabled: true
        name: logfire-secrets
        annotations:
          test-logfire-reload: "true"
      adminSecret:
        enabled: true
        name: admin-secrets
        annotations:
          test-admin-reload: "true"
      existingGatewaySecret:
        enabled: true
        name: gateway-secrets
        annotations:
          test-gateway-reload: "true"
      redisSecret:
        enabled: true
        name: redis-dsns
        annotations:
          test-redis-reload: "true"
      logfire-ai-gateway:
        enabled: true
    templates:
      - templates/logfire-backend.yaml
      - templates/logfire-frontend-service.yaml
    asserts:
      - equal:
          path: metadata.annotations
          value:
            reloader.stakater.com/auto: "true"
            test-logfire-reload: "true"
            test-admin-reload: "true"
            test-gateway-reload: "true"
            test-redis-reload: "true"
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-postgres-dsn"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-redis-dsns"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-jwt-secret"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-admin-password"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/gateway-encryption"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: metadata.annotations["reloader.stakater.com/auto"]
        template: templates/logfire-frontend-service.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: task runner hashes the chart-managed Gateway secret
    set:
      logfire-ai-gateway:
        enabled: true
    templates:
      - templates/logfire-task-runner.yaml
    asserts:
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/gateway-internal-secret"]
        documentSelector:
          path: kind
          value: Deployment

  - it: task runner reads an external Gateway secret and carries its reload annotations
    set:
      existingGatewaySecret:
        enabled: true
        name: gateway-secrets
        annotations:
          test-gateway-reload: "true"
      logfire-ai-gateway:
        enabled: true
    templates:
      - templates/logfire-task-runner.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GATEWAY_INTERNAL_SECRET
            valueFrom:
              secretKeyRef:
                key: internalSecret
                name: gateway-secrets
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: metadata.annotations
          value:
            test-gateway-reload: "true"
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/gateway-internal-secret"]
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/gateway-encryption"]
        documentSelector:
          path: kind
          value: Deployment

  - it: a pooled install reads the session DSNs that the chart-managed Secret carries
    set:
      postgresPooler: pgbouncer
      postgresDsnSession: postgres://crud-session
      postgresFFDsnSession: postgres://ff-session
    templates:
      - templates/secrets.yaml
      - templates/logfire-backend-migrations.yaml
      - templates/logfire-ff-migrations.yaml
      - templates/logfire-ff-maintenance-scheduler.yaml
    asserts:
      - isNotNull:
          path: data.postgresDsnSession
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-pg
      - isNotNull:
          path: data.postgresFFDsnSession
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-pg
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CRUD_PG_DSN
            valueFrom:
              secretKeyRef:
                name: lf-logfire-pg
                key: postgresDsnSession
        template: templates/logfire-backend-migrations.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_DSN
            valueFrom:
              secretKeyRef:
                name: lf-logfire-pg
                key: postgresFFDsnSession
        template: templates/logfire-ff-migrations.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_PG_DSN_SESSION
            valueFrom:
              secretKeyRef:
                name: lf-logfire-pg
                key: postgresFFDsnSession
        template: templates/logfire-ff-maintenance-scheduler.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_DSN
            valueFrom:
              secretKeyRef:
                name: lf-logfire-pg
                key: postgresFFDsn
        template: templates/logfire-ff-maintenance-scheduler.yaml
        documentSelector:
          path: kind
          value: Deployment
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/logfire-postgres-ff-dsn-session"]
        template: templates/logfire-ff-maintenance-scheduler.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: without a pooler, migrations and the scheduler read only the runtime DSNs
    templates:
      - templates/secrets.yaml
      - templates/logfire-ff-migrations.yaml
      - templates/logfire-ff-maintenance-scheduler.yaml
    asserts:
      - notExists:
          path: data.postgresFFDsnSession
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-pg
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_DSN
            valueFrom:
              secretKeyRef:
                name: lf-logfire-pg
                key: postgresFFDsn
        template: templates/logfire-ff-migrations.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_PG_DSN_SESSION
          any: true
        template: templates/logfire-ff-maintenance-scheduler.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: a pooled install reads the session DSNs from an external Postgres Secret
    set:
      postgresPooler: pgbouncer
      postgresSecret:
        enabled: true
        name: pg-dsns
    templates:
      - templates/logfire-backend-migrations.yaml
      - templates/logfire-ff-maintenance-scheduler.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CRUD_PG_DSN
            valueFrom:
              secretKeyRef:
                name: pg-dsns
                key: postgresDsnSession
        template: templates/logfire-backend-migrations.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_PG_DSN_SESSION
            valueFrom:
              secretKeyRef:
                name: pg-dsns
                key: postgresFFDsnSession
        template: templates/logfire-ff-maintenance-scheduler.yaml
        documentSelector:
          path: kind
          value: Deployment

  # CRUD_PG_TOPOLOGY is read by logfire_db.config.CrudPostgresSettings in the platform images.
  - it: a pooled install sets CRUD_PG_TOPOLOGY on every Python workload that reads CRUD_PG_DSN
    set:
      postgresPooler: pgbouncer
      postgresDsnSession: postgres://crud-session
      postgresFFDsnSession: postgres://ff-session
    templates:
      - templates/logfire-backend.yaml
      - templates/logfire-backend-auth.yaml
      - templates/logfire-worker.yaml
      - templates/logfire-task-runner.yaml
      - templates/logfire-remote-mcp.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CRUD_PG_TOPOLOGY
            value: pgbouncer
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CRUD_PG_TOPOLOGY
            value: pgbouncer
        template: templates/logfire-backend-auth.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CRUD_PG_TOPOLOGY
            value: pgbouncer
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CRUD_PG_TOPOLOGY
            value: pgbouncer
        template: templates/logfire-task-runner.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CRUD_PG_TOPOLOGY
            value: pgbouncer
        template: templates/logfire-remote-mcp.yaml
        documentSelector:
          path: kind
          value: Deployment
