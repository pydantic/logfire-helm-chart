suite: existingSecret wiring
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
tests:
  - it: chart generates jwt secret when existingSecret is disabled
    set:
      existingSecret:
        enabled: false
    templates:
      - templates/secrets.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-jwt-secret
          any: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-meta-write-token
          any: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-encryption-key
          any: true

  - it: chart skips generated secrets when existingSecret is enabled
    set:
      existingSecret:
        enabled: true
        name: my-shared-secret
    templates:
      - templates/secrets.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-jwt-secret
        not: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-meta-write-token
        not: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-encryption-key
        not: true

  - it: backend env points at existingSecret.name when enabled
    set:
      existingSecret:
        enabled: true
        name: my-shared-secret
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            valueFrom:
              secretKeyRef:
                name: my-shared-secret
                key: logfire-jwt-secret
          any: true
        documentSelector:
          path: kind
          value: Deployment

  - it: backend env points at per-key chart-managed secret when existingSecret is disabled
    set:
      existingSecret:
        enabled: false
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            valueFrom:
              secretKeyRef:
                name: logfire-jwt-secret
                key: logfire-jwt-secret
          any: true
        documentSelector:
          path: kind
          value: Deployment

  - it: chart-managed Redis Secret carries every key the workloads read
    templates:
      - templates/secrets.yaml
      - templates/logfire-backend.yaml
      - templates/logfire-ff-ingest.yaml
    asserts:
      - isNotNull:
          path: data.sharedDsn
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-redis-dsns
      - isNotNull:
          path: data.tailDsn
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-redis-dsns
      - isNotNull:
          path: data.tokenDsn
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-redis-dsns
      - isNotNull:
          path: data.usageDsn
        template: templates/secrets.yaml
        documentSelector:
          path: metadata.name
          value: lf-logfire-redis-dsns
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED_REDIS_DSN
            valueFrom:
              secretKeyRef:
                name: lf-logfire-redis-dsns
                key: sharedDsn
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_REDIS_TAIL_DSN
            valueFrom:
              secretKeyRef:
                name: lf-logfire-redis-dsns
                key: tailDsn
        template: templates/logfire-ff-ingest.yaml
        documentSelector:
          path: kind
          value: StatefulSet
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/logfire-redis-dsns"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: an external Redis Secret replaces the chart-managed one
    set:
      redisSecret:
        enabled: true
        name: my-redis-dsns
    templates:
      - templates/secrets.yaml
      - templates/logfire-backend.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: lf-logfire-redis-dsns
        not: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED_REDIS_DSN
            valueFrom:
              secretKeyRef:
                name: my-redis-dsns
                key: sharedDsn
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: renders when the released values predate redisSecret
    set:
      redisSecret: null
    templates:
      - templates/secrets.yaml
      - templates/logfire-worker.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: lf-logfire-redis-dsns
          any: true
        template: templates/secrets.yaml
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/logfire-redis-dsns"]
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: external Secret reload annotations replace Helm checksums on consumers
    set:
      postgresSecret:
        enabled: true
        name: postgres-secrets
        annotations:
          reloader.stakater.com/auto: "true"
      existingSecret:
        enabled: true
        name: logfire-secrets
        annotations:
          test-logfire-reload: "true"
      adminSecret:
        enabled: true
        name: admin-secrets
        annotations:
          test-admin-reload: "true"
      existingGatewaySecret:
        enabled: true
        name: gateway-secrets
        annotations:
          test-gateway-reload: "true"
      redisSecret:
        enabled: true
        name: redis-dsns
        annotations:
          test-redis-reload: "true"
      logfire-ai-gateway:
        enabled: true
    templates:
      - templates/logfire-backend.yaml
      - templates/logfire-frontend-service.yaml
    asserts:
      - equal:
          path: metadata.annotations
          value:
            reloader.stakater.com/auto: "true"
            test-logfire-reload: "true"
            test-admin-reload: "true"
            test-gateway-reload: "true"
            test-redis-reload: "true"
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-postgres-dsn"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-redis-dsns"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-jwt-secret"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-admin-password"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/gateway-encryption"]
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: metadata.annotations["reloader.stakater.com/auto"]
        template: templates/logfire-frontend-service.yaml
        documentSelector:
          path: kind
          value: Deployment
