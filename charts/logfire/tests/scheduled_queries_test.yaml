suite: scheduled query shared storage contracts
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore.uri: s3://test-bucket
tests:
- it: default results store reuses telemetry without a new claim
  set: {}
  templates:
  - templates/logfire-backend.yaml
  - templates/logfire-worker.yaml
  - templates/logfire-scheduled-query-results.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: s3://test-bucket
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: s3://test-bucket
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - hasDocuments:
      count: 0
    template: templates/logfire-scheduled-query-results.yaml
- it: RustFS defaults reach both results consumers
  set:
    objectStore.uri: ''
    dev.deployRustfs: true
  templates:
  - templates/logfire-backend.yaml
  - templates/logfire-worker.yaml
  - templates/logfire-scheduled-query-results.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: s3://logfire
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content: &id001
        name: AWS_ENDPOINT
        value: http://logfire-rustfs:9000
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content: &id002
        name: AWS_ACCESS_KEY_ID
        value: logfire-rustfs
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content: &id003
        name: AWS_SECRET_ACCESS_KEY
        value: logfire-rustfs
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content: &id004
        name: AWS_ALLOW_HTTP
        value: 'true'
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: s3://logfire
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content: *id001
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content: *id002
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content: *id003
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content: *id004
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - hasDocuments:
      count: 0
    template: templates/logfire-scheduled-query-results.yaml
- it: S3 credential Secret references reach both results consumers
  set:
    objectStore.uri: s3://telemetry/root
    objectStore.env.AWS_SECRET_ACCESS_KEY: &id010
      valueFrom: &id005
        secretKeyRef:
          name: object-creds
          key: secret
  templates:
  - templates/logfire-backend.yaml
  - templates/logfire-worker.yaml
  - templates/logfire-scheduled-query-results.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: s3://telemetry/root
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content: &id006
        name: AWS_SECRET_ACCESS_KEY
        valueFrom: *id005
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: s3://telemetry/root
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content: *id006
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - hasDocuments:
      count: 0
    template: templates/logfire-scheduled-query-results.yaml
- it: GCS credentials and mounts are inherited by both results consumers
  set:
    objectStore.uri: gs://telemetry/root
    objectStore.env.GOOGLE_APPLICATION_CREDENTIALS: /credentials/adc.json
    objectStore.volumes:
    - &id007
      name: adc
      secret:
        secretName: object-creds
    objectStore.volumeMounts:
    - &id008
      name: adc
      mountPath: /credentials
      readOnly: true
  templates:
  - templates/logfire-backend.yaml
  - templates/logfire-worker.yaml
  - templates/logfire-scheduled-query-results.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: gs://telemetry/root
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content: &id009
        name: GOOGLE_APPLICATION_CREDENTIALS
        value: /credentials/adc.json
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.volumes
      content: *id007
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content: *id008
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: gs://telemetry/root
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content: *id009
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.volumes
      content: *id007
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content: *id008
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - hasDocuments:
      count: 0
    template: templates/logfire-scheduled-query-results.yaml
- it: Azure account credentials reach both results consumers
  set:
    objectStore.uri: az://telemetry/root
    objectStore.env.AZURE_STORAGE_ACCOUNT_NAME: account
    objectStore.env.AZURE_STORAGE_ACCOUNT_KEY: *id010
  templates:
  - templates/logfire-backend.yaml
  - templates/logfire-worker.yaml
  - templates/logfire-scheduled-query-results.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: az://telemetry/root
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content: &id011
        name: AZURE_STORAGE_ACCOUNT_NAME
        value: account
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content: &id012
        name: AZURE_STORAGE_ACCOUNT_KEY
        valueFrom: *id005
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: az://telemetry/root
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content: *id011
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content: *id012
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - hasDocuments:
      count: 0
    template: templates/logfire-scheduled-query-results.yaml
- it: SSE-C uses the same key for both results consumers
  set:
    objectStore.sseCKeyB64: *id010
  templates:
  - templates/logfire-backend.yaml
  - templates/logfire-worker.yaml
  - templates/logfire-scheduled-query-results.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: s3://test-bucket
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content: &id013
        name: AWS_SERVER_SIDE_ENCRYPTION
        value: sse-c
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content: &id014
        name: AWS_SSE_CUSTOMER_KEY_BASE64
        valueFrom: *id005
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: s3://test-bucket
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content: *id013
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content: *id014
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - hasDocuments:
      count: 0
    template: templates/logfire-scheduled-query-results.yaml
- it: rejects conflicting results configuration chart-owned volume name
  set:
    objectStore.volumes:
    - name: logfire-data
      emptyDir: {}
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: chart-owned volume name
- it: rejects conflicting results configuration chart-owned mount path
  set:
    objectStore.volumeMounts:
    - name: adc
      mountPath: /var/lib/logfire
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: chart-owned mount path
- it: rejects conflicting results configuration Set either
  set:
    scheduledQueryResults.persistence.enabled: true
    scheduledQueryResults.uri: s3://results
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: Set either
- it: an optional results PVC is shared by its writer and reader
  set:
    scheduledQueryResults.persistence.enabled: true
  templates:
  - templates/logfire-backend.yaml
  - templates/logfire-worker.yaml
  - templates/logfire-scheduled-query-results.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: file:///var/lib/logfire/scheduled-query-results
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.volumes
      content:
        name: scheduled-query-results
        persistentVolumeClaim:
          claimName: lf-scheduled-query-results
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: scheduled-query-results
        mountPath: /var/lib/logfire/scheduled-query-results
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - equal:
      path: spec.template.spec.securityContext.fsGroup
      value: 1000
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: file:///var/lib/logfire/scheduled-query-results
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.volumes
      content:
        name: scheduled-query-results
        persistentVolumeClaim:
          claimName: lf-scheduled-query-results
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: scheduled-query-results
        mountPath: /var/lib/logfire/scheduled-query-results
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - equal:
      path: spec.template.spec.securityContext.fsGroup
      value: 1000
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - equal:
      path: metadata.name
      value: lf-scheduled-query-results
    template: templates/logfire-scheduled-query-results.yaml
    documentIndex: 0
  - equal:
      path: metadata.annotations["helm.sh/resource-policy"]
      value: keep
    template: templates/logfire-scheduled-query-results.yaml
    documentIndex: 0
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[1].mountPath
      value: /var/lib/logfire
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[2].mountPath
      value: /var/lib/logfire/scheduled-query-results
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[1].mountPath
      value: /var/lib/logfire
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[2].mountPath
      value: /var/lib/logfire/scheduled-query-results
    template: templates/logfire-worker.yaml
    documentIndex: 0
- it: an existing shared claim is used by both consumers
  set:
    scheduledQueryResults.persistence.existingClaim: results-rwx
  templates:
  - templates/logfire-backend.yaml
  - templates/logfire-worker.yaml
  - templates/logfire-scheduled-query-results.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: file:///var/lib/logfire/scheduled-query-results
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.volumes
      content:
        name: scheduled-query-results
        persistentVolumeClaim:
          claimName: results-rwx
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: scheduled-query-results
        mountPath: /var/lib/logfire/scheduled-query-results
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - equal:
      path: spec.template.spec.securityContext.fsGroup
      value: 1000
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: file:///var/lib/logfire/scheduled-query-results
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.volumes
      content:
        name: scheduled-query-results
        persistentVolumeClaim:
          claimName: results-rwx
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: scheduled-query-results
        mountPath: /var/lib/logfire/scheduled-query-results
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - equal:
      path: spec.template.spec.securityContext.fsGroup
      value: 1000
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - hasDocuments:
      count: 0
    template: templates/logfire-scheduled-query-results.yaml
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[1].mountPath
      value: /var/lib/logfire
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[2].mountPath
      value: /var/lib/logfire/scheduled-query-results
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[1].mountPath
      value: /var/lib/logfire
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - equal:
      path: spec.template.spec.containers[0].volumeMounts[2].mountPath
      value: /var/lib/logfire/scheduled-query-results
    template: templates/logfire-worker.yaml
    documentIndex: 0
- it: GCS URI and secret credentials reach both consumers
  set:
    scheduledQueryResults.uri: gs://results/prefix
    scheduledQueryResults.env.GOOGLE_APPLICATION_CREDENTIALS: /credentials/adc.json
    scheduledQueryResults.volumes:
    - name: results-credentials
      secret:
        secretName: results-credentials
    scheduledQueryResults.volumeMounts:
    - name: results-credentials
      mountPath: /credentials
      readOnly: true
    scheduledQueryResults.env.GOOGLE_CLOUD_PROJECT:
      valueFrom:
        secretKeyRef:
          name: results-credentials
          key: project
  templates:
  - templates/logfire-backend.yaml
  - templates/logfire-worker.yaml
  - templates/logfire-scheduled-query-results.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: gs://results/prefix
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GOOGLE_APPLICATION_CREDENTIALS
        value: /credentials/adc.json
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.volumes
      content:
        name: results-credentials
        secret:
          secretName: results-credentials
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: results-credentials
        mountPath: /credentials
        readOnly: true
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
        value: gs://results/prefix
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GOOGLE_APPLICATION_CREDENTIALS
        value: /credentials/adc.json
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.volumes
      content:
        name: results-credentials
        secret:
          secretName: results-credentials
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - contains:
      path: spec.template.spec.containers[0].volumeMounts
      content:
        name: results-credentials
        mountPath: /credentials
        readOnly: true
    template: templates/logfire-worker.yaml
    documentIndex: 0
  - hasDocuments:
      count: 0
    template: templates/logfire-scheduled-query-results.yaml
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GOOGLE_CLOUD_PROJECT
        valueFrom:
          secretKeyRef:
            name: results-credentials
            key: project
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: GOOGLE_CLOUD_PROJECT
        valueFrom:
          secretKeyRef:
            name: results-credentials
            key: project
    template: templates/logfire-worker.yaml
    documentIndex: 0
- it: an operator fsGroup reaches both shared-volume consumers
  set:
    podSecurityContext.fsGroup: 2000
  templates:
  - templates/logfire-backend.yaml
  - templates/logfire-worker.yaml
  - templates/logfire-scheduled-query-results.yaml
  asserts:
  - equal:
      path: spec.template.spec.securityContext.fsGroup
      value: 2000
    template: templates/logfire-backend.yaml
    documentIndex: 1
  - equal:
      path: spec.template.spec.securityContext.fsGroup
      value: 2000
    template: templates/logfire-worker.yaml
    documentIndex: 0
- it: rejects unsupported results storage
  set:
    scheduledQueryResults.uri: ftp://results
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: must be a GCS, S3, or Azure
- it: rejects results storage with whitespace
  set:
    scheduledQueryResults.uri: az://results bad
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: must be a GCS, S3, or Azure
- it: rejects an empty GCS bucket
  set:
    scheduledQueryResults.uri: gs://
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: must be a GCS, S3, or Azure
- it: rejects two result stores
  set:
    scheduledQueryResults.uri: gcs://results
    scheduledQueryResults.persistence.existingClaim: results
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: Set either
- it: rejects a claim without a storage size
  set:
    scheduledQueryResults.persistence.enabled: true
    scheduledQueryResults.persistence.storage: ''
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: persistence.storage is required
- it: rejects a claim without access modes
  set:
    scheduledQueryResults.persistence.enabled: true
    scheduledQueryResults.persistence.accessModes: []
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: accessModes must contain
- it: rejects bypassing the shared URI
  set:
    scheduledQueryResults.env.SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI: gs://other
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: Set scheduledQueryResults.uri instead
- it: rejects an overlapping volume
  set:
    scheduledQueryResults.volumes:
    - name: logfire-smtp-ca-bundle
      emptyDir: {}
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: chart-owned volume name
- it: rejects an overlapping credential mount
  set:
    scheduledQueryResults.volumeMounts:
    - name: adc
      mountPath: /var/lib/logfire
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: chart-owned mount path
- it: rejects bypassing the shared URI through inherited environment
  set:
    objectStore.env.SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI: s3://other
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: Set scheduledQueryResults.uri instead
- it: rejects a divergent URI in logfire-backend env
  set:
    logfire-backend.env:
    - name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
      value: s3://other
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: Set scheduledQueryResults.uri instead
- it: rejects a divergent URI in logfire-worker env
  set:
    logfire-worker.env:
    - name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
      value: s3://other
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: Set scheduledQueryResults.uri instead
- it: rejects an inherited credential mount at /var/lib
  set:
    objectStore.volumeMounts:
    - name: credentials
      mountPath: /var/lib
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: chart-owned mount path
- it: rejects an inherited credential mount at /
  set:
    objectStore.volumeMounts:
    - name: credentials
      mountPath: /
  templates:
  - templates/logfire-validate-config.yaml
  asserts:
  - failedTemplate:
      errorPattern: chart-owned mount path
