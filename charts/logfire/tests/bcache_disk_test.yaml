suite: bcache disk across upgrades
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
templates:
  - templates/logfire-ff-bcache.yaml
kubernetesProvider:
  scheme:
    "apps/v1/StatefulSet":
      gvr:
        group: apps
        version: v1
        resource: statefulsets
      namespaced: true
  objects:
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: logfire-ff-bcache
        namespace: default
      spec:
        volumeClaimTemplates:
          - metadata:
              name: bcache-data
            spec:
              resources:
                requests:
                  storage: 32Gi

tests:
  - it: a sizing preset change keeps the claim size of the installed StatefulSet
    set:
      sizingPreset: small
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 32Gi
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_BCACHE_DISK_CAPACITY
            value: "26214MB"
        documentSelector:
          path: kind
          value: StatefulSet

  - it: an explicit disk size equal to the installed claim renders
    set:
      sizingPreset: small
      logfire-ff-bcache:
        disk:
          storage: 32768Mi
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 32768Mi
        documentSelector:
          path: kind
          value: StatefulSet

  - it: an explicit disk size that differs from the installed claim fails with the resize step
    set:
      logfire-ff-bcache:
        disk:
          storage: 64Gi
    asserts:
      - failedTemplate:
          errorPattern: "run `kubectl delete statefulset logfire-ff-bcache --cascade=orphan`, and upgrade again"
