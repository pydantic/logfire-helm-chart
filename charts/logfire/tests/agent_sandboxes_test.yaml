suite: Agent Sandbox authority and isolation contracts
release:
  name: lf
  namespace: customer
set:
  objectStore.uri: s3://customer-data
  adminEmail: admin@example.test
  smtp.host: mail.example.test
  smtp.fromAddress: logfire@example.test
  agentSandboxes.imageTag: compatible-test-revision
  agentSandboxes.capacityOwnerId: 00000000-0000-0000-0000-000000000002
  inClusterTls.enabled: true
  inClusterTls.caBundle.existingConfigMap.name: customer-ca
  agentSandboxes.enabled: true
  agentSandboxes.allowedOrganizations:
    - 00000000-0000-0000-0000-000000000001
  agentSandboxes.workers.runtimeClassName: gvisor
tests:
  - it: requires a stable capacity owner before admission starts
    set:
      agentSandboxes.capacityOwnerId: null
    asserts:
      - failedTemplate:
          errorPattern: capacityOwnerId must be a stable installation UUID
  - it: rejects a capacity owner that is not a UUID
    set:
      agentSandboxes.capacityOwnerId: temporary-owner
    asserts:
      - failedTemplate:
          errorPattern: capacityOwnerId must be a stable installation UUID
  - it: supplies the shared capacity owner required by admission
    templates: [templates/logfire-agent-sandboxes-control.yaml]
    documentSelector:
      path: spec.template.metadata.labels.app
      value: monty-admission
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONTY_CAPACITY_OWNER_ID
            value: 00000000-0000-0000-0000-000000000002
  - it: requires CPU-clock execution bound to the immutable worker Pod identity
    templates: [templates/logfire-agent-sandboxes-workers.yaml]
    documentSelector:
      path: kind
      value: SandboxTemplate
    asserts:
      - contains:
          path: spec.podTemplate.spec.containers[0].env
          content:
            name: MONTY_WORKER_EXECUTION_CLOCK
            value: cpu
      - contains:
          path: spec.podTemplate.spec.containers[0].env
          content:
            name: MONTY_WORKER_EXECUTION_POD_UID
            valueFrom:
              fieldRef: {fieldPath: metadata.uid}
      - contains:
          path: spec.podTemplate.spec.containers[0].env
          content:
            name: MONTY_WORKER_REQUIRE_EXECUTION_BINDING
            value: "true"
  - it: permits only the relay and admission to contact worker execution endpoints
    templates: [templates/logfire-agent-sandboxes-workers.yaml]
    documentSelector:
      path: kind
      value: SandboxTemplate
    asserts:
      - equal:
          path: spec.networkPolicy.ingress
          value:
            - from:
                - namespaceSelector:
                    matchLabels: {kubernetes.io/metadata.name: customer}
                  podSelector:
                    matchLabels: {app: monty-relay}
                - namespaceSelector:
                    matchLabels: {kubernetes.io/metadata.name: customer}
                  podSelector:
                    matchLabels: {app: monty-admission}
              ports: [{protocol: TCP, port: 8000}]
  - it: refuses the old implicit Platform image
    set:
      agentSandboxes.imageTag: null
    asserts:
      - failedTemplate:
          errorPattern: requires an explicit compatible agentSandboxes.imageTag
  - it: requires TLS for authority credentials
    set:
      inClusterTls.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: requires inClusterTls.enabled
  - it: requires an explicit organization allowlist
    set:
      agentSandboxes.allowedOrganizations: []
    asserts:
      - failedTemplate:
          errorPattern: must contain at least one organization UUID
  - it: rejects organization names in place of UUIDs
    set:
      agentSandboxes.allowedOrganizations: [customer]
    asserts:
      - failedTemplate:
          errorPattern: must contain organization UUIDs
  - it: does not put untrusted workers beside the control plane
    set:
      agentSandboxes.workerNamespace: customer
    asserts:
      - failedTemplate:
          errorPattern: must be a separate valid namespace
  - it: requires an installed worker isolation runtime
    set:
      agentSandboxes.workers.runtimeClassName: ""
    asserts:
      - failedTemplate:
          errorPattern: must name an installed isolated runtime
  - it: reserves room to allocate beyond the warm pool
    set:
      agentSandboxes.workers.warmReplicas: 8
    asserts:
      - failedTemplate:
          errorPattern: warmReplicas < ceiling
  - it: rejects an unsupported snapshot retention policy
    set:
      agentSandboxes.snapshotQuota.retentionSeconds: 604801
    asserts:
      - failedTemplate:
          errorPattern: retentionSeconds between 1 and 604800
  - it: requires profiles before enabling file volumes
    set:
      agentSandboxes.volumesEnabled: true
      agentSandboxes.profilesEnabled: false
    asserts:
      - failedTemplate:
          errorPattern: volumesEnabled requires profilesEnabled
  - it: rejects a stale auth image override
    set:
      logfire-backend-auth.image.tag: incompatible
    asserts:
      - failedTemplate:
          errorPattern: requires matching Python and frontend image tags
  - it: gives the backend only the management credential
    templates: [templates/logfire-backend.yaml]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONTY_CONTROL_TOKEN
            valueFrom:
              secretKeyRef: {name: lf-agent-sandboxes, key: management}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONTY_CONTROL_URL
            value: https://monty-admission.customer.svc.cluster.local:8443
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MONTY_WORKBENCH_RELAY_URL, value: "ws://monty-relay.customer.svc.cluster.local:8000/"}
  - it: enables execution-key and profile resolution in auth
    templates: [templates/logfire-backend-auth.yaml]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MONTY_MANAGED_ENABLED, value: "true"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MONTY_PROFILES_ENABLED, value: "true"}
  - it: propagates custom DNS to controller and relay
    set:
      clusterDomain: corp.internal
      agentSandboxes.workerNamespace: customer-execution
    templates: [templates/logfire-agent-sandboxes-control.yaml]
    documentSelector:
      path: spec.template.metadata.labels.app
      value: monty-controller
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MONTY_KUBERNETES_CLUSTER_DOMAIN, value: corp.internal}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MONTY_NAMESPACE, value: customer-execution}
  - it: resolves the SDK relay in the configured namespace and cluster domain
    set:
      clusterDomain: corp.internal
    templates: [templates/logfire-service-config.yaml]
    asserts:
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: server relay monty-relay.customer.svc.corp.internal:8000

  - it: accepts reused values from before Agent Sandboxes existed
    set:
      agentSandboxes: null
    templates: [templates/logfire-backend.yaml]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment

  - it: binds remote MCP to matching images and private execution credentials
    templates: [templates/logfire-remote-mcp.yaml]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: us-docker.pkg.dev/pydantic-public-registries/logfire/logfire-remote-mcp-prod:compatible-test-revision
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MONTY_WORKBENCH_ENABLED, value: "true"}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MONTY_CONTROL_TOKEN
            valueFrom:
              secretKeyRef: {name: lf-agent-sandboxes, key: management}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MONTY_CONTROL_URL, value: "https://monty-admission.customer.svc.cluster.local:8443"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MONTY_WORKBENCH_RELAY_URL, value: "ws://monty-relay.customer.svc.cluster.local:8000/"}
  - it: permits the MCP caller on the private admission TLS endpoint
    templates: [templates/logfire-agent-sandboxes-network.yaml]
    documentSelector:
      path: metadata.name
      value: monty-admission-private
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels: {app.kubernetes.io/component: logfire-remote-mcp}
            ports: [{protocol: TCP, port: 8443}]
  - it: includes sandbox execution in the configured MCP OAuth consent
    set:
      gateway.tls: true
    templates: [templates/logfire-backend.yaml]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "BOOTSTRAPPED_ORGANIZATIONS")].value
          pattern: 'project:execute_agent_sandboxes'
  - it: keeps execution out of MCP OAuth consent when sandboxes are disabled
    set:
      agentSandboxes.enabled: false
      gateway.tls: true
    templates: [templates/logfire-backend.yaml]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "BOOTSTRAPPED_ORGANIZATIONS")].value
          pattern: 'project:execute_agent_sandboxes'
