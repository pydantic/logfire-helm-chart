suite: chart-owned container security contexts
# Precedence contract for the user-facing securityContext values: a per-service
# context beats the chart-wide context beats the image defaults, and an explicit
# null clear survives. The defaults themselves are restricted-PSS-compatible and
# enforced by the CI install in a pod-security.kubernetes.io/enforce=restricted
# namespace; only merge semantics live here (they fail silently).
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
tests:
  - it: lets the chart-wide securityContext override the defaults
    set:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        readOnlyRootFilesystem: false
    templates:
      - templates/logfire-worker.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: false
        documentSelector:
          path: kind
          value: Deployment

  - it: lets a per-service securityContext override the chart-wide context and the defaults
    set:
      securityContext:
        runAsUser: 2000
        readOnlyRootFilesystem: false
      logfire-task-runner:
        securityContext:
          runAsUser: 3000
          readOnlyRootFilesystem: true
    templates:
      - templates/logfire-task-runner.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 3000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
        documentSelector:
          path: kind
          value: Deployment

  - it: keeps a cleared identity cleared
    set:
      securityContext:
        runAsUser: null
      logfire-backend:
        securityContext:
          runAsGroup: null
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
        documentSelector:
          path: kind
          value: Deployment

  - it: keeps the defaults when the release values carry empty security contexts
    set:
      securityContext: {}
      logfire-backend:
        securityContext: {}
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
        documentSelector:
          path: kind
          value: Deployment

