suite: migration hooks and node scale-down
templates:
  - templates/logfire-backend-migrations.yaml
  - templates/logfire-ff-migrations.yaml
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
tests:
  - it: keeps the cluster autoscaler from removing the node of a running migration
    asserts:
      - equal:
          path: spec.template.metadata.annotations["cluster-autoscaler.kubernetes.io/safe-to-evict"]
          value: "false"

  - it: lets hooksAnnotations override the default and still add its own keys
    set:
      hooksAnnotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        example.com/owner: platform
    asserts:
      - equal:
          path: spec.template.metadata.annotations["cluster-autoscaler.kubernetes.io/safe-to-evict"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: platform
