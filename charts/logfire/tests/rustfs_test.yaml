suite: development RustFS object store
# Compatibility contract for the deprecated dev.deployMinio alias: a values file
# written for the old MinIO subchart must keep driving the in-cluster store
# (Service name, credentials, persistence) across an upgrade. Rendering shape and
# the dev.deployRustfs happy path are exercised by the CI install, which deploys
# RustFS and ingests through it; only the upgrade path lives here.
release:
  name: lf
  namespace: default
templates:
  - templates/rustfs.yaml
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://logfire
  dev:
    deployPostgres: true
tests:
  - it: keeps the MinIO Service name and credentials for the deprecated alias
    set:
      dev:
        deployMinio: true
      minio:
        auth:
          rootUser: logfire-minio
          rootPassword: logfire-minio
        persistence:
          enabled: false
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: stringData
          value:
            accessKey: logfire-minio
            secretKey: logfire-minio
        documentSelector:
          path: kind
          value: Secret
      - equal:
          path: spec.ports[0].port
          value: 9000
        documentSelector:
          path: metadata.name
          value: logfire-minio
      - equal:
          path: spec.template.spec.volumes[0].emptyDir
          value: {}
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: rustfs/rustfs:1.0.0
        documentSelector:
          path: kind
          value: Deployment

  - it: uses the objectStore.env credentials while dev.deployMinio is set
    set:
      dev:
        deployMinio: true
      objectStore:
        env:
          AWS_ACCESS_KEY_ID: env-access-key
          AWS_SECRET_ACCESS_KEY: env-secret-key
    asserts:
      - equal:
          path: stringData
          value:
            accessKey: env-access-key
            secretKey: env-secret-key
        documentSelector:
          path: kind
          value: Secret

  - it: expands templates in the legacy objectStore.env credentials
    set:
      dev:
        deployMinio: true
      objectStore:
        env:
          AWS_ACCESS_KEY_ID: "{{ .Release.Name }}-access-key"
          AWS_SECRET_ACCESS_KEY: "{{ .Release.Name }}-secret-key"
    asserts:
      - equal:
          path: stringData
          value:
            accessKey: lf-access-key
            secretKey: lf-secret-key
        documentSelector:
          path: kind
          value: Secret

  - it: prefers the objectStore.env credentials over rustfs.auth while dev.deployMinio is set
    set:
      dev:
        deployMinio: true
        deployRustfs: true
      objectStore:
        env:
          AWS_ACCESS_KEY_ID: env-access-key
          AWS_SECRET_ACCESS_KEY: env-secret-key
      rustfs:
        auth:
          accessKey: new-access-key
          secretKey: new-secret-key
    asserts:
      - equal:
          path: stringData
          value:
            accessKey: env-access-key
            secretKey: env-secret-key
        documentSelector:
          path: kind
          value: Secret

  - it: uses minio.persistence while dev.deployMinio is set
    set:
      dev:
        deployMinio: true
      minio:
        persistence:
          enabled: true
          size: 10Gi
          storageClass: fast
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
        documentSelector:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.storageClassName
          value: fast
        documentSelector:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: logfire-rustfs
        documentSelector:
          path: kind
          value: Deployment

  - it: renders with template defaults when the rustfs values are absent
    set:
      dev:
        deployRustfs: true
      rustfs: null
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: stringData.accessKey
          value: logfire-rustfs
        documentSelector:
          path: kind
          value: Secret
      - equal:
          path: spec.resources.requests.storage
          value: 32Gi
        documentSelector:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
        documentSelector:
          path: kind
          value: Deployment
  - it: keeps the MinIO credentials when both flags are set without rustfs values
    set:
      dev:
        deployMinio: true
        deployRustfs: true
      rustfs: null
      minio:
        auth:
          rootUser: logfire-minio
          rootPassword: logfire-minio
    asserts:
      - equal:
          path: stringData
          value:
            accessKey: logfire-minio
            secretKey: logfire-minio
        documentSelector:
          path: kind
          value: Secret
