suite: development RustFS object store
# A `--reuse-values` upgrade from a chart that predates the `rustfs` block must still render a
# usable store. Rendering shape and the dev.deployRustfs happy path are exercised by the CI
# install, which deploys RustFS and ingests through it.
release:
  name: lf
  namespace: default
templates:
  - templates/rustfs.yaml
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://logfire
  dev:
    deployPostgres: true
tests:
  - it: renders with template defaults when the rustfs values are absent
    set:
      dev:
        deployRustfs: true
      rustfs: null
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: stringData.accessKey
          value: logfire-rustfs
        documentSelector:
          path: kind
          value: Secret
      - equal:
          path: spec.resources.requests.storage
          value: 32Gi
        documentSelector:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
        documentSelector:
          path: kind
          value: Deployment
