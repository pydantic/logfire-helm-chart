suite: otel collector config contracts
# Only the invariants a retune must not break: explicit values win over derived
# ones, pipelines stay isolated so the Prometheus converter cannot leak into the
# backend metrics, and surfaces the two halves of the chart own together agree.
# Rendered defaults (queue sizes, GC numbers, headroom, derived naming) are
# deliberately not pinned: those are retuned regularly and must not churn tests.
# Values that must fail the install live in validation_test.yaml.
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
tests:
  - it: keeps queues and batches inside the exporter so rejection reaches the receiver
    set:
      sizingPreset: standard
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'processors: \[memory_limiter, k8s_attributes\]'
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'send_batch_size'

  - it: honors explicit translation and queue overrides
    set:
      otel_collector.prometheus.enabled: true
      otel_collector.prometheus.translation_strategy: NoTranslation
      otel_collector.prometheus.max_stale: 10m
      otel_collector.exporter.sending_queue.queue_size: 123456
      otel_collector.exporter.sending_queue.batch.min_size: 16384
      otel_collector.exporter.sending_queue.batch.max_size: 32768
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'translation_strategy: NoTranslation'
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'max_stale: 10m'
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'queue_size: 123456'
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'max_size: 32768'

  - it: an explicit translation_strategy wins over the derived value
    set:
      otel_collector:
        prometheus:
          enabled: true
          add_metric_suffixes: false
          translation_strategy: NoTranslation
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'translation_strategy: NoTranslation'
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'translation_strategy: UnderscoreEscapingWithoutSuffixes'

  - it: an explicit translation_strategy still wins when add_metric_suffixes is true
    set:
      otel_collector:
        prometheus:
          enabled: true
          add_metric_suffixes: true
          translation_strategy: NoTranslation
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'translation_strategy: NoTranslation'
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'add_metric_suffixes'

  # The Prometheus exporter gets its own metrics pipeline behind delta_to_cumulative so
  # the backend keeps delta semantics. The converter must never leak into the backend
  # metrics pipeline: dashboards would silently misread counters.
  - it: routes Prometheus through delta_to_cumulative on its own pipeline
    set:
      otel_collector:
        prometheus:
          enabled: true
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'metrics/prometheus:\n\s+receivers: \[otlp\]\n\s+processors: \[memory_limiter, k8s_attributes, delta_to_cumulative\]\n\s+exporters: \[prometheus\]'

  - it: keeps the backend metrics pipeline free of delta_to_cumulative and prometheus
    set:
      otel_collector:
        prometheus:
          enabled: true
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'metrics:\n\s+receivers: \[otlp\]\n\s+processors: \[memory_limiter, k8s_attributes\]\n\s+exporters: \[otlp_http\]'

  - it: preserves a user GC setting without adding another copy
    set:
      logfire-otel-collector.env:
        - name: GOMEMLIMIT
          value: 500MiB
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 5
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 500MiB

  - it: preserves a user GC setting from the env map form
    set:
      logfire-otel-collector.env.GOMEMLIMIT: 500MiB
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 5
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 500MiB

  - it: preserves explicit disk budgets and security overrides
    set:
      otel_collector.queueStorage.enabled: true
      logfire-otel-collector.resources:
        requests:
          ephemeral-storage: 1Gi
        limits:
          ephemeral-storage: 6Gi
      podSecurityContext.fsGroup: 2000
      logfire-otel-collector.podSecurityContext.fsGroup: 3000
      logfire-otel-collector.securityContext.runAsUser: 3000
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 3000
      - equal:
          path: spec.template.spec.containers[0].resources.requests["ephemeral-storage"]
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits["ephemeral-storage"]
          value: 6Gi

  # The self-metrics port is set in the config one template renders and bound in
  # another; if the two disagree the scraper talks to a closed port.
  - it: binds the self-metrics container port to the configured value
    set:
      otel_collector.selfMetricsPort: 9999
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 9999
            name: self-metrics

  - it: scrapes the same self-metrics port that the collector binds
    set:
      otel_collector.selfMetricsPort: 9999
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'targets: \["127.0.0.1:9999"\]'
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'port: 9999'

  - it: supplies the pod UID used by the collector self-metric identity
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTELCOL_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid

  - it: honors a Recreate rollout without retaining RollingUpdate settings
    set:
      logfire-otel-collector.strategy.type: Recreate
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.strategy.rollingUpdate

  - it: moves plain exporter header values from the config to the headers Secret
    set:
      otel_collector.exporter.headers:
        Authorization: Bearer sentinel-0123456789
        X-Own: ${env:MY_TOKEN}
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - notMatchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: sentinel
        documentSelector:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'Authorization: \$\{env:LOGFIRE_EXPORTER_HEADER_AUTHORIZATION_ca5839e3\}'
        documentSelector:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'X-Own: \$\{env:MY_TOKEN\}'
        documentSelector:
          path: kind
          value: ConfigMap
      - equal:
          path: data
          value:
            LOGFIRE_EXPORTER_HEADER_AUTHORIZATION_ca5839e3: QmVhcmVyIHNlbnRpbmVsLTAxMjM0NTY3ODk=
        documentSelector:
          path: metadata.name
          value: logfire-otel-collector-exporter-headers

  - it: reads each moved header from the Secret key the config names
    set:
      otel_collector.exporter.headers:
        Authorization: Bearer sentinel-0123456789
    template: templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOGFIRE_EXPORTER_HEADER_AUTHORIZATION_ca5839e3
            valueFrom:
              secretKeyRef:
                name: logfire-otel-collector-exporter-headers
                key: LOGFIRE_EXPORTER_HEADER_AUTHORIZATION_ca5839e3

  - it: passes a list of exporter headers through unchanged
    set:
      otel_collector.exporter.headers:
        - name: Authorization
          value: Bearer sentinel-0123456789
    template: templates/logfire-otel-collector-cfg.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'value: Bearer sentinel-0123456789'

  - it: reads a valueFrom header from the user's Secret without a chart Secret
    set:
      otel_collector.exporter.headers:
        Authorization:
          valueFrom:
            secretKeyRef:
              name: my-headers
              key: authorization
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'Authorization: \$\{env:LOGFIRE_EXPORTER_HEADER_AUTHORIZATION_ca5839e3\}'
        template: templates/logfire-otel-collector-cfg.yaml
      - hasDocuments:
          count: 1
        template: templates/logfire-otel-collector-cfg.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOGFIRE_EXPORTER_HEADER_AUTHORIZATION_ca5839e3
            valueFrom:
              secretKeyRef:
                name: my-headers
                key: authorization
        template: templates/logfire-otel-collector.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: keeps integers too large for int64 in the config and moves small ones
    set:
      otel_collector.exporter.headers:
        X-Hex: "0xdeadbeefdeadbeef"
        X-Under: "9_223_372_036_854_775_808"
        X-Small: "123"
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'X-Hex: "?0xdeadbeefdeadbeef'
        documentSelector:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["otel-collector-config.yaml"]
          pattern: 'X-Under: "?9_223_372_036_854_775_808'
        documentSelector:
          path: kind
          value: ConfigMap
      - equal:
          path: data
          value:
            LOGFIRE_EXPORTER_HEADER_X_SMALL_912a152d: MTIz
        documentSelector:
          path: metadata.name
          value: logfire-otel-collector-exporter-headers

  - it: creates no headers Secret for a list of headers
    set:
      otel_collector.exporter.headers:
        - name: Authorization
          value: Bearer sentinel-0123456789
    template: templates/logfire-otel-collector-cfg.yaml
    asserts:
      - hasDocuments:
          count: 1
