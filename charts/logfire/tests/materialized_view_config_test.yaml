suite: materialized-view configuration
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
templates:
  - templates/logfire-ff-config.yaml
tests:
  - it: limits initial backfills for newly created views to one day by default
    asserts:
      - equal:
          path: data.FF_MV_INITIAL_BACKFILL_WINDOW
          value: 1d
        documentSelector:
          path: metadata.name
          value: logfire-ff-base-config

  - it: allows an explicit full-history initial backfill
    set:
      fusionfireMaterializedViews:
        initialBackfillWindow: 0s
    asserts:
      - equal:
          path: data.FF_MV_INITIAL_BACKFILL_WINDOW
          value: 0s
        documentSelector:
          path: metadata.name
          value: logfire-ff-base-config
