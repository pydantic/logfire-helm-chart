suite: inline credentials
# A credential given as a plain value must not appear in a pod spec: the chart stores it in the
# Secret logfire-inline-credentials and the workloads reference that Secret. Credentials set with
# valueFrom keep pointing at the user's own Secret, and plain settings stay visible env values.
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
tests:
  - it: stores plain credentials in the inline credentials Secret
    set:
      smtp:
        host: smtp.example.com
        fromAddress: logfire@example.com
        username: mailer
        password: smtp-sentinel
      ai:
        openAi:
          apiKey: openai-sentinel
      objectStore:
        sseCKeyB64: ssec-sentinel
        env:
          AWS_SECRET_ACCESS_KEY: aws-sentinel
          AWS_ENDPOINT: https://s3.example.com
    template: templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: logfire-inline-credentials
    asserts:
      - equal:
          path: data
          value:
            ai.openAi.apiKey: b3BlbmFpLXNlbnRpbmVs
            objectStore.env.AWS_SECRET_ACCESS_KEY: YXdzLXNlbnRpbmVs
            objectStore.sseCKeyB64: c3NlYy1zZW50aW5lbA==
            smtp.password: c210cC1zZW50aW5lbA==

  - it: workloads reference the Secret instead of holding the value
    set:
      smtp:
        host: smtp.example.com
        fromAddress: logfire@example.com
        password: smtp-sentinel
      ai:
        openAi:
          apiKey: openai-sentinel
      objectStore:
        env:
          AWS_SECRET_ACCESS_KEY: aws-sentinel
          AWS_ENDPOINT: https://s3.example.com
    templates:
      - templates/logfire-worker.yaml
      - templates/logfire-task-runner.yaml
      - templates/logfire-backend.yaml
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            value: smtp-sentinel
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            value: openai-sentinel
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            value: aws-sentinel
          any: true

  - it: the worker reads each credential from its Secret key and keeps settings visible
    set:
      smtp:
        host: smtp.example.com
        fromAddress: logfire@example.com
        password: smtp-sentinel
      objectStore:
        env:
          AWS_SECRET_ACCESS_KEY: aws-sentinel
          AWS_ENDPOINT: https://s3.example.com
    template: templates/logfire-worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: logfire-inline-credentials
                key: smtp.password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: logfire-inline-credentials
                key: objectStore.env.AWS_SECRET_ACCESS_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ENDPOINT
            value: https://s3.example.com
      - exists:
          path: spec.template.metadata.annotations["checksum/logfire-inline-credentials"]

  - it: credentials set with valueFrom stay references and need no chart Secret
    set:
      smtp:
        host: smtp.example.com
        fromAddress: logfire@example.com
        password:
          valueFrom:
            secretKeyRef: {name: smtp, key: password}
    templates:
      - templates/secrets.yaml
      - templates/logfire-task-runner.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-inline-credentials
          any: true
        not: true
        template: templates/secrets.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: smtp
                key: password
        template: templates/logfire-task-runner.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-inline-credentials"]
        template: templates/logfire-task-runner.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: a value that references another env var stays a literal
    set:
      objectStore:
        env:
          AWS_SESSION_TOKEN: $(OTHER_TOKEN)
    template: templates/logfire-worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_SESSION_TOKEN
            value: $(OTHER_TOKEN)

  - it: stores a $$ escape the way Kubernetes expands it in a literal value
    set:
      objectStore:
        env:
          AWS_SECRET_ACCESS_KEY: pa$$word
    template: templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: logfire-inline-credentials
    asserts:
      - equal:
          path: data["objectStore.env.AWS_SECRET_ACCESS_KEY"]
          value: cGEkd29yZA==

  - it: moves an Azure connection string and a value whose valueFrom is null
    set:
      objectStore:
        env:
          AZURE_STORAGE_CONNECTION_STRING: AccountName=a;AccountKey=conn-sentinel
          AWS_SESSION_TOKEN:
            value: token-sentinel
            valueFrom: null
    template: templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: logfire-inline-credentials
    asserts:
      - equal:
          path: data
          value:
            objectStore.env.AZURE_STORAGE_CONNECTION_STRING: QWNjb3VudE5hbWU9YTtBY2NvdW50S2V5PWNvbm4tc2VudGluZWw=
            objectStore.env.AWS_SESSION_TOKEN: dG9rZW4tc2VudGluZWw=

  - it: a templated credential resolves the same in every workload and in the Secret
    set:
      objectStore:
        env:
          AWS_SESSION_TOKEN: '{{ if not (hasSuffix "secrets.yaml" .Template.Name) }}sentinel{{ end }}'
    templates:
      - templates/secrets.yaml
      - templates/logfire-worker.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-inline-credentials
          any: true
        not: true
        template: templates/secrets.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            value: sentinel
          any: true
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            valueFrom:
              secretKeyRef:
                name: logfire-inline-credentials
                key: objectStore.env.AWS_SESSION_TOKEN
          any: true
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: rejects a credential name that cannot be a Secret key
    set:
      objectStore:
        env:
          MY:TOKEN: sentinel
    template: templates/secrets.yaml
    asserts:
      - failedTemplate:
          errorPattern: is not a valid Secret key

  - it: an unset-looking AI key stores nothing
    set:
      ai:
        openAi:
          apiKey: false
    template: templates/secrets.yaml
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: logfire-inline-credentials
          any: true
        not: true

  - it: a credential name that is not a valid Secret key still works with valueFrom
    set:
      objectStore:
        env:
          MY:TOKEN:
            valueFrom:
              secretKeyRef: {name: s, key: token}
    template: templates/secrets.yaml
    asserts:
      - notFailedTemplate: {}

  - it: templated credentials can read subcharts
    set:
      dev:
        deployCertManager: true
      objectStore:
        env:
          AWS_SESSION_TOKEN: 'sentinel-{{ (index .Subcharts "cert-manager").Chart.Name }}'
    template: templates/secrets.yaml
    documentSelector:
      path: metadata.name
      value: logfire-inline-credentials
    asserts:
      - exists:
          path: data["objectStore.env.AWS_SESSION_TOKEN"]
