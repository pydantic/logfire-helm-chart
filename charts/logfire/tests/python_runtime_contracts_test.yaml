suite: pinned Python runtime contracts
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
tests:
  - it: gives the backend and worker the same durable claim and feature directories
    templates:
      - templates/logfire-python-object-store.yaml
      - templates/logfire-backend.yaml
      - templates/logfire-worker.yaml
    asserts:
      - equal:
          path: metadata.name
          value: logfire-python-object-store
        template: templates/logfire-python-object-store.yaml
      - equal:
          path: spec.accessModes
          value: [ReadWriteMany]
        template: templates/logfire-python-object-store.yaml
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: templates/logfire-python-object-store.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: logfire-data
            persistentVolumeClaim:
              claimName: logfire-python-object-store
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: logfire-data
            persistentVolumeClaim:
              claimName: logfire-python-object-store
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_REPLAY_OBJECT_STORE_URI
            value: file:///var/lib/logfire/session-replays
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_REPLAY_OBJECT_STORE_URI
            value: file:///var/lib/logfire/session-replays
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VISUAL_TESTS_OBJECT_STORE_URI
            value: file:///var/lib/logfire/visual-tests
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VISUAL_TESTS_OBJECT_STORE_URI
            value: file:///var/lib/logfire/visual-tests
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
            value: file:///var/lib/logfire/scheduled-query-results
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI
            value: file:///var/lib/logfire/scheduled-query-results
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: mounts an existing claim in both services without creating another claim
    set:
      pythonObjectStore.persistence.existingClaim: shared-python-objects
    templates:
      - templates/logfire-python-object-store.yaml
      - templates/logfire-backend.yaml
      - templates/logfire-worker.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: templates/logfire-python-object-store.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: logfire-data
            persistentVolumeClaim:
              claimName: shared-python-objects
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: logfire-data
            persistentVolumeClaim:
              claimName: shared-python-objects
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: uses the shared storage class and capacity override
    set:
      defaultStorageClassName: generic-storage
      pythonObjectStore.persistence:
        storageClassName: shared-storage
        size: 25Gi
    templates:
      - templates/logfire-python-object-store.yaml
    asserts:
      - equal:
          path: spec.storageClassName
          value: shared-storage
      - equal:
          path: spec.resources.requests.storage
          value: 25Gi

  - it: inherits the global storage class when no shared-store override is supplied
    set:
      defaultStorageClassName: shared-storage
    templates:
      - templates/logfire-python-object-store.yaml
    asserts:
      - equal:
          path: spec.storageClassName
          value: shared-storage

  - it: preserves chart and service ownership overrides for shared storage
    set:
      podSecurityContext.fsGroup: 2000
      logfire-worker.podSecurityContext.fsGroup: 3000
    templates:
      - templates/logfire-backend.yaml
      - templates/logfire-worker.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 3000
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: refuses per-pod ephemeral storage for features shared by the backend and worker
    set:
      pythonObjectStore.persistence.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: 'pythonObjectStore.persistence.enabled must remain true'

  - it: requires capacity when creating the shared claim
    set:
      pythonObjectStore.persistence.size: ""
    asserts:
      - failedTemplate:
          errorPattern: 'pythonObjectStore.persistence.size is required'

  - it: requires a multi-node writable claim outside development
    set:
      dev.deployPostgres: false
      postgresDsn: postgres://postgres:password@postgres/crud
      postgresFFDsn: postgres://postgres:password@postgres/ff
      logfire-dex.config.storage.config.host: postgres
      pythonObjectStore.persistence.accessModes: [ReadWriteOnce]
    asserts:
      - failedTemplate:
          errorPattern: 'pythonObjectStore.persistence.accessModes must include ReadWriteMany'

  - it: accepts a shared RWO claim for single-node development
    set:
      pythonObjectStore.persistence.accessModes: [ReadWriteOnce]
    templates:
      - templates/logfire-python-object-store.yaml
    asserts:
      - equal:
          path: spec.accessModes
          value: [ReadWriteOnce]

  - it: rejects a usage Redis instance the pinned worker cannot read
    set:
      usageRedis.dsn: redis://usage-redis:6379
    asserts:
      - failedTemplate:
          errorPattern: 'pinned platform worker cannot consume separate usage Redis data'

  - it: rejects usage key prefixes the pinned worker cannot read
    set:
      usageRedis.prefix: usage
    asserts:
      - failedTemplate:
          errorPattern: 'leave usageRedis.prefix empty'

  - it: keeps MCP in self-hosted mode and on the same usage Redis as the backend and worker
    set:
      redisDsn: redis://shared-redis:6379
      usageRedis.dsn: redis://shared-redis:6379
    templates:
      - templates/logfire-remote-mcp.yaml
      - templates/logfire-backend.yaml
      - templates/logfire-worker.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ON_PREM
            value: "true"
        template: templates/logfire-remote-mcp.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USAGE_REDIS_DSN
            value: redis://shared-redis:6379
        template: templates/logfire-remote-mcp.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USAGE_REDIS_PREFIX
            value: ""
        template: templates/logfire-remote-mcp.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USAGE_REDIS_DSN
            value: redis://shared-redis:6379
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SHARED_REDIS_DSN
            value: redis://shared-redis:6379
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health/live
        template: templates/logfire-remote-mcp.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
        template: templates/logfire-remote-mcp.yaml
        documentSelector:
          path: kind
          value: Deployment
