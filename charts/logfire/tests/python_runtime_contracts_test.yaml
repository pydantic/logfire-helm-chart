suite: pinned Python runtime contracts
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
tests:
  - it: refuses per-pod ephemeral storage for features shared by the backend and worker
    set:
      pythonObjectStore.persistence.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: 'pythonObjectStore.persistence.enabled must remain true'

  - it: requires capacity when creating the shared claim
    set:
      pythonObjectStore.persistence.size: ""
    asserts:
      - failedTemplate:
          errorPattern: 'pythonObjectStore.persistence.size is required'

  - it: requires a multi-node writable claim outside development
    set:
      dev.deployPostgres: false
      postgresDsn: postgres://postgres:password@postgres/crud
      postgresFFDsn: postgres://postgres:password@postgres/ff
      logfire-dex.config.storage.config.host: postgres
      pythonObjectStore.persistence.accessModes: [ReadWriteOnce]
    asserts:
      - failedTemplate:
          errorPattern: 'pythonObjectStore.persistence.accessModes must include ReadWriteMany'

  - it: preserves global and service ownership overrides for shared storage
    set:
      podSecurityContext.fsGroup: 2000
      logfire-worker.podSecurityContext.fsGroup: 3000
    templates:
      - templates/logfire-backend.yaml
      - templates/logfire-worker.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 3000
        template: templates/logfire-worker.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: lets both Python services read restricted GCS credentials without a filesystem claim
    set:
      objectStore:
        uri: gs://test-bucket/python-files/
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcs/service-account.json
        volumeMounts:
          - name: gcs-credentials
            mountPath: /var/run/gcs
            readOnly: true
        volumes:
          - name: gcs-credentials
            secret:
              secretName: gcs-credentials
              defaultMode: 0400
      pythonObjectStore.persistence.enabled: false
    templates:
      - templates/logfire-python-object-store.yaml
      - templates/logfire-backend.yaml
      - templates/logfire-worker.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: templates/logfire-python-object-store.yaml
      - notExists: &filesystemClaim
          path: spec.template.spec.volumes[*].persistentVolumeClaim
        template: templates/logfire-backend.yaml
        documentSelector: &deployment
          path: kind
          value: Deployment
      - notExists: *filesystemClaim
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - equal: &credentialsGroup
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - equal: *credentialsGroup
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - equal: &replayUri
          path: spec.template.spec.containers[0].env[?(@.name == "SESSION_REPLAY_OBJECT_STORE_URI")].value
          value: gs://test-bucket/python-files/session-replays
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - equal: *replayUri
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - equal: &visualTestsUri
          path: spec.template.spec.containers[0].env[?(@.name == "VISUAL_TESTS_OBJECT_STORE_URI")].value
          value: gs://test-bucket/python-files/visual-tests
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - equal: *visualTestsUri
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - equal: &reportsUri
          path: spec.template.spec.containers[0].env[?(@.name == "SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI")].value
          value: gs://test-bucket/python-files/scheduled-query-results
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - equal: *reportsUri
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - equal: &credentialsPath
          path: spec.template.spec.containers[0].env[?(@.name == "GOOGLE_APPLICATION_CREDENTIALS")].value
          value: /var/run/gcs/service-account.json
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - equal: *credentialsPath
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - contains: &credentialsMount
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gcs-credentials
            mountPath: /var/run/gcs
            readOnly: true
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - contains: *credentialsMount
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - contains: &credentialsVolume
          path: spec.template.spec.volumes
          content:
            name: gcs-credentials
            secret:
              secretName: gcs-credentials
              defaultMode: 0400
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - contains: *credentialsVolume
        template: templates/logfire-worker.yaml
        documentSelector: *deployment

  - it: gives both Python services the existing filesystem claim when the main object store uses GCS
    set:
      objectStore.uri: gs://test-bucket/python-files/
      pythonObjectStore.persistence.existingClaim: shared-python-files
    templates:
      - templates/logfire-python-object-store.yaml
      - templates/logfire-backend.yaml
      - templates/logfire-worker.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: templates/logfire-python-object-store.yaml
      - contains: &existingClaim
          path: spec.template.spec.volumes
          content:
            name: logfire-data
            persistentVolumeClaim:
              claimName: shared-python-files
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - contains: *existingClaim
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - contains: &sharedMount
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: logfire-data
            mountPath: /var/lib/logfire
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - contains: *sharedMount
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - equal: &fileReplayUri
          path: spec.template.spec.containers[0].env[?(@.name == "SESSION_REPLAY_OBJECT_STORE_URI")].value
          value: file:///var/lib/logfire/session-replays
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - equal: *fileReplayUri
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - equal: &fileVisualTestsUri
          path: spec.template.spec.containers[0].env[?(@.name == "VISUAL_TESTS_OBJECT_STORE_URI")].value
          value: file:///var/lib/logfire/visual-tests
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - equal: *fileVisualTestsUri
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
      - equal: &fileReportsUri
          path: spec.template.spec.containers[0].env[?(@.name == "SCHEDULED_QUERY_RESULTS_OBJECT_STORE_URI")].value
          value: file:///var/lib/logfire/scheduled-query-results
        template: templates/logfire-backend.yaml
        documentSelector: *deployment
      - equal: *fileReportsUri
        template: templates/logfire-worker.yaml
        documentSelector: *deployment
