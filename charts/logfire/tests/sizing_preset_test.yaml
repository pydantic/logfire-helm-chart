suite: sizing preset behavior
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
tests:
  - it: service-level autoscaling overrides preset values
    set:
      sizingPreset: tiny
      logfire-backend:
        autoscaling:
          minReplicas: 7
          maxReplicas: 9
          hpa:
            enabled: true
            cpuAverage: 60
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - equal:
          path: spec.minReplicas
          value: 7
        documentSelector:
          path: kind
          value: HorizontalPodAutoscaler
      - equal:
          path: spec.maxReplicas
          value: 9
        documentSelector:
          path: kind
          value: HorizontalPodAutoscaler

  - it: ingest StatefulSet PVC template is stable for tiny
    set:
      sizingPreset: tiny
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts: &ingest_pvc_template_asserts
      - notExists:
          path: spec.serviceName
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: ingest-data
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: ReadWriteOnce
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 16Gi
        documentSelector:
          path: kind
          value: StatefulSet
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
        documentSelector:
          path: kind
          value: StatefulSet

  - it: ingest StatefulSet PVC template is stable for small
    set:
      sizingPreset: small
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts: *ingest_pvc_template_asserts

  - it: ingest StatefulSet PVC template is stable for standard
    set:
      sizingPreset: standard
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts: *ingest_pvc_template_asserts

  - it: ingest StatefulSet PVC template is stable for large
    set:
      sizingPreset: large
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts: *ingest_pvc_template_asserts

  - it: unknown preset name fails the install
    set:
      sizingPreset: not-a-real-preset
    asserts:
      - failedTemplate:
          errorMessage: 'Unknown sizingPreset "not-a-real-preset". Valid presets: dev, large, small, standard, tiny'

  - it: standard ingest processor can burst beyond its resource requests
    set:
      sizingPreset: standard
    templates:
      - templates/logfire-ff-ingest-processor.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 2
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 4Gi
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.spec.containers[0].resources.limits
        documentSelector:
          path: kind
          value: Deployment

  - it: standard AI gateway has additional memory headroom
    set:
      sizingPreset: standard
      logfire-ai-gateway:
        enabled: true
    templates:
      - templates/logfire-ai-gateway.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
        documentSelector:
          path: kind
          value: Deployment

  - it: large ingest processor keeps burstable resources after preset overrides
    set:
      sizingPreset: large
    templates:
      - templates/logfire-ff-ingest-processor.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 4
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 4Gi
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.spec.containers[0].resources.limits
        documentSelector:
          path: kind
          value: Deployment
