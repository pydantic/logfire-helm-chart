suite: workload autoscaling lifecycle
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
templates:
  - templates/logfire-backend.yaml
tests:
  - it: adapts legacy metrics to HPA and suppresses fixed replicas
    set:
      logfire-backend:
        autoscaling:
          minReplicas: 2
          maxReplicas: 5
          cpuAverage: 60
    asserts:
      - notExists:
          path: spec.replicas
        documentSelector: &deployment
          path: kind
          value: Deployment
      - equal:
          path: spec.minReplicas
          value: 2
        documentSelector: &hpa
          path: kind
          value: HorizontalPodAutoscaler
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 60
        documentSelector: *hpa

  - it: treats quoted false flags as disabled
    set:
      logfire-backend:
        autoscaling:
          hpa:
            enabled: "false"
            cpuAverage: 60
          keda:
            enabled: "false"
            triggers:
              - type: cpu
    asserts:
      - hasDocuments:
          count: 2
