suite: workload Secret rollout policy
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
tests:
  - it: renders managed Secret checksums from the backend dependency profile
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/logfire-postgres-dsn"]
          value: default-checksum
        documentSelector: &deployment
          path: kind
          value: Deployment
      - equal:
          path: spec.template.metadata.annotations["checksum/logfire-jwt-secret"]
          value: default-checksum
        documentSelector: *deployment
      - equal:
          path: spec.template.metadata.annotations["checksum/logfire-admin-password"]
          value: default-checksum
        documentSelector: *deployment

  - it: external annotations suppress checksums and preserve source precedence
    set:
      postgresSecret:
        enabled: true
        name: postgres-secret
        annotations:
          reload: postgres
      existingSecret:
        enabled: true
        name: logfire-secret
        annotations:
          reload: existing
      adminSecret:
        enabled: true
        name: admin-secret
        annotations:
          reload: admin
      logfire-backend:
        annotations:
          reload: workload
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - equal:
          path: metadata.annotations.reload
          value: workload
        documentSelector: *deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-postgres-dsn"]
        documentSelector: *deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-jwt-secret"]
        documentSelector: *deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/logfire-admin-password"]
        documentSelector: *deployment
