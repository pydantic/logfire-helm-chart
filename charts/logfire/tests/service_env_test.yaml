suite: service env values shapes
# `<service>.env` accepts the legacy EnvVar list and a name-keyed map. Helm
# replaces lists across values files but merges maps, so only the map lets a
# second file add a variable without dropping the first file's entries.
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
tests:
  - it: renders the list form unchanged
    template: templates/dex/deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      logfire-dex.env:
        - name: PORT
          value: "8080"
        - name: DEX_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dex-credentials
              key: db-password
    asserts: &envAsserts
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PORT
            value: "8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: dex-credentials
                key: db-password

  - it: renders the map form as the same entries
    template: templates/dex/deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      logfire-dex.env:
        PORT: 8080
        DEX_DB_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: dex-credentials
              key: db-password
    asserts: *envAsserts

  - it: merges the map form across values files
    template: templates/dex/deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    values:
      - values/env-map-base.yaml
      - values/env-map-tenant.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: dex-credentials
                key: db-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITHUB_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: dex-credentials
                key: github-client-secret
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TENANT_REMOVES
          any: true

  # The chart sets the maintenance retry env by default. A service `env` entry with the same
  # name replaces the default. With two entries of one name, Kubernetes warns and uses the last.
  - it: lets the list form replace a maintenance retry default without a duplicate
    template: templates/logfire-ff-maintenance-scheduler.yaml
    set:
      logfire-ff-maintenance-scheduler.env:
        - name: FF_MAINTENANCE_JOB_MAX_ATTEMPTS
          value: "7"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAINTENANCE_JOB_MAX_ATTEMPTS
            value: "7"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAINTENANCE_JOB_MAX_ATTEMPTS
            value: "5"

  - it: lets the map form replace a maintenance retry default without a duplicate
    template: templates/logfire-ff-compaction-worker.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      logfire-ff-compaction-worker.env:
        FF_MAINTENANCE_RESOURCE_LADDER: "false"
        # A null entry removes the name from `env`, so the default must still apply.
        FF_MAINTENANCE_JOB_MAX_ATTEMPTS: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAINTENANCE_RESOURCE_LADDER
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAINTENANCE_RESOURCE_LADDER
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAINTENANCE_JOB_MAX_ATTEMPTS
            value: "5"
