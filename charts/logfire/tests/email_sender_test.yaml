suite: email sender
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
tests:
  - it: both workloads that send email get the sender
    set:
      smtp:
        host: smtp.example.com
        fromAddress: logfire@example.com
        fromName: Acme Logfire
    templates:
      - templates/logfire-task-runner.yaml
      - templates/logfire-worker.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_FROM_ADDRESS
            value: logfire@example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_FROM_NAME
            value: Acme Logfire
      # External contract: the worker sends alert email inline and reads ON_PREM to name the
      # List-Owner mailbox. Without it the worker treats the install as SaaS and names a
      # pydantic.dev mailbox, so the sender header is wrong even with a correct fromAddress.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ON_PREM
            value: "true"
        template: templates/logfire-worker.yaml

  # An empty value fails platform startup, so an unset sender must not render at all.
  - it: an install without SMTP renders no sender variables
    templates:
      - templates/logfire-task-runner.yaml
      - templates/logfire-worker.yaml
      - templates/logfire-validate-config.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: EMAIL_FROM_ADDRESS
        template: templates/logfire-task-runner.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: EMAIL_FROM_NAME
        template: templates/logfire-worker.yaml

  - it: the bundled maildev gets a placeholder sender on a reserved domain
    set:
      dev:
        deployMaildev: true
      # Maildev replaces smtp.host, so a leftover host does not require a sender.
      smtp:
        host: smtp.example.com
    templates:
      - templates/logfire-task-runner.yaml
      - templates/logfire-worker.yaml
      - templates/logfire-validate-config.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_FROM_ADDRESS
            value: no-reply@logfire.localhost
        template: templates/logfire-task-runner.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMAIL_FROM_ADDRESS
            value: no-reply@logfire.localhost
        template: templates/logfire-worker.yaml
      - hasDocuments:
          count: 0
        template: templates/logfire-validate-config.yaml

  # External contract: the platform reads SMTP_VALIDATE_CERTS, and only an explicit false turns
  # verification off. A false value must still render, and an unset one must not render at all.
  - it: certificate verification renders only when set
    set:
      smtp:
        host: smtp.example.com
        fromAddress: logfire@example.com
        validate_certs: false
    templates:
      - templates/logfire-task-runner.yaml
      - templates/logfire-worker.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMTP_VALIDATE_CERTS
            value: "false"

  - it: certificate verification is left to the platform default when unset
    set:
      smtp:
        host: smtp.example.com
        fromAddress: logfire@example.com
    templates:
      - templates/logfire-task-runner.yaml
      - templates/logfire-worker.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: SMTP_VALIDATE_CERTS
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: SSL_CERT_FILE

  # Cross-template coupling: SSL_CERT_FILE must name the file the SMTP CA volume mounts, and the
  # in-cluster CA must keep its own volume, mount and LOGFIRE_CA_PATH beside it.
  - it: the SMTP CA bundle is trusted without displacing the in-cluster CA
    set:
      inClusterTls:
        enabled: true
        caBundle:
          existingConfigMap:
            name: incluster-ca
      smtp:
        host: smtp.example.com
        fromAddress: logfire@example.com
        caBundle:
          existingSecret:
            name: smtp-ca
            key: bundle.pem
    templates:
      - templates/logfire-task-runner.yaml
      - templates/logfire-worker.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_FILE
            value: /etc/logfire/smtp-ca/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: logfire-smtp-ca-bundle
            mountPath: /etc/logfire/smtp-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: logfire-smtp-ca-bundle
            secret:
              secretName: smtp-ca
              items:
                - key: bundle.pem
                  path: ca.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOGFIRE_CA_PATH
            value: /etc/logfire/incluster-ca/ca.crt
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: logfire-incluster-ca-bundle
            mountPath: /etc/logfire/incluster-ca
            readOnly: true

  # Maildev replaces smtp.host, so the SMTP TLS settings of a leftover host must not apply to it.
  - it: the bundled maildev ignores the SMTP TLS settings
    set:
      dev:
        deployMaildev: true
      smtp:
        validate_certs: false
        caBundle:
          existingConfigMap:
            name: smtp-ca
    templates:
      - templates/logfire-task-runner.yaml
      - templates/logfire-worker.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: SMTP_VALIDATE_CERTS
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: SSL_CERT_FILE
      - notContains:
          path: spec.template.spec.volumes
          any: true
          content:
            name: logfire-smtp-ca-bundle
