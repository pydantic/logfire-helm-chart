suite: objectStore configuration
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  dev:
    deployPostgres: true
tests:
  - it: renders a plain objectStore.uri unchanged
    set:
      objectStore:
        uri: s3://test-bucket
    templates:
      - templates/logfire-ff-config.yaml
    asserts:
      - equal:
          path: data.FF_OBJECT_STORE_URI
          value: s3://test-bucket
        documentSelector:
          path: metadata.name
          value: logfire-ff-base-config
      - equal:
          path: data.FF_FAILOVER_OBJECT_STORE_URI
          value: s3://test-bucket/_ingest_failover
        documentSelector:
          path: metadata.name
          value: logfire-ff-ingest-config

  - it: defaults objectStore.uri and connection settings for the in-cluster store
    set:
      dev:
        deployRustfs: true
    templates:
      - templates/logfire-ff-config.yaml
      - templates/logfire-ff-ingest.yaml
    asserts:
      - equal:
          path: data.FF_OBJECT_STORE_URI
          value: s3://logfire
        documentSelector:
          path: metadata.name
          value: logfire-ff-base-config
        template: templates/logfire-ff-config.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_OBJECT_STORE_URI
            value: s3://logfire
        documentSelector:
          path: kind
          value: StatefulSet
        template: templates/logfire-ff-ingest.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ENDPOINT
            value: http://logfire-rustfs:9000
        documentSelector:
          path: kind
          value: StatefulSet
        template: templates/logfire-ff-ingest.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: logfire-rustfs
        documentSelector:
          path: kind
          value: StatefulSet
        template: templates/logfire-ff-ingest.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_SECRET_ACCESS_KEY
            value: logfire-rustfs
        documentSelector:
          path: kind
          value: StatefulSet
        template: templates/logfire-ff-ingest.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ALLOW_HTTP
            value: "true"
        documentSelector:
          path: kind
          value: StatefulSet
        template: templates/logfire-ff-ingest.yaml

  - it: defaults objectStore connection settings for the deprecated MinIO alias
    set:
      dev:
        deployMinio: true
    templates:
      - templates/logfire-ff-config.yaml
      - templates/logfire-ff-ingest.yaml
    asserts:
      - equal:
          path: data.FF_OBJECT_STORE_URI
          value: s3://logfire
        documentSelector:
          path: metadata.name
          value: logfire-ff-base-config
        template: templates/logfire-ff-config.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ENDPOINT
            value: http://logfire-rustfs:9000
        documentSelector:
          path: kind
          value: StatefulSet
        template: templates/logfire-ff-ingest.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: logfire-minio
        documentSelector:
          path: kind
          value: StatefulSet
        template: templates/logfire-ff-ingest.yaml

  - it: defaults a whitespace objectStore.uri with development RustFS
    set:
      dev:
        deployRustfs: true
      objectStore:
        uri: "   "
    templates:
      - templates/logfire-ff-config.yaml
      - templates/rustfs.yaml
    asserts:
      - equal:
          path: data.FF_OBJECT_STORE_URI
          value: s3://logfire
        documentSelector:
          path: metadata.name
          value: logfire-ff-base-config
        template: templates/logfire-ff-config.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: 'http://127\.0\.0\.1:9000/logfire"'
        documentSelector:
          path: kind
          value: Deployment
        template: templates/rustfs.yaml

  - it: keeps explicit objectStore connection settings for the in-cluster store
    set:
      dev:
        deployRustfs: true
      objectStore:
        uri: s3://custom-bucket
        env:
          AWS_ENDPOINT: http://custom-endpoint:9000
          AWS_ACCESS_KEY_ID: custom-key
          AWS_SECRET_ACCESS_KEY: custom-secret
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_OBJECT_STORE_URI
            value: s3://custom-bucket
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ENDPOINT
            value: http://custom-endpoint:9000
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: custom-key
        documentSelector:
          path: kind
          value: StatefulSet
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: logfire-rustfs
        documentSelector:
          path: kind
          value: StatefulSet

  - it: does not add default AWS credentials when a Secret reference provides them
    set:
      dev:
        deployRustfs: true
      objectStore:
        env:
          AWS_ACCESS_KEY_ID:
            valueFrom:
              secretKeyRef:
                name: minio-creds
                key: accessKey
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-creds
                key: accessKey
        documentSelector:
          path: kind
          value: StatefulSet
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: logfire-rustfs
        documentSelector:
          path: kind
          value: StatefulSet

  - it: accepts the deprecated dev.deployMinio alias without objectStore.uri
    set:
      dev:
        deployMinio: true
      objectStore:
        uri: ""
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - notFailedTemplate: {}

  - it: expands helm templates in objectStore.uri
    set:
      objectStore:
        uri: "s3://logfire-{{ .Release.Name }}-{{ .Release.Namespace }}"
    templates:
      - templates/logfire-ff-config.yaml
      - templates/logfire-ff-ingest.yaml
    asserts:
      - equal:
          path: data.FF_OBJECT_STORE_URI
          value: s3://logfire-lf-default
        documentSelector:
          path: metadata.name
          value: logfire-ff-base-config
        template: templates/logfire-ff-config.yaml
      - equal:
          path: data.FF_FAILOVER_OBJECT_STORE_URI
          value: s3://logfire-lf-default/_ingest_failover
        documentSelector:
          path: metadata.name
          value: logfire-ff-ingest-config
        template: templates/logfire-ff-config.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_OBJECT_STORE_URI
            value: s3://logfire-lf-default
        documentSelector:
          path: kind
          value: StatefulSet
        template: templates/logfire-ff-ingest.yaml

  - it: expands helm templates in objectStore.env string values
    set:
      objectStore:
        uri: s3://test-bucket
        env:
          AWS_ENDPOINT: "http://rustfs-{{ .Release.Name }}:9000"
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ENDPOINT
            value: http://rustfs-lf:9000
        documentSelector:
          path: kind
          value: StatefulSet

  - it: rejects empty template result in production
    set:
      objectStore:
        uri: '{{ "" }}'
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - failedTemplate:
          errorMessage: "objectStore.uri is required. Set objectStore.uri to your S3/Azure/GCS bucket URI (e.g., 's3://bucket-name' or 'az://container-name'). For local development, you can set dev.deployRustfs=true instead."

  - it: rejects missing value template result in production
    set:
      objectStore:
        uri: '{{ .Values.missingBucket | default "" }}'
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - failedTemplate:
          errorMessage: "objectStore.uri is required. Set objectStore.uri to your S3/Azure/GCS bucket URI (e.g., 's3://bucket-name' or 'az://container-name'). For local development, you can set dev.deployRustfs=true instead."

  - it: rejects whitespace template result in production
    set:
      objectStore:
        uri: '{{ "   " }}'
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - failedTemplate:
          errorMessage: "objectStore.uri is required. Set objectStore.uri to your S3/Azure/GCS bucket URI (e.g., 's3://bucket-name' or 'az://container-name'). For local development, you can set dev.deployRustfs=true instead."

  - it: rejects whitespace literal in production
    set:
      objectStore:
        uri: "   "
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - failedTemplate:
          errorMessage: "objectStore.uri is required. Set objectStore.uri to your S3/Azure/GCS bucket URI (e.g., 's3://bucket-name' or 'az://container-name'). For local development, you can set dev.deployRustfs=true instead."

  - it: rejects empty literal in production
    set:
      objectStore:
        uri: ''
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - failedTemplate:
          errorMessage: "objectStore.uri is required. Set objectStore.uri to your S3/Azure/GCS bucket URI (e.g., 's3://bucket-name' or 'az://container-name'). For local development, you can set dev.deployRustfs=true instead."

  - it: defaults an empty template result to the in-cluster bucket with development RustFS
    set:
      dev:
        deployRustfs: true
      objectStore:
        uri: '{{ "" }}'
    templates:
      - templates/logfire-validate-config.yaml
      - templates/logfire-ff-config.yaml
    asserts:
      - equal:
          path: data.FF_OBJECT_STORE_URI
          value: s3://logfire
        documentSelector:
          path: metadata.name
          value: logfire-ff-base-config
        template: templates/logfire-ff-config.yaml

  - it: preserves a literal GCS URI
    set:
      objectStore:
        uri: gs://tenant-app-data/logfire
    templates:
      - templates/logfire-ff-config.yaml
      - templates/logfire-ff-ingest.yaml
    asserts:
      - equal:
          path: data.FF_OBJECT_STORE_URI
          value: gs://tenant-app-data/logfire
        documentSelector:
          path: metadata.name
          value: logfire-ff-base-config
        template: templates/logfire-ff-config.yaml
      - equal:
          path: data.FF_FAILOVER_OBJECT_STORE_URI
          value: gs://tenant-app-data/logfire/_ingest_failover
        documentSelector:
          path: metadata.name
          value: logfire-ff-ingest-config
        template: templates/logfire-ff-config.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_OBJECT_STORE_URI
            value: gs://tenant-app-data/logfire
        documentSelector:
          path: kind
          value: StatefulSet
        template: templates/logfire-ff-ingest.yaml

  - it: rejects an objectStore.volumes entry named tmp
    set:
      objectStore:
        uri: s3://test-bucket
        volumes:
          - name: tmp
            emptyDir: {}
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - failedTemplate:
          errorMessage: "objectStore.volumes[0].name 'tmp' is reserved by the chart. Rename the volume, because chart-owned containers mount a volume with that name. Reserved names: tmp, scratch-data, ingest-data."

  - it: accepts an objectStore.volumes entry named logfire-data
    set:
      objectStore:
        uri: s3://test-bucket
        volumes:
          - name: logfire-data
            emptyDir: {}
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - notFailedTemplate: {}

  - it: rejects an objectStore.volumeMounts entry at /tmp
    set:
      objectStore:
        uri: s3://test-bucket
        volumeMounts:
          - name: credentials
            mountPath: /tmp
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - failedTemplate:
          errorMessage: "objectStore.volumeMounts[0].mountPath '/tmp' is reserved by the chart. Use another mount path, because chart-owned containers mount a writable volume at that path. Reserved paths: /tmp, /scratch, /fusionfire/ingest-data."

  - it: accepts an objectStore.volumeMounts entry at /var/lib/logfire
    set:
      objectStore:
        uri: s3://test-bucket
        volumeMounts:
          - name: credentials
            mountPath: /var/lib/logfire
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - notFailedTemplate: {}

  - it: accepts objectStore volumes and mounts outside the reserved names and paths
    set:
      objectStore:
        uri: s3://test-bucket
        volumes:
          - name: credentials
            secret:
              secretName: object-store-credentials
        volumeMounts:
          - name: credentials
            mountPath: /etc/object-store
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - notFailedTemplate: {}

  - it: rejects an objectStore.volumes entry that collides with an in-cluster TLS volume
    set:
      inClusterTls:
        enabled: true
        caBundle:
          existingConfigMap:
            name: logfire-incluster-ca
      objectStore:
        uri: s3://test-bucket
        volumes:
          - name: logfire-incluster-tls
            emptyDir: {}
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - failedTemplate:
          errorMessage: "objectStore.volumes[0].name 'logfire-incluster-tls' is reserved by the chart. Rename the volume, because chart-owned containers mount a volume with that name. Reserved names: tmp, scratch-data, ingest-data, logfire-incluster-tls, logfire-incluster-ca-bundle."

  - it: rejects an objectStore.volumeMounts entry that collides with an in-cluster TLS mount
    set:
      inClusterTls:
        enabled: true
        caBundle:
          existingConfigMap:
            name: logfire-incluster-ca
      objectStore:
        uri: s3://test-bucket
        volumeMounts:
          - name: credentials
            mountPath: /etc/logfire/incluster-ca
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - failedTemplate:
          errorMessage: "objectStore.volumeMounts[0].mountPath '/etc/logfire/incluster-ca' is reserved by the chart. Use another mount path, because chart-owned containers mount a writable volume at that path. Reserved paths: /tmp, /scratch, /fusionfire/ingest-data, /etc/tls, /etc/logfire/incluster-ca."

  - it: accepts in-cluster TLS volume names when in-cluster TLS is disabled
    set:
      objectStore:
        uri: s3://test-bucket
        volumes:
          - name: logfire-incluster-tls
            emptyDir: {}
        volumeMounts:
          - name: logfire-incluster-tls
            mountPath: /etc/tls
    templates:
      - templates/logfire-validate-config.yaml
    asserts:
      - notFailedTemplate: {}
