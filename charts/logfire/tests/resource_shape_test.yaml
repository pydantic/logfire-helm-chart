suite: resource shape normalization
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket

tests:
  - it: legacy flat resources set requests and limits
    set:
      sizingPreset: standard
      logfire-ff-ingest:
        resources:
          cpu: "750m"
          memory: "3Gi"
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 750m
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 3Gi
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 750m
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 3Gi
        documentSelector:
          path: kind
          value: StatefulSet

  - it: nested requests render without limits
    set:
      sizingPreset: standard
      logfire-ff-ingest:
        resources:
          requests:
            cpu: "250m"
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
        documentSelector:
          path: kind
          value: StatefulSet
      - notExists:
          path: spec.template.spec.containers[0].resources.limits
        documentSelector:
          path: kind
          value: StatefulSet

  - it: legacy flat override keeps the migrated preset limits for untouched dimensions
    set:
      sizingPreset: standard
      logfire-ff-bcache:
        resources:
          cpu: "250m"
    templates:
      - templates/logfire-ff-bcache.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 250m
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 6Gi
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 6Gi
        documentSelector:
          path: kind
          value: StatefulSet

  - it: a sizing preset sizes the bcache disk and its capacity
    set:
      sizingPreset: small
    templates:
      - templates/logfire-ff-bcache.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 4Gi
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_BCACHE_DISK_CAPACITY
            value: "3276MB"
        documentSelector:
          path: kind
          value: StatefulSet

  - it: bounds Cold compaction jobs without a sizing preset
    templates:
      - templates/logfire-ff-maintenance-scheduler.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAX_COLD_COMPACTION_JOBS
            value: "16"

  - it: the large preset sets its own Cold compaction bound over the inherited standard value
    set:
      sizingPreset: large
    templates:
      - templates/logfire-ff-maintenance-scheduler.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAX_COLD_COMPACTION_JOBS
            value: "96"
        documentSelector:
          path: kind
          value: Deployment

  - it: an explicit 0 turns the Cold compaction bound off under a sizing preset
    set:
      sizingPreset: standard
      logfire-ff-maintenance-scheduler:
        maxColdCompactionJobs: 0
    templates:
      - templates/logfire-ff-maintenance-scheduler.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAX_COLD_COMPACTION_JOBS
            value: "0"
        documentSelector:
          path: kind
          value: Deployment

  - it: null workload overrides fall back to the chart defaults
    set:
      image:
        tag: pinned
      logfire-ff-query-api:
        image: null
        service: null
      logfire-backend:
        securityContext: null
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ":pinned$"
        template: templates/logfire-ff-query-api.yaml
        documentSelector:
          path: kind
          value: Deployment
      - isNullOrEmpty:
          path: metadata.annotations
        template: templates/logfire-ff-query-api.yaml
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
        template: templates/logfire-backend.yaml
        documentSelector:
          path: kind
          value: Deployment

  - it: the otel_collector.prometheus false shorthand leaves the exporter off
    set:
      otel_collector:
        prometheus: false
    templates:
      - templates/logfire-otel-collector.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - notContains:
          path: spec.ports
          content:
            name: prometheus-http
          any: true

  - it: bundled RustFS takes the bucket from an explicit s3 URI when rustfs.bucket is null
    set:
      dev:
        deployRustfs: true
      objectStore:
        uri: s3://explicit-bucket/prefix
      rustfs:
        bucket: null
    templates:
      - templates/rustfs.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command[2]
          pattern: "http://127.0.0.1:9000/explicit-bucket\""

  - it: Dex connectors and static clients keyed by name render as lists
    set:
      logfire-dex:
        config:
          connectors:
            github:
              type: github
              id: github
              name: GitHub
              config:
                clientID: a
          staticClients:
            extra:
              id: extra
              name: Extra
    templates:
      - templates/dex/secret.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          decodeBase64: true
          pattern: "(?m)^connectors:\\n- config:"
      - matchRegex:
          path: data["config.yaml"]
          decodeBase64: true
          pattern: "(?m)^staticClients:\\n(- [\\s\\S]*)?- id: extra"

  - it: false Dex lists render as empty lists
    set:
      logfire-dex:
        config:
          connectors: false
          staticClients: false
    templates:
      - templates/dex/secret.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          decodeBase64: true
          pattern: "(?m)^connectors: \\[\\]$"
      - matchRegex:
          path: data["config.yaml"]
          decodeBase64: true
          pattern: "(?m)^staticClients:\\n- "

  - it: a false group mapping is left out
    set:
      groupOrganizationMapping: false
    templates:
      - templates/logfire-backend.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GROUP_ORGANIZATION_MAPPING
          any: true

  - it: false project roles keep the organization role
    set:
      groupOrganizationMapping:
        - group_id: admins
          organization_roles:
            - organization_name: acme
              role: admin
              project_roles: false
    templates:
      - templates/logfire-backend.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GROUP_ORGANIZATION_MAPPING
            value: '[{"group_id":"admins","organization_roles":[{"organization_name":"acme","role":"admin"}]}]'

  - it: preStop uses the native sleep action
    templates:
      - templates/logfire-backend.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop
          value:
            sleep:
              seconds: 5
