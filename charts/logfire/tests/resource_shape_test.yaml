suite: resource shape normalization
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket

tests:
  - it: legacy flat resources set requests and limits
    set:
      sizingPreset: standard
      logfire-ff-ingest:
        resources:
          cpu: "750m"
          memory: "3Gi"
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 750m
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 3Gi
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 750m
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 3Gi
        documentSelector:
          path: kind
          value: StatefulSet

  - it: nested requests render without limits
    set:
      sizingPreset: standard
      logfire-ff-ingest:
        resources:
          requests:
            cpu: "250m"
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
        documentSelector:
          path: kind
          value: StatefulSet
      - notExists:
          path: spec.template.spec.containers[0].resources.limits
        documentSelector:
          path: kind
          value: StatefulSet

  - it: legacy flat override keeps the migrated preset limits for untouched dimensions
    set:
      sizingPreset: standard
      logfire-ff-crud-api:
        resources:
          cpu: "250m"
    templates:
      - templates/logfire-ff-crud-api.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 250m
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
        documentSelector:
          path: kind
          value: Deployment

  - it: a sizing preset sizes the bcache disk and its capacity
    set:
      sizingPreset: small
    templates:
      - templates/logfire-ff-bcache.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 4Gi
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_BCACHE_DISK_CAPACITY
            value: "3276MB"
        documentSelector:
          path: kind
          value: StatefulSet

  - it: bounds Cold compaction jobs without a sizing preset
    templates:
      - templates/logfire-ff-maintenance-scheduler.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAX_COLD_COMPACTION_JOBS
            value: "16"

  - it: the large preset sets its own Cold compaction bound over the inherited standard value
    set:
      sizingPreset: large
    templates:
      - templates/logfire-ff-maintenance-scheduler.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAX_COLD_COMPACTION_JOBS
            value: "96"
        documentSelector:
          path: kind
          value: Deployment

  - it: an explicit 0 turns the Cold compaction bound off under a sizing preset
    set:
      sizingPreset: standard
      logfire-ff-maintenance-scheduler:
        maxColdCompactionJobs: 0
    templates:
      - templates/logfire-ff-maintenance-scheduler.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FF_MAX_COLD_COMPACTION_JOBS
            value: "0"
        documentSelector:
          path: kind
          value: Deployment
