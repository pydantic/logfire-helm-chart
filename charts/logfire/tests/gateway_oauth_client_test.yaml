suite: self-hosted gateway OAuth client
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
  ingress:
    enabled: false
  gateway:
    tls: true
    hostnames:
      - logfire.example.com
tests:
  - it: does not statically register the Gateway CLI for a TLS CIMD deployment
    set:
      logfire-ai-gateway:
        enabled: true
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "BOOTSTRAPPED_ORGANIZATIONS")].value
          pattern: 'logfire-gateway\.json'
        documentSelector:
          path: kind
          value: Deployment

  - it: serves the Gateway CLI client metadata document when TLS and the AI gateway are enabled
    set:
      logfire-ai-gateway:
        enabled: true
    templates:
      - templates/logfire-frontend-service-config.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /clients/logfire-gateway\.json'
        documentSelector:
          path: metadata.name
          value: logfire-frontend-nginx-config
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '"client_id":"https://logfire\.example\.com/clients/logfire-gateway\.json"'
        documentSelector:
          path: metadata.name
          value: logfire-frontend-nginx-config
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '"grant_types":\["authorization_code","refresh_token","urn:ietf:params:oauth:grant-type:device_code"\]'
        documentSelector:
          path: metadata.name
          value: logfire-frontend-nginx-config
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '"token_endpoint_auth_method":"none"'
        documentSelector:
          path: metadata.name
          value: logfire-frontend-nginx-config
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '"client_uri":"https://pydantic\.dev/docs/ai/overview/gateway/"'
        documentSelector:
          path: metadata.name
          value: logfire-frontend-nginx-config
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '"logo_uri":"https://logfire\.pydantic\.dev/clients/logfire-gateway\.svg"'
        documentSelector:
          path: metadata.name
          value: logfire-frontend-nginx-config

  - it: does not register the Gateway CLI when the AI gateway is disabled
    set:
      logfire-ai-gateway:
        enabled: false
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "BOOTSTRAPPED_ORGANIZATIONS")].value
          pattern: 'logfire-gateway\.json'
        documentSelector:
          path: kind
          value: Deployment

  - it: does not serve client metadata when the AI gateway is disabled
    set:
      logfire-ai-gateway:
        enabled: false
    templates:
      - templates/logfire-frontend-service-config.yaml
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'logfire-gateway\.json'
        documentSelector:
          path: metadata.name
          value: logfire-frontend-nginx-config

  - it: does not enable OAuth clients for a non-local plaintext deployment
    set:
      logfire-ai-gateway:
        enabled: true
      gateway:
        tls: false
        hostnames:
          - logfire.example.com
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "BOOTSTRAPPED_ORGANIZATIONS")].value
          pattern: '"oauth_clients"'
        documentSelector:
          path: kind
          value: Deployment

  - it: does not serve CIMD over plaintext
    set:
      logfire-ai-gateway:
        enabled: true
      gateway:
        tls: false
        hostnames:
          - logfire.example.com
    templates:
      - templates/logfire-frontend-service-config.yaml
    asserts:
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'logfire-gateway\.json'
        documentSelector:
          path: metadata.name
          value: logfire-frontend-nginx-config

  - it: registers the Gateway CLI for local plaintext development
    set:
      logfire-ai-gateway:
        enabled: true
      gateway:
        tls: false
        hostnames:
          - localhost
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "BOOTSTRAPPED_ORGANIZATIONS")].value
          pattern: '"client_id":"http://localhost/clients/logfire-gateway\.json"'
        documentSelector:
          path: kind
          value: Deployment
