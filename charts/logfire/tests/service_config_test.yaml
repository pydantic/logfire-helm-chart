suite: routing config routes
templates:
  - templates/logfire-service-config.yaml
release:
  name: lf
  namespace: default
tests:
  - it: routes core paths to their backends
    set:
      sizingPreset: tiny
    asserts:
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "acl path_query_v2 path /v2/query"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "use_backend logfire-ff-query-api if path_query_v2"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "backend logfire-ff-query-api\\n  balance roundrobin\\n  option httpchk GET /health\\n  http-check expect status 200\\n  timeout connect 3s\\n  timeout server 120s"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "acl path_ingest path_reg -i \\^/v1/\\(traces\\|metrics\\|logs\\)\\$"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "use_backend logfire-ingest if path_ingest"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "acl path_backend path_reg -i \\^/\\(ui-api\\|v1\\|api\\)/"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "acl path_backend path -i /\\.well-known/oauth-protected-resource /\\.well-known/oauth-protected-resource/ /\\.well-known/oauth-protected-resource/v1"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "use_backend logfire-backend if path_backend"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "acl path_dex path_beg /auth-api"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "use_backend logfire-dex if path_dex"

  - it: adds the AI gateway routing when its subchart is enabled
    set:
      sizingPreset: tiny
      logfire-ai-gateway:
        enabled: true
    asserts:
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "acl path_ai_gateway path /proxy\\n"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "acl path_ai_gateway path_beg /proxy/"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "use_backend logfire-ai-gateway if path_ai_gateway"
      # Only the /proxy segment is matched; sibling paths such as hashed
      # frontend assets (/proxy-<hash>.js) stay on the default backend.
      - notMatchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "path_beg /proxy "
      - notMatchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "path_beg /proxy\\n"

  - it: omits the AI gateway routing when its subchart is disabled
    set:
      sizingPreset: tiny
      logfire-ai-gateway:
        enabled: false
    asserts:
      - notMatchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "use_backend logfire-ai-gateway"

  - it: adds the remote MCP routing when its subchart is enabled
    set:
      sizingPreset: tiny
      logfire-remote-mcp:
        enabled: true
    asserts:
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "acl path_remote_mcp path /mcp"
      - matchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "use_backend logfire-remote-mcp if path_remote_mcp"

  - it: omits the remote MCP routing when its subchart is disabled
    set:
      sizingPreset: tiny
      logfire-remote-mcp:
        enabled: false
    asserts:
      - notMatchRegex:
          path: stringData["haproxy.cfg"]
          pattern: "use_backend logfire-remote-mcp"
