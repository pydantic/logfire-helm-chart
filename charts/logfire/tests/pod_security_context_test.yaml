suite: pod security context defaults for the non-root Fusionfire images
release:
  name: lf
  namespace: default
set:
  adminEmail: test@example.com
  objectStore:
    uri: s3://test-bucket
  dev:
    deployPostgres: true
tests:
  - it: defaults fsGroup 1000 and OnRootMismatch on the ingest StatefulSet
    templates:
      - templates/logfire-ff-ingest.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        documentSelector:
          path: kind
          value: StatefulSet

  - it: defaults fsGroup 1000 and OnRootMismatch on the byte-cache Deployment
    templates:
      - templates/logfire-ff-cache-byte.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        documentSelector:
          path: kind
          value: Deployment

  - it: leaves non-Fusionfire workloads without the Fusionfire defaults
    templates:
      - templates/logfire-backend.yaml
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
        documentSelector:
          path: kind
          value: Deployment

  - it: applies the Fusionfire defaults to a query worker with a scratch volume
    templates:
      - templates/logfire-ff-query-worker.yaml
    set:
      logfire-ff-query-worker:
        enabled: true
        scratchVolume:
          storage: 2Gi
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        documentSelector:
          path: kind
          value: Deployment

  - it: merges chart-wide keys over the Fusionfire defaults
    templates:
      - templates/logfire-ff-ingest.yaml
    set:
      podSecurityContext:
        runAsUser: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsUser: 2000
        documentSelector:
          path: kind
          value: StatefulSet

  - it: lets a chart-wide fsGroup override the Fusionfire default
    templates:
      - templates/logfire-ff-ingest.yaml
    set:
      podSecurityContext:
        fsGroup: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
        documentSelector:
          path: kind
          value: StatefulSet

  - it: lets a per-service pod security context override the chart-wide context and the defaults
    templates:
      - templates/logfire-ff-cache-byte.yaml
    set:
      podSecurityContext:
        fsGroup: 2000
        runAsUser: 2000
      logfire-ff-cache-byte:
        podSecurityContext:
          fsGroup: 3000
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 3000
            fsGroupChangePolicy: OnRootMismatch
            runAsUser: 2000
        documentSelector:
          path: kind
          value: Deployment

  - it: keeps the Fusionfire defaults when the release values carry an empty pod security context
    templates:
      - templates/logfire-ff-ingest.yaml
    set:
      podSecurityContext: {}
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        documentSelector:
          path: kind
          value: StatefulSet

  - it: keeps the Fusionfire defaults when the release values have no pod security context key
    templates:
      - templates/logfire-ff-ingest.yaml
    set:
      podSecurityContext: null
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        documentSelector:
          path: kind
          value: StatefulSet
