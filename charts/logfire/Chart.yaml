apiVersion: v2
version: 0.14.2-rc.5
name: logfire
description: Helm chart for self-hosted Pydantic Logfire

appVersion: "aa548562d8"

dependencies:
  - name: postgresql
    version: "16.7.27"
    repository: "https://charts.bitnami.com/bitnami"
    condition: dev.deployPostgres
  - name: cert-manager
    version: "v1.19.2"
    repository: "https://charts.jetstack.io"
    condition: dev.deployCertManager
