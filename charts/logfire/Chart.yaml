apiVersion: v2
version: 0.13.48-rc.8
name: logfire
description: Helm chart for self-hosted Pydantic Logfire

appVersion: "d379c73e"

dependencies:
  - name: postgresql
    version: "16.7.27"
    repository: "https://charts.bitnami.com/bitnami"
    condition: dev.deployPostgres
  - name: cert-manager
    version: "v1.19.2"
    repository: "https://charts.jetstack.io"
    condition: dev.deployCertManager
