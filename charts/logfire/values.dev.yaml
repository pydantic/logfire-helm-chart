# Development values for local evaluation/testing.
# Uses in-cluster Postgres/RustFS/MailDev and expects you to port-forward `logfire-service`.

# -- Image pull secrets used by all pods (required for Logfire images)
imagePullSecrets:
  - logfire-image-key

adminEmail: hello@example.dev

ingress:
  enabled: false
  tls: false
  # Used for URL generation/CORS; port-forward `logfire-service` to match this.
  hostnames:
    - localhost:8080
  ingressClassName: ""
  annotations: {}

# With dev.deployRustfs the chart points the workloads at RustFS and reads its credentials from
# the logfire-rustfs Secret.
objectStore:
  uri: s3://logfire

dev:
  deployPostgres: true
  deployRustfs: true
  deployMaildev: true
