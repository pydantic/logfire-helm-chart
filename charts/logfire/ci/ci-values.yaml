adminEmail: hello@example.dev
sizingPreset: tiny

# -- test with security context
podSecurityContext:
  fsGroup: 2000

ingress:
  enabled: true
  tls: false
  hostnames:
  - logfire.example.com
  maildevHostname: maildev.example.com

# Exercise HTTPS public-URL rendering while the Kind ingress itself remains HTTP.
gateway:
  tls: true

objectStore:
  uri: s3://logfire
  env:
    AWS_ACCESS_KEY_ID: logfire-rustfs
    AWS_SECRET_ACCESS_KEY: logfire-rustfs
    AWS_ENDPOINT: http://logfire-rustfs:9000
    AWS_ALLOW_HTTP: "true"

ai:
  model: openai:gpt-4o
  openAi:
    apiKey: dummy

dev:
  deployPostgres: true
  deployRustfs: true
  deployMaildev: true

postgresSecret:
  enabled: true
  name: "pg-dsns"

existingSecret:
  enabled: true
  name: "logfire-tokens"

adminSecret:
  enabled: true
  name: "logfire-admin"

adminApiKeys:
  - name: ci-automation
    scopes: ["instance:admin"]
    secretName: logfire-tokens
    secretKey: logfire-admin-api-key

existingGatewaySecret:
  enabled: true
  name: "logfire-gateway"

logfire-dex:
  config:
    storage:
      type: postgres
      config:
        host: logfire-postgres
        port: 5432
        user: postgres
        database: dex
        password: postgres
        ssl:
          mode: disable
    staticClients: []

logfire-backend:
  pdb:
    minUnavailable: 1

logfire-ff-query-api:
  replicas: 2
  autoscaling:
    hpa:
      enabled: false
    keda:
      enabled: false

logfire-ff-maintenance-worker:
  scratchVolume:
    storageClassName: standard

logfire-ff-ingest:
  volumeClaimTemplates:
    storageClassName: standard
    storage: "1Gi"
  # Turn on the opt-in ingest endpoints so the integration suite can prove the
  # chart routes them. A list replaces the default env, so keep its RUST_LOG.
  env:
    - name: RUST_LOG
      value: warn,otel::tracing=info
    - name: FF_ENABLE_PROFILES_INGEST
      value: "true"
    - name: FF_ENABLE_FIREHOSE_INGEST
      value: "true"

logfire-ff-bcache:
  replicas: 1
  pdb:
    minAvailable: 0
  disk:
    storageClassName: standard
    storage: "1Gi"

logfire-ff-compaction-worker:
  scratchVolume:
    storageClassName: standard

logfire-ai-gateway:
  enabled: true

devPostgres:
  persistence:
    size: 1Gi

# Keep object storage across pod restarts, so an upgrade that rolls RustFS keeps the data
# that tests wrote before it.
rustfs:
  persistence:
    enabled: true
    storageClassName: standard
    size: 2Gi
