adminEmail: hello@example.dev
sizingPreset: tiny

# Kind has one node, so all results-store consumers share one RWO volume.
scheduledQueryResults:
  persistence:
    accessModes: [ReadWriteOnce]
    storage: 1Gi

# -- test with security context
podSecurityContext:
  fsGroup: 2000

ingress:
  enabled: true
  tls: false
  hostnames:
  - logfire.example.com
  maildevHostname: maildev.example.com

# Exercise HTTPS public-URL rendering while the Kind ingress itself remains HTTP.
gateway:
  tls: true

objectStore:
  uri: s3://logfire
  env:
    AWS_ACCESS_KEY_ID: logfire-rustfs
    AWS_SECRET_ACCESS_KEY: logfire-rustfs
    AWS_ENDPOINT: http://logfire-rustfs:9000
    AWS_ALLOW_HTTP: "true"

ai:
  model: openai:gpt-4o
  openAi:
    apiKey: dummy

dev:
  deployPostgres: true
  deployRustfs: true
  deployMaildev: true

postgresSecret:
  enabled: true
  name: "pg-dsns"

existingSecret:
  enabled: true
  name: "logfire-tokens"

adminSecret:
  enabled: true
  name: "logfire-admin"

existingGatewaySecret:
  enabled: true
  name: "logfire-gateway"

logfire-dex:
  config:
    storage:
      type: postgres
      config:
        host: logfire-postgres
        port: 5432
        user: postgres
        database: dex
        password: postgres
        ssl:
          mode: disable
    staticClients: []

logfire-backend:
  pdb:
    minUnavailable: 1

logfire-ff-maintenance-worker:
  scratchVolume:
    storageClassName: standard

logfire-ff-ingest:
  volumeClaimTemplates:
    storageClassName: standard
    storage: "1Gi"

logfire-ff-bcache:
  replicas: 1
  pdb:
    minAvailable: 0
  disk:
    storageClassName: standard
    storage: "1Gi"

logfire-ff-compaction-worker:
  scratchVolume:
    storageClassName: standard

logfire-ai-gateway:
  enabled: true

postgresql:
  primary:
    persistence:
      size: 1Gi

rustfs:
  persistence:
    enabled: false
